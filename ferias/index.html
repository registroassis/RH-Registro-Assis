<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indicação de Férias 2027 · Registro Assis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#152A50;--brass:#D3A521;--blue:#1B4F91;--bg:#F5F5F4;--surface:#fff;--text:#1D2433;--muted:#5E6779;--line:#D5D8E0;--band:#EEF1F7;
--ok:#1E7F57;--okbg:#E3F4EC;--bad:#B3261E;--badbg:#FDE8E6;--warn:#7A5A00;--warnbg:#FFF4D6;--o1:#1B4F91;--o2:#2E86C1;--o3:#7FB3DE;--prog:#B7BCC8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E6E9F0;--bg:#0F1626;--surface:#161F33;--text:#E6E9F0;--muted:#9AA3B8;--line:#2B3650;--band:#1B2640;--ok:#5CC49A;--okbg:#14352A;--bad:#FF8A80;--badbg:#401B18;--warn:#F1CF73;--warnbg:#3A2F10;--o1:#5FA6E8;--o2:#4C8FD0;--o3:#3A6FA3;--prog:#5B6479;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.w{max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:3px solid var(--brass);margin-bottom:16px}
h1{font:700 20px/1.2 Poppins,sans-serif;color:var(--ink);margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}.dot.off{background:var(--bad)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.who b{font-weight:600}
button,.btn{font:600 13px Poppins,sans-serif;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.pri{background:var(--brass);color:#1b1500;border-color:var(--brass)}}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
select,textarea,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--brass);color:#1b1500;border-color:var(--brass)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.dcard{border:2px solid var(--brass);border-radius:12px;background:var(--surface);padding:14px 16px}
.dcard .l{font:600 12px Poppins,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dcard .v{font:700 28px/1.2 Poppins,sans-serif;color:var(--ink);margin-top:4px}
.dcard .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dcard.lim{background:var(--warnbg);border-color:var(--brass)}.dcard.lim .v{color:var(--warn)}
td.dd{background:color-mix(in srgb,var(--brass) 12%,transparent);font-weight:700;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
h2{font:600 15px Poppins,sans-serif;color:var(--ink);margin:0 0 10px}
h3{font:600 13px Poppins,sans-serif;color:var(--ink);margin:14px 0 6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:12.5px}
.hint{font-size:12px;color:var(--muted)}
.msg{padding:6px 10px;border-radius:6px;font-size:12.5px;margin-top:4px}
.msg.bad{background:var(--badbg);color:var(--bad)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.ok{background:var(--okbg);color:var(--ok)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:75vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:2;background:#152A50;color:#fff;font:600 11px/1.25 Poppins,sans-serif;text-align:left;padding:8px 8px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.sec td{background:var(--band);font:600 12px Poppins,sans-serif;color:var(--ink);position:sticky;left:0}
td.nm{font-weight:600;min-width:170px}
.opt{display:block;line-height:1.3}.opt small{display:block;color:var(--muted);font-size:11px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.pend{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.me td{background:color-mix(in srgb,var(--brass) 14%,transparent)}
.cal th.m{text-align:center;min-width:54px}
.cal td.c{text-align:center;padding:4px 2px;font-size:11px;font-weight:600;min-width:54px;border-left:1px solid var(--line)}
.c .p{display:block;border-radius:4px;color:#fff;padding:2px 0;margin:1px 2px}
.p1{background:var(--o1)}.p2{background:var(--o2)}.p3{background:var(--o3);color:#0c1b30!important}.pp{background:var(--prog);color:#10151f!important}.px{background:var(--bad)!important;color:#fff!important}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.prog{height:8px;background:var(--band);border-radius:6px;overflow:hidden;min-width:140px}.prog>i{display:block;height:100%;background:var(--ok)}
.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;list-style:none}.log{padding:0;margin:0}.log small{color:var(--muted)}
.center{max-width:480px;margin:40px auto}
footer{margin-top:24px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
footer a,footer button.lnk{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#152A50;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9;max-width:90vw}
.ban{background:var(--badbg);color:var(--bad);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.rhbar{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.rchip{display:inline-flex;align-items:center;gap:4px;background:var(--band);border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 9px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap}
.rchip.nova{border-color:var(--brass)}
.rchip button{border:0;background:none;padding:0 5px;font-size:15px;line-height:1;color:var(--bad);cursor:pointer;border-radius:50%}
.addr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.addr select{font-size:12px;padding:5px 6px;max-width:170px}.addr button{padding:5px 10px;font-size:12px}

/* ===== identidade visual (modelo institucional) ===== */
body{padding:0 0 40px}
.w{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.topbar{background:#fff;border-bottom:3px solid var(--brass);box-shadow:0 2px 14px rgba(14,29,66,.06);margin-bottom:18px;position:relative;z-index:2}
.topbar header{border:0;margin:0;padding:14px 0;max-width:1280px;margin-inline:auto}
.bl{display:flex;align-items:center;gap:22px;min-width:0}
.logo{height:62px;width:auto;display:block}
.vr{width:2px;align-self:stretch;min-height:44px;background:#0E1D42;opacity:.85;border-radius:2px}
.topbar h1{font:700 26px/1.15 Poppins,sans-serif;color:#0E1D42;letter-spacing:-.01em}
.topbar .sub{font-size:13px;color:#5E6779;margin-top:4px}
.topbar .who{color:#1D2433;font-size:14px;gap:14px}
.topbar .who b{color:#0E1D42}
.topbar .live{font-size:14px;color:#5E6779;font-weight:600}.topbar .live:has(.dot.on){color:#1E7F57}.topbar .live:has(.dot.off){color:#B3261E}
.sep{width:1px;height:22px;background:#C9CED8}
#trocar{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #0E1D42;color:#0E1D42;background:#fff;border-radius:24px;padding:8px 18px;font-size:14px}
#trocar[hidden]{display:none}
#trocar:hover{background:#0E1D42;color:#fff}
@media (max-width:760px){.logo{height:46px}.topbar h1{font-size:20px}.bl{gap:12px}.vr{min-height:36px}}
@media (max-width:520px){.bl .vr,.bl .sub{display:none}}
/* tela de entrada */
.deco{display:none}
body.is-login{background:linear-gradient(180deg,#F7F8FB 0%,#EEF1F6 100%)}
body.is-login .deco{display:block;position:fixed;pointer-events:none;z-index:0}
.deco.bld{left:0;bottom:90px;width:min(520px,42vw);opacity:.22;color:#7F8DA8}
.deco.wave{right:0;bottom:0;width:min(760px,60vw)}
body.is-login .w,body.is-login footer{position:relative;z-index:1}
.login{max-width:1040px;margin:70px auto 40px;background:#fff;border:1px solid #E3E6EC;border-radius:22px;box-shadow:0 14px 40px rgba(14,29,66,.10);padding:44px 48px 48px}
.lhead{display:flex;align-items:center;gap:28px;margin-bottom:34px}
.lhead svg{flex:0 0 auto;color:#0E1D42}
.lhead .vr{background:var(--brass);min-height:78px;opacity:1}
.lhead h2{font:700 clamp(28px,4vw,46px)/1.1 Poppins,sans-serif;color:#0E1D42;margin:0}
.lhead p{margin:8px 0 0;color:#5E6779;font-size:clamp(15px,1.8vw,20px)}
.login label.big{display:block;font:700 18px Poppins,sans-serif;color:#0E1D42;margin-bottom:10px}
.login label.big .req{color:#D0302A}
.login select{width:100%;font-size:18px;padding:16px 20px;border-radius:12px;border:1.5px solid #D5D8E0;background:#F9FAFC;color:#1D2433;margin-bottom:28px;height:auto}
.login .go{display:inline-flex;align-items:center;justify-content:center;gap:14px;width:min(100%,446px);background:#0E1D42;color:#fff;border:0;border-radius:12px;padding:18px 24px;font:700 22px Poppins,sans-serif}
.login .go:hover{background:#1B2E5E}
@media (max-width:640px){.login{margin-top:24px;padding:26px 20px 28px;border-radius:16px}.lhead{gap:14px}.lhead svg{width:56px;height:56px}.lhead .vr{min-height:56px}.login .go{width:100%;font-size:18px}}
footer{align-items:center}
.finfo{display:inline-flex;align-items:center;gap:12px;color:#1D2433;font-size:14px}
.finfo i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#0E1D42;color:#fff;font:700 15px Georgia,serif;font-style:normal;flex:0 0 auto}
body.is-login>div.w{min-height:calc(100vh - 120px);display:flex;flex-direction:column}body.is-login main{flex:1}body.is-login footer{border-top:3px solid var(--brass);margin-top:0;padding:18px 0;background:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.is-login{background:linear-gradient(180deg,#0F1626,#141D31)}:root:not([data-theme="light"]) .login{background:var(--surface);border-color:var(--line)}:root:not([data-theme="light"]) .lhead h2,:root:not([data-theme="light"]) .login label.big,:root:not([data-theme="light"]) .lhead svg{color:var(--ink)}:root:not([data-theme="light"]) .login select{background:var(--bg);color:var(--text);border-color:var(--line)}:root:not([data-theme="light"]) .login .go{background:var(--brass);color:#1b1500}:root:not([data-theme="light"]) .finfo{color:var(--text)}:root:not([data-theme="light"]) body.is-login footer{background:transparent}}
@media print{.topbar{box-shadow:none}.deco{display:none!important}.logo{height:40px}}

/* ===== tela "Minhas indicações" (modelo dashboard) ===== */
.dates{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:20px}
.dc{display:flex;align-items:center;gap:18px;border:2px solid;border-radius:16px;padding:18px 20px;min-height:132px}
.dc .ic{flex:0 0 auto;width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.dc .dv{flex:0 0 auto;width:2px;align-self:stretch;margin:4px 0;border-radius:2px;opacity:.55}
.dc .l{font:700 13.5px Poppins,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.dc .v{font:800 34px/1.15 Poppins,sans-serif;margin-top:2px}
.dc .s{font-size:13px;margin-top:4px;color:#2A3346}
.dc.blue{background:#EAF3FE;border-color:#8CC0F5}.dc.blue .ic{background:#C9E1FB;color:#0E1D42}.dc.blue .dv{background:#0E1D42}.dc.blue .l,.dc.blue .v{color:#0E1D42}
.dc.green{background:#E8F7EE;border-color:#6CD394}.dc.green .ic{background:#BFEBCF;color:#14633A}.dc.green .dv{background:#14633A}.dc.green .l{color:#14633A}.dc.green .v{color:#0E4A2B}
.dc.orange{background:#FFF1E2;border-color:#FFB774}.dc.orange .ic{background:#FFD7B0;color:#E2620E}.dc.orange .dv{background:#E2620E}.dc.orange .l{color:#7A3A06}.dc.orange .v{color:#E2620E}
.pcard{background:var(--surface);border:1px solid #DCE2EC;border-radius:16px;overflow:hidden;box-shadow:0 6px 22px rgba(14,29,66,.07)}
.phead{display:flex;align-items:center;gap:12px;margin:0;background:#0E1D42;color:#fff;font:700 18px Poppins,sans-serif;padding:14px 22px}
.pbody{padding:18px 22px 22px}
.ol{display:flex!important;align-items:center;gap:9px;font:700 14.5px Poppins,sans-serif!important;color:#0E1D42}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#0E1D42;color:#fff;font:700 12px Poppins,sans-serif}
.selic{position:relative}
.selic svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#0E1D42;pointer-events:none}
.pbody select,.pbody textarea{width:100%;border-radius:14px;border:1.5px solid #D5DBE5;padding:12px 16px;font-size:14.5px;background:#fff}
.selic select{padding-left:48px}
.pbody textarea{resize:vertical;min-height:84px}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.go2{display:inline-flex;align-items:center;gap:9px;padding:12px 22px;border-radius:12px;font-size:15px}
.kv2{display:grid;grid-template-columns:max-content 1fr;gap:14px 22px;margin:0 0 6px;font-size:15px;padding-bottom:16px;border-bottom:1px solid #DCE2EC}
.kv2 dt{display:flex;align-items:center;gap:12px;color:#1D2433}.kv2 dt svg{color:#0E1D42}
.kv2 dd{margin:0;font-weight:700;color:#0E1D42}
.ih{display:flex;align-items:center;gap:10px;font:700 15px Poppins,sans-serif;color:#0E1D42;margin:16px 0 8px}
.rl{margin:0;padding-left:44px;font-size:14.5px;line-height:1.75}.rl li::marker{color:#0E1D42}.rl b{color:#0E1D42}
.topbar .live{background:#E3F4EC;padding:6px 14px;border-radius:20px}.topbar .live:has(.dot.off){background:#FDE8E6}.topbar .live:has(.dot:not(.on):not(.off)){background:#EEF1F6}
.topbar .live .dot.on{box-shadow:none}
@media (max-width:640px){.dc{min-height:0;padding:14px}.dc .ic{width:52px;height:52px}.dc .ic svg{width:26px;height:26px}.dc .v{font-size:26px}.kv2{grid-template-columns:1fr;gap:4px}.kv2 dd{margin-bottom:8px}.pbody{padding:14px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dc .s{color:#2A3346}:root:not([data-theme="light"]) .ol,:root:not([data-theme="light"]) .kv2 dd,:root:not([data-theme="light"]) .kv2 dt,:root:not([data-theme="light"]) .ih,:root:not([data-theme="light"]) .rl b,:root:not([data-theme="light"]) .kv2 dt svg,:root:not([data-theme="light"]) .selic svg{color:var(--ink)}:root:not([data-theme="light"]) .num{background:var(--brass);color:#1b1500}:root:not([data-theme="light"]) .pbody select,:root:not([data-theme="light"]) .pbody textarea{background:var(--bg);color:var(--text);border-color:var(--line)}:root:not([data-theme="light"]) .pcard{border-color:var(--line)}}
@media print{.dc{min-height:0}.pcard{box-shadow:none}}
@page{size:A4 landscape;margin:8mm}
@media print{.noprint,.tabs,header .who,footer{display:none!important}body{background:#fff;color:#000;font-size:10px}.tw{max-height:none;overflow:visible}th{position:static}.panel{display:block!important}}
</style>
</head>

function calcPeriodo(periodos,recs,base,ajuste){
  let rest=(+ajuste||0)+(recs||[]).filter(x=>x.fim>=base&&(!x.status||['Programada','Em gozo'].includes(x.status))).reduce((t,x)=>t+(+x.dias||diasEntre(x.ini,x.fim)),0);
  let alvo=null;
  for(const x of periodos||[]){let falta=30-dnum(x.goz);
    if(x.fim<base){const usa=Math.min(rest,falta);rest-=usa;falta-=usa;if(falta<=0)continue}
    if(!alvo)alvo=x}
  return alvo||((periodos||[])[(periodos||[]).length-1])||null;
}
/* saldo do período já completo que ainda tem dias a gozar (ex.: 10 dias até a data-limite) */
function saldoPendente(r){
  let rest=(+r.ajuste||0)+(r.recs||[]).filter(x=>x.fim>=DATABASE&&(!x.status||['Programada','Em gozo'].includes(x.status))).reduce((t,x)=>t+(+x.dias||diasEntre(x.ini,x.fim)),0);
  for(const x of r.periodos||[]){if(!(x.fim<DATABASE))return null;let falta=30-dnum(x.goz);
    const usa=Math.min(rest,falta);rest-=usa;falta-=usa;if(falta>0)return {p:x,falta}}
  return null;
}

function linesFromItems(items){
  const rows=[];
  items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];
    let r=rows.find(q=>Math.abs(q.y-y)<=3);if(!r){r={y,its:[]};rows.push(r)}r.its.push({x,s:it.str})});
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.its.sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim());
}
function parseFolha(lines){
  const D='(\\d{2}/\\d{2}/\\d{4})',N='([\\d.,]+)';
  const PER=new RegExp(D+'\\s+'+D+'\\s+\\.{4}/\\.{4}/\\.{6}\\s+\\.{4}\\s+\\.{4}\\s+\\.{4}\\s+'+N+'\\s+'+N+'\\s+'+N+'\\s+'+D);
  const EMP=/^(\d{1,5})\s+(\D+?)\s*\d{2}\/\d{2}\/\d{4}\s+\d{2}\/\d{2}\/\d{4}\s+\d\s+\d{2}\/\d{2}\b/;
  const NAMEONLY=/^(\d{1,5})\s+([A-ZÀ-Ý][A-ZÀ-Ý .'\-]+?)$/;
  const DATAROW=/^\d{2}\/\d{2}\/\d{4}\s+\d{2}\/\d{2}\/\d{4}\s+\d\s+\d{2}\/\d{2}\b/;
  const iso=s=>s.split('/').reverse().join('-');
  const colabs=[];let cur=null,pend=null,emissao=null;
  const addPer=l=>{const m=l.match(PER);if(!m||!cur)return;cur.periodos.push({ini:iso(m[1]),fim:iso(m[2]),dir:m[3],goz:m[4],rest:m[5],limite:iso(m[6])})};
  for(const l of lines){
    const em=l.match(/Emiss[ãa]o:\s*(\d{2})\/(\d{2})\/(\d{4})/);if(em)emissao=em[3]+'-'+em[2]+'-'+em[1];
    const e=l.match(EMP);
    if(e){cur={cod:e[1],nome:e[2].trim(),periodos:[]};colabs.push(cur);pend=null;addPer(l);continue}
    const n=l.match(NAMEONLY);
    if(n&&!/P[áa]gina|Emiss|Horas|Data base|CAEPF/i.test(l)){pend={cod:n[1],nome:n[2].trim()};continue}
    if(pend&&DATAROW.test(l)){cur={cod:pend.cod,nome:pend.nome,periodos:[]};colabs.push(cur);pend=null;addPer(l);continue}
    if(/^\d{2}\/\d{2}\/\d{4}\s+\d{2}\/\d{2}\/\d{4}\s+\.{4}\//.test(l)){addPer(l)}
  }
  return {emissao,colabs:colabs.filter(c=>c.periodos.length)};
}

/* conflito: algum relacionado já indicou o mesmo mês ou tem férias programadas nele */
function conflitoDe(cid,opcoes,pref){
  /* o bloqueio é por opção: só conflita se quem se cobre indicou o MESMO mês na MESMA opção (1ª com 1ª, 2ª com 2ª, 3ª com 3ª) */
  for(let i=0;i<opcoes.length;i++){const o=opcoes[i];if(!o)continue;
    for(const rel of byId[cid].rel){
      const p=pref[rel.id]; const outro=byId[rel.id];
      const x=p&&(p.opcoes||[])[i];
      if(x&&x.mes===o.mes)return `${mlabel(o.mes)} já foi indicado por ${curto(outro.nome)} como ${i+1}ª opção (quem se cobre não pode sair junto). Escolha outro mês para a ${i+1}ª opção.`;
      if(PROG[rel.id]&&PROG[rel.id].has(o.mes))return `${curto(outro.nome)} já tem férias programadas em ${mlabel(o.mes)}. Escolha outro mês.`;
    }}
  return null;
}
/* conflitos exibidos no quadro (pares com mesmo mês indicado) */
function conflitosVivos(){
  const res={}; // id -> Set de meses em conflito (mesma opção)
  ROSTER.forEach(a=>{const pa=PREF[a.id];if(!pa)return;(pa.opcoes||[]).forEach((o,i)=>{if(!o)return;
    a.rel.forEach(r=>{const pb=PREF[r.id];const hit=(pb&&(pb.opcoes||[])[i]&&pb.opcoes[i].mes===o.mes)||(PROG[r.id]&&PROG[r.id].has(o.mes));
      if(hit)(res[a.id]=res[a.id]||new Set()).add(o.mes)})})});
  return res;
}

/* ====== escala sugerida (gerada a partir das indicações) ====== */
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return isoD(d)};
/* feriados nacionais + 9 de julho (SP); móveis calculados pela Páscoa */
function feriados(ano){
  const a=ano%19,b=Math.floor(ano/100),c=ano%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const pas=isoD(new Date(ano,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1,12));
  return ['01-01','04-21','05-01','07-09','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>ano+'-'+x).concat([addD(pas,-48),addD(pas,-47),addD(pas,-2),addD(pas,60)]);
}
/* período a programar e quantos dias faltam (desconta férias já programadas/em gozo) */
function alvoEscala(r){
  let rest=(+r.ajuste||0)+(r.recs||[]).filter(x=>x.fim>=DATABASE&&(!x.status||['Programada','Em gozo'].includes(x.status))).reduce((t,x)=>t+(+x.dias||diasEntre(x.ini,x.fim)),0);
  for(const x of r.periodos||[]){let falta=30-dnum(x.goz);const usa=Math.min(rest,falta);rest-=usa;falta-=usa;
    if(falta>=1)return {p:x,dias:Math.floor(falta)}}
  return null;
}
/* quem cobre cada um, lido do campo "Grupo de backup" (ex.: "Backup: Ana Luiza Nizoli, Letícia" ou "Grupo de backup 2 — Ana Luiza Nizoli") */
function mapaBackups(){
  const acha=n=>{const k=normNome(n);return ROSTER.find(x=>normNome(x.curto||'')===k||normNome(curto(x.nome))===k||normNome(x.nome)===k)};
  const BK={};ROSTER.forEach(r=>{const g=r.grupo||'';let nomes=[],m;
    if((m=g.match(/backup:\s*(.+)$/i)))nomes=m[1].split(/,|\se\s/);else if((m=g.match(/[—–-]\s*([^—–-]+)$/)))nomes=[m[1]];
    BK[r.id]=[...new Set(nomes.map(n=>n.trim()).filter(Boolean).map(acha).filter(x=>x&&x.id!==r.id).map(x=>x.id))]});
  return BK;
}
/* o que dá para aproveitar da observação: venda de 10 dias, quantidade de dias ("20 dias") e datas (dd/mm ou dd/mm/aaaa) */
function lerObs(obs){
  const t=String(obs||'');const o={venda:/vend|abono/i.test(t)};
  const nd=t.match(/(\d{1,2})\s*dias/i);if(nd&&!o.venda&&+nd[1]>=5&&+nd[1]<=30)o.dias=+nd[1];
  const ds=[...t.matchAll(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/g)].map(m=>{let a=m[3]?+m[3]:ANO;if(a<100)a+=2000;const d=+m[1],me=+m[2];
    if(d<1||d>31||me<1||me>12)return null;return a+'-'+String(me).padStart(2,'0')+'-'+String(d).padStart(2,'0')}).filter(Boolean);
  if(ds.length>=2&&ds[1]>ds[0]){o.de=ds[0];o.ate=ds[1];o.exato=true}   /* "de 18/01 a 06/02": quer exatamente esse período */
  else if(ds.length){o.de=ds[0];o.ate=ds[0];o.inicio=/partir|in[ií]cio|come[cç]/i.test(t)}
  return o;
}
function gerarEscala(){

  const iniProibido=s=>{const w=new Date(s+'T12:00:00').getDay();return w===5||w===6||w===0||fer.has(s)||fer.has(addD(s,1))||fer.has(addD(s,2))};
  const segs=m=>{const out=[];for(let d=1;d<=31;d++){const s=m+'-'+String(d).padStart(2,'0');if(new Date(s+'T12:00:00').getMonth()+1!==+m.slice(5))break;if(okIni(s))out.push(s)}return out};

      const com=(BK[r.id]||[]).filter(b=>(BK[o.id]||[]).includes(b));

    const a=alvoEscala(r);

    const o=it.ob=lerObs(it.obs);

    fila.push(it)});
  /* prioridade: quem vence primeiro */
  fila.sort((a,b)=>(a.lim||'9999').localeCompare(b.lim||'9999'));

    if(o.exato||o.inicio){const c=[o.de,addD(o.de,it.dias-1)];mot=c[0]<it.desde?'o período aquisitivo só completa em '+fmtD(addD(it.desde,-1)):(it.lim&&c[1]>it.lim?'passaria da data-limite':bloqueio(it.r,c));if(!mot)iv=c}

      <div class="addr"><select data-sel="${r.id}"><option value="">+ incluir…</option>${opts(r)}</select><button data-add="${r.id}">Incluir</button></div></td></tr>`});
  const rem=Object.keys(REGRAS).filter(k=>REGRAS[k]===false).map(k=>{const [a,b]=k.split('|');return `<span class="rchip">${esc(curto(byId[a].nome))} ↔ ${esc(curto(byId[b].nome))}<button data-rs="${a}|${b}" title="Restaurar" style="color:var(--ok)">↺</button></span>`}).join('');
  $('#panel').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>Quem não pode sair de férias no mesmo mês</h2>
   <p class="hint">Cada regra vale para as duas pessoas (se A não pode sair com B, B também não pode sair com A). Ao incluir ou remover, o aplicativo de <b>todos os colaboradores</b> é atualizado na hora. ★ = regra criada por vocês. Indicações já feitas não são apagadas; o conflito só passa a valer para novas indicações.</p>
   <div class="addr" style="margin-top:8px"><b style="font-size:13px">Nova regra:</b><select id="nrA"><option value="">Pessoa 1…</option>${all}</select><span>não pode sair com</span><select id="nrB"><option value="">Pessoa 2…</option>${all}</select><button class="pri" id="nrGo">Criar regra</button></div></div>
   ${rem?`<div class="card" style="margin-bottom:14px"><h2>Regras removidas (clique ↺ para restaurar)</h2>${rem}</div>`:''}
   <div class="tw"><table><thead><tr><th>Colaborador</th><th>Não pode sair no mesmo mês que</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const quem=curto(byId[me].nome);
  const mudar=async(a,b,acao)=>{
    const key=pk(a,b);let val;
    if(acao==='add')val=inBase(a,b)?undefined:true;else val=inBase(a,b)?false:undefined;
    try{await DB.setPar(key,val,quem);
      DB.logar({quando:new Date().toISOString(),quem,colabId:a,colab:byId[a].nome,acao:'regra',texto:(acao==='add'?'criou a regra: ':'removeu a regra: ')+curto(byId[a].nome)+' ↔ '+curto(byId[b].nome),slot:0,mes:'',anterior:''});
      toast(acao==='add'?'Regra criada. Todos já veem a atualização.':'Regra removida. Todos já veem a atualização.');
    }catch(e){toast('Não foi possível salvar a regra ('+(e.code||e.message)+'). Verifique as regras do Firestore.')}};
  $('#panel').onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.rm){const [a,b]=t.dataset.rm.split('|');mudar(a,b,'rem')}
    else if(t.dataset.rs){const [a,b]=t.dataset.rs.split('|');mudar(a,b,'add')}
    else if(t.dataset.add){const v=$('[data-sel="'+t.dataset.add+'"]').value;if(!v){toast('Escolha a pessoa na lista.');return}mudar(t.dataset.add,v,'add')}
    else if(t.id==='nrGo'){const a=$('#nrA').value,b=$('#nrB').value;if(!a||!b){toast('Escolha as duas pessoas.');return}if(a===b){toast('Escolha pessoas diferentes.');return}if(byId[a].rel.some(x=>x.id===b)){toast('Essa regra já existe.');return}mudar(a,b,'add')}};
}

/* ====== aba: Colaboradores e ano (importar PDF da folha, incluir/editar/excluir) ====== */
let FORM=null, IMP=null, pdfLib=null;
function normNome(n){return String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim()}
function casarColab(pc,lista){
  let r=lista.find(x=>x.cod&&x.cod===pc.cod);if(r)return r;
  const n=normNome(pc.nome);r=lista.find(x=>normNome(x.nome)===n);if(r)return r;
  const w=n.split(' '),f=w[0],l=w[w.length-1];
  const c=lista.filter(x=>{const v=normNome(x.nome).split(' ');return v[0]===f&&v[v.length-1]===l});
  return c.length===1?c[0]:null;
}
function docDe(r,por){
  const p=r.periodos&&r.periodos.length?r.periodos:[];
  return {id:r.id,nome:r.nome,setor:r.setor,grupo:r.grupo||'',cod:r.cod||'',ajuste:+r.ajuste||0,aqIni:r.aqIni||'',aqFim:r.aqFim||'',limite:r.limite||'',
    recs:(r.recs||[]).map(x=>({ini:x.ini,fim:x.fim,dias:+x.dias||diasEntre(x.ini,x.fim),status:x.status||'Programada'})),
    periodos:p.map(x=>({ini:x.ini,fim:x.fim,dir:String(x.dir||''),goz:String(x.goz||''),limite:x.limite})),
    ativo:r.ativo!==false,atualizadoPor:por,atualizadoEm:new Date().toISOString()};
}
const quemSou=()=>curto(byId[me].nome);
function carregarPdfjs(){
  if(pdfLib)return Promise.resolve(pdfLib);
  return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfLib=window.pdfjsLib;res(pdfLib)};
    sc.onerror=()=>rej(new Error('Não foi possível carregar o leitor de PDF. Verifique a internet e tente de novo.'));document.head.appendChild(sc)});
}
async function lerPdf(file){
  const lib=await carregarPdfjs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];for(let i=1;i<=doc.numPages;i++){const tc=await (await doc.getPage(i)).getTextContent();lines.push(...linesFromItems(tc.items))}
  const r=parseFolha(lines);if(!r.colabs.length)throw new Error('Não encontrei a tabela de "Programação de Férias" neste PDF. Envie o relatório da folha no mesmo formato.');return r;
}
function montarImport(res,ano,base){
  const lista=[...ROSTER],usados=new Set(),alt=[],novos=[];
  res.colabs.forEach(pc=>{const r=casarColab(pc,lista);
    if(r){usados.add(r.id);const a=calcPeriodo(pc.periodos,r.recs,base,r.ajuste);
      alt.push({r,pc,aqIni:a.ini,aqFim:a.fim,limite:a.limite,mudou:a.ini!==r.aqIni||a.fim!==r.aqFim||a.limite!==r.limite||(r.cod||'')!==pc.cod})}
    else novos.push({pc,setor:'',ok:false})});
  const fora=lista.filter(r=>!usados.has(r.id)).map(r=>({r,ok:false}));
  return {ano,base,alt,novos,fora};
}

    ${inativos.length?`<h3>Excluídos (clique para restaurar)</h3>${inativos.map(o=>`<span class="rchip">${esc(o.nome)}<button data-rest="${o.id}" title="Restaurar" style="color:var(--ok)">↺</button></span>`).join('')}`:''}</div>`;

    try{await DB.setCiclo({ano:a,dataBase:b,atualizadoPor:quemSou(),atualizadoEm:new Date().toISOString()});
      DB.logar({quando:new Date().toISOString(),quem:quemSou(),colabId:me,colab:'',acao:'regra',texto:'definiu o ano das férias como '+a,slot:0,mes:'',anterior:''});toast('Ciclo salvo.')}catch(e){toast('Não foi possível salvar ('+(e.code||e.message)+').')}};
  $('#novoC').onclick=()=>{FORM={novo:true,id:'n'+Date.now().toString(36),nome:'',setor:setores[0]||'',aqIni:'',aqFim:'',limite:'',recs:[],periodos:[],cod:'',grupo:''};formUI()};
  $('#panel').onclick=async e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.ed){const r=byId[t.dataset.ed];FORM={novo:false,...JSON.parse(JSON.stringify(r)),recsOrig:JSON.stringify(r.recs)};formUI();$('#formBox').scrollIntoView({behavior:'smooth'})}
    else if(t.dataset.ex){const r=byId[t.dataset.ex];if(!confirm('Excluir '+r.nome+'? Ela(e) deixa de aparecer no aplicativo (dá para restaurar depois).'))return;
      try{await DB.setColab(docDe({...r,ativo:false},quemSou()));toast('Colaborador excluído.')}catch(er){toast('Não foi possível salvar ('+(er.code||er.message)+').')}}
    else if(t.dataset.rest){const o=COLABS[t.dataset.rest];try{await DB.setColab({...o,ativo:true,atualizadoPor:quemSou(),atualizadoEm:new Date().toISOString()});toast('Colaborador restaurado.')}catch(er){toast('Não foi possível salvar ('+(er.code||er.message)+').')}}
    else if(t.id==='pdfLer'){const f=$('#pdfIn').files[0];if(!f){toast('Escolha o arquivo PDF.');return}
      t.disabled=true;$('#impBox').innerHTML='<p class="hint">Lendo o PDF…</p>';
      try{const res=await lerPdf(f);IMP=montarImport(res,res.emissao?+res.emissao.slice(0,4)+1:ANO,res.emissao||DATABASE);if(IMP.ano<ANO)IMP.ano=ANO;impUI()}catch(er){IMP=null;$('#impBox').innerHTML='<div class="msg bad">'+esc(er.message||'Erro ao ler o PDF.')+'</div>'}
      t.disabled=false}};
  if(FORM)formUI();if(IMP)impUI();
}
function impUI(){
  const I=IMP,anos=[];for(let a=2026;a<=2035;a++)anos.push(a);
  const mud=I.alt.filter(x=>x.mudou);
  $('#impBox').innerHTML=`<div class="rhbar" style="margin-top:10px">Lido: <b>${I.alt.length+I.novos.length}</b> colaboradores no PDF · <b>${mud.length}</b> com período/limite diferente · <b>${I.novos.length}</b> não cadastrados · <b>${I.fora.length}</b> cadastrados que não estão no PDF.</div>
   <div class="addr" style="margin:8px 0"><label for="iAno"><b>Ano das férias deste ciclo:</b></label><select id="iAno">${anos.map(a=>`<option ${a===I.ano?'selected':''}>${a}</option>`).join('')}</select><label for="iBase"><b>Data-base:</b></label><input type="date" id="iBase" value="${esc(I.base)}"></div>
   ${mud.length?`<div class="tw" style="max-height:40vh;margin-bottom:10px"><table><thead><tr><th>Colaborador</th><th>Período em curso (antes → depois)</th><th>Data-limite (antes → depois)</th></tr></thead><tbody>${mud.map(x=>`<tr><td class="nm">${esc(x.r.nome)}</td><td>${x.r.aqIni?fmtD(x.r.aqIni)+' a '+fmtD(x.r.aqFim):'—'} → <b>${fmtD(x.aqIni)} a ${fmtD(x.aqFim)}</b></td><td>${fmtD(x.r.limite)} → <b>${fmtD(x.limite)}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">Nenhum período mudou para os colaboradores já cadastrados.</p>'}
   ${I.novos.length?`<h3>No PDF e não cadastrados (marque para incluir)</h3>${I.novos.map((n,i)=>`<div class="addr" style="margin-bottom:4px"><label><input type="checkbox" data-nn="${i}" ${n.ok?'checked':''}> ${esc(n.pc.nome)}</label><select data-ns="${i}"><option value="">Setor…</option>${setoresLista().map(s=>`<option ${n.setor===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`).join('')}`:''}
   ${I.fora.length?`<h3>Cadastrados que não estão no PDF (marque para excluir)</h3>${I.fora.map((n,i)=>`<div style="margin-bottom:2px"><label><input type="checkbox" data-nf="${i}" ${n.ok?'checked':''}> ${esc(n.r.nome)}</label></div>`).join('')}<p class="hint">Se não marcar, continuam como estão (os períodos deles não mudam).</p>`:''}
   <div style="margin-top:10px"><button class="pri" id="impOk">Aplicar atualização</button> <button id="impNo">Cancelar</button></div>`;
  $('#iAno').onchange=()=>{I.ano=+$('#iAno').value};

    I.fora.filter(n=>n.ok).forEach(n=>docs.push(docDe({...n.r,ativo:false},por)));

      IMP=null;toast('Atualização aplicada. Todos já veem os novos dados.');render()}catch(e){$('#impOk').disabled=false;toast('Não foi possível salvar ('+(e.code||e.message)+').')}};
}

    const d=docDe(F,quemSou());d.recs=F.recs.map(x=>({ini:x.ini,fim:x.fim,dias:diasEntre(x.ini,x.fim),status:x.status||'Programada'}));
    if(!F.novo&&d.periodos.length&&JSON.stringify(d.recs)!==F.recsOrig&&F.aqIni===byId[F.id].aqIni&&F.aqFim===byId[F.id].aqFim&&F.limite===byId[F.id].limite){
      const a=calcPeriodo(d.periodos,d.recs,DATABASE,d.ajuste);if(a){d.aqIni=a.ini;d.aqFim=a.fim;d.limite=a.limite}}
    $('#fOk').disabled=true;
    try{await DB.setColab(d);DB.logar({quando:new Date().toISOString(),quem:quemSou(),colabId:d.id,colab:d.nome,acao:'regra',texto:(F.novo?'incluiu o colaborador ':'editou o colaborador ')+d.nome,slot:0,mes:'',anterior:''});FORM=null;toast('Colaborador salvo.');render()}
    catch(e){$('#fOk').disabled=false;er('Não foi possível salvar ('+esc(e.code||e.message)+').')}};
}
function renderLog(){
  $('#panel').innerHTML=`<div class="card"><h2>Últimas movimentações</h2>${LOG.length?`<ul class="log">${LOG.map(l=>`<li><b>${esc(l.quem)}</b> ${l.acao==='regra'?esc(l.texto||'alterou uma regra'):l.acao==='removeu'?'removeu a '+l.slot+'ª opção ('+(l.anterior?mlabel(l.anterior):'')+')':(l.acao==='alterou'?'alterou a '+l.slot+'ª opção para <b>'+mlabel(l.mes)+'</b>':'indicou <b>'+mlabel(l.mes)+'</b> como '+l.slot+'ª opção')}${l.acao!=='regra'&&l.quem!==curto(l.colab)&&l.colab?' de <b>'+esc(curto(l.colab))+'</b>':''}<br><small>${when(l.quando)}</small></li>`).join('')}</ul>`:'<p class="hint">Ainda não há movimentações.</p>'}</div>`;
}

/* ====== inicialização ====== */
$('#trocar').onclick=()=>{me=null;rh=false;editTarget=null;ADMIN_OK=false;ls('fer_me',null);ls('fer_adm',null);render()};
$('#rhLnk').onclick=()=>{rh=!rh;editTarget=null;toast(rh?'Modo RH ligado.':'Modo RH desligado.');render()};
if(me&&!byId[me])me=null;
let unsubPref=null;
function aplicarCiclo(c){
  const ano=+c.ano||ANO,base=c.dataBase||DATABASE;
  const mudouAno=ano!==ANO;ANO=ano;DATABASE=base;rebuildRoster();
  if(mudouAno){PREF={};if(unsubPref)unsubPref();
    unsubPref=DB.listenPref(ANO,o=>{PREF=o;render2()},()=>{})}
  render2();
}
(async()=>{
  render();
  try{
    await initDB();
    if(DB.modo==='fb'){
      unsubPref=DB.listenPref(ANO,o=>{PREF=o;$('#dot').className='dot on';$('#liveTxt').textContent='Ao vivo';render2()},e=>{$('#dot').className='dot off';$('#liveTxt').textContent='Sem conexão';$('#banner').innerHTML='<div class="ban">Não foi possível conectar ao banco de dados ('+esc(e.code||e.message)+'). Se o problema continuar, avise o RH.</div>'});
      DB.listenLog(l=>{LOG=l;if(tab==='log')render2()});
      DB.listenRegras(o=>{REGRAS=o||{};applyRegras();render2()},()=>{});
      DB.listenColabs(o=>{COLABS=o||{};rebuildRoster();if(me&&!byId[me]){me=null;ls('fer_me',null)}render2()},()=>{});
      DB.listenCiclo(c=>{aplicarCiclo(c)},()=>{});
    }else{unsubPref=DB.listenPref(ANO,o=>{PREF=o;render2()});DB.listenRegras(o=>{REGRAS=o;applyRegras();render2()});DB.listenColabs(o=>{COLABS=o;rebuildRoster();render2()});}
  }catch(e){$('#dot').className='dot off';$('#liveTxt').textContent='Sem conexão';$('#banner').innerHTML='<div class="ban">Não foi possível carregar o aplicativo ('+esc(e.message)+').</div>'}
})();
/* evita perder o que está sendo digitado quando chega atualização de outro colaborador */
function render2(){
  const ae=document.activeElement;
  if((tab==='regras'||tab==='colabs')&&me&&ae&&ae.closest&&ae.closest('#panel')&&['SELECT','INPUT','TEXTAREA'].includes(ae.tagName))return;
  if(tab==='colabs'&&(FORM||IMP)&&me){const fb=$('#formBox'),ib=$('#impBox');if(fb||ib){/* não perde o formulário aberto */return}}
  if(tab==='mine'&&me&&ae&&ae.closest&&ae.closest('#panel')&&['SELECT','TEXTAREA'].includes(ae.tagName)){ // só atualiza avisos de bloqueio
    const id=alvoId();[0,1,2].forEach(i=>{const s=$('#op'+i);if(!s)return;[...s.options].forEach(o=>{if(!o.value)return;const b=bloqueio(id,o.value,i);const k=+o.value.slice(5)-1;o.disabled=!!b&&!rh;o.textContent=MESES[k]+(b?' — '+b:'')})});return}
  render();
}
</script>
