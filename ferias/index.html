<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indicação de Férias 2027 · Registro Assis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#152A50;--brass:#D3A521;--blue:#1B4F91;--bg:#F5F5F4;--surface:#fff;--text:#1D2433;--muted:#5E6779;--line:#D5D8E0;--band:#EEF1F7;
--ok:#1E7F57;--okbg:#E3F4EC;--bad:#B3261E;--badbg:#FDE8E6;--warn:#7A5A00;--warnbg:#FFF4D6;--o1:#1B4F91;--o2:#2E86C1;--o3:#7FB3DE;--prog:#B7BCC8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E6E9F0;--bg:#0F1626;--surface:#161F33;--text:#E6E9F0;--muted:#9AA3B8;--line:#2B3650;--band:#1B2640;--ok:#5CC49A;--okbg:#14352A;--bad:#FF8A80;--badbg:#401B18;--warn:#F1CF73;--warnbg:#3A2F10;--o1:#5FA6E8;--o2:#4C8FD0;--o3:#3A6FA3;--prog:#5B6479;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.w{max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:3px solid var(--brass);margin-bottom:16px}
h1{font:700 20px/1.2 Poppins,sans-serif;color:var(--ink);margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}.dot.off{background:var(--bad)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.who b{font-weight:600}
button,.btn{font:600 13px Poppins,sans-serif;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.pri{background:var(--brass);color:#1b1500;border-color:var(--brass)}}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
select,textarea,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);max-width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--brass);color:#1b1500;border-color:var(--brass)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.dcard{border:2px solid var(--brass);border-radius:12px;background:var(--surface);padding:14px 16px}
.dcard .l{font:600 12px Poppins,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dcard .v{font:700 28px/1.2 Poppins,sans-serif;color:var(--ink);margin-top:4px}
.dcard .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dcard.lim{background:var(--warnbg);border-color:var(--brass)}.dcard.lim .v{color:var(--warn)}
td.dd{background:color-mix(in srgb,var(--brass) 12%,transparent);font-weight:700;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
h2{font:600 15px Poppins,sans-serif;color:var(--ink);margin:0 0 10px}
h3{font:600 13px Poppins,sans-serif;color:var(--ink);margin:14px 0 6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:12.5px}
.hint{font-size:12px;color:var(--muted)}
.msg{padding:6px 10px;border-radius:6px;font-size:12.5px;margin-top:4px}
.msg.bad{background:var(--badbg);color:var(--bad)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.ok{background:var(--okbg);color:var(--ok)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:75vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;z-index:2;background:#152A50;color:#fff;font:600 11px/1.25 Poppins,sans-serif;text-align:left;padding:8px 8px;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.sec td{background:var(--band);font:600 12px Poppins,sans-serif;color:var(--ink);position:sticky;left:0}
td.nm{font-weight:600;min-width:170px}
.opt{display:block;line-height:1.3}.opt small{display:block;color:var(--muted);font-size:11px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.pend{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.me td{background:color-mix(in srgb,var(--brass) 14%,transparent)}
.cal th.m{text-align:center;min-width:54px}
.cal td.c{text-align:center;padding:4px 2px;font-size:11px;font-weight:600;min-width:54px;border-left:1px solid var(--line)}
.c .p{display:block;border-radius:4px;color:#fff;padding:2px 0;margin:1px 2px}
.p1{background:var(--o1)}.p2{background:var(--o2)}.p3{background:var(--o3);color:#0c1b30!important}.pp{background:var(--prog);color:#10151f!important}.px{background:var(--bad)!important;color:#fff!important}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.prog{height:8px;background:var(--band);border-radius:6px;overflow:hidden;min-width:140px}.prog>i{display:block;height:100%;background:var(--ok)}
.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;list-style:none}.log{padding:0;margin:0}.log small{color:var(--muted)}
.center{max-width:480px;margin:40px auto}
footer{margin-top:24px;color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
footer a,footer button.lnk{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#152A50;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9;max-width:90vw}
.ban{background:var(--badbg);color:var(--bad);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.rhbar{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.rchip{display:inline-flex;align-items:center;gap:4px;background:var(--band);border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 9px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap}
.rchip.nova{border-color:var(--brass)}
.rchip button{border:0;background:none;padding:0 5px;font-size:15px;line-height:1;color:var(--bad);cursor:pointer;border-radius:50%}
.addr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.addr select{font-size:12px;padding:5px 6px;max-width:170px}.addr button{padding:5px 10px;font-size:12px}
@page{size:A4 landscape;margin:8mm}
@media print{.noprint,.tabs,header .who,footer{display:none!important}body{background:#fff;color:#000;font-size:10px}.tw{max-height:none;overflow:visible}th{position:static}.panel{display:block!important}}
</style>
</head>

/* meses ocupados por férias já programadas/em gozo (estático, vindo do cadastro) */
function mesesProg(r){const s=new Set();r.recs.forEach(x=>{let d=new Date(x.ini+'T12:00:00'),e=new Date(x.fim+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1)){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(k.startsWith(ANO))s.add(k)}});return s}
/* monta a lista efetiva: cadastro embutido + ajustes salvos pelo RH (incluir/editar/excluir colaboradores) */
function rebuildRoster(){
  const lista=[];
  const norm=(b,o)=>{const r={rel:[],recs:[],periodos:[],grupo:'',cod:'',...b,...(o||{})};delete r.atualizadoPor;delete r.atualizadoEm;return r};
  ROSTER_BASE.forEach(b=>{const o=COLABS[b.id];const r=norm(b,o);r.rel=b.rel;if(r.ativo!==false)lista.push(r)});
  Object.values(COLABS).forEach(o=>{if(BASEBYID[o.id])return;const r=norm({},o);if(r.ativo!==false)lista.push(r)});
  lista.forEach(r=>{r.secao=SO_BACKUP[r.id]||r.setor});
  const ord=[...new Set(lista.map(r=>r.secao))].filter(x=>x!=='Backup').concat(['Backup']);
  lista.sort((a,b)=>ord.indexOf(a.secao)-ord.indexOf(b.secao));
  ROSTER.length=0;lista.forEach(r=>ROSTER.push(r));
  Object.keys(byId).forEach(k=>delete byId[k]);ROSTER.forEach(r=>byId[r.id]=r);
  Object.keys(PROG).forEach(k=>delete PROG[k]);ROSTER.forEach(r=>PROG[r.id]=mesesProg(r));
  Object.keys(BASE_REL).forEach(k=>delete BASE_REL[k]);
  ROSTER.forEach(r=>{BASE_REL[r.id]=((BASEBYID[r.id]||{}).rel||[]).filter(x=>byId[x.id]).map(x=>({...x}))});
  applyRegras();
}

const dnum=v=>parseFloat(String(v||'0').replace(/\./g,'').replace(',','.'))||0;
const diasEntre=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1;
/* período em curso e limite: pula períodos já cobertos por férias programadas (primeiro que ainda precisa programar) */
function calcPeriodo(periodos,recs,base,ajuste){
  let rest=(+ajuste||0)+(recs||[]).filter(x=>x.fim>=base&&(!x.status||['Programada','Em gozo'].includes(x.status))).reduce((t,x)=>t+(+x.dias||diasEntre(x.ini,x.fim)),0);
  let alvo=null;
  for(const x of periodos||[]){let falta=30-dnum(x.goz);
    if(x.fim<base){const usa=Math.min(rest,falta);rest-=usa;falta-=usa;if(falta<=0)continue}
    if(!alvo)alvo=x}
  return alvo||((periodos||[])[(periodos||[]).length-1])||null;
}
/* ===== leitura do relatório "Programação de Férias" da folha ===== */
function linesFromItems(items){
  const rows=[];
  items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];
    let r=rows.find(q=>Math.abs(q.y-y)<=3);if(!r){r={y,its:[]};rows.push(r)}r.its.push({x,s:it.str})});
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.its.sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join(' ').replace(/\s+/g,' ').trim());
}
function parseFolha(lines){
  const D='(\\d{2}/\\d{2}/\\d{4})',N='([\\d.,]+)';
  const PER=new RegExp(D+'\\s+'+D+'\\s+\\.{4}/\\.{4}/\\.{6}\\s+\\.{4}\\s+\\.{4}\\s+\\.{4}\\s+'+N+'\\s+'+N+'\\s+'+N+'\\s+'+D);
  const EMP=/^(\d{1,5})\s+(\D+?)\s*\d{2}\/\d{2}\/\d{4}\s+\d{2}\/\d{2}\/\d{4}\s+\d\s+\d{2}\/\d{2}\b/;
  const NAMEONLY=/^(\d{1,5})\s+([A-ZÀ-Ý][A-ZÀ-Ý .'\-]+?)$/;
  const DATAROW=/^\d{2}\/\d{2}\/\d{4}\s+\d{2}\/\d{2}\/\d{4}\s+\d\s+\d{2}\/\d{2}\b/;
  const iso=s=>s.split('/').reverse().join('-');
  const colabs=[];let cur=null,pend=null,emissao=null;
  const addPer=l=>{const m=l.match(PER);if(!m||!cur)return;cur.periodos.push({ini:iso(m[1]),fim:iso(m[2]),dir:m[3],goz:m[4],rest:m[5],limite:iso(m[6])})};
  for(const l of lines){
    const em=l.match(/Emiss[ãa]o:\s*(\d{2})\/(\d{2})\/(\d{4})/);if(em)emissao=em[3]+'-'+em[2]+'-'+em[1];
    const e=l.match(EMP);
    if(e){cur={cod:e[1],nome:e[2].trim(),periodos:[]};colabs.push(cur);pend=null;addPer(l);continue}
    const n=l.match(NAMEONLY);
    if(n&&!/P[áa]gina|Emiss|Horas|Data base|CAEPF/i.test(l)){pend={cod:n[1],nome:n[2].trim()};continue}
    if(pend&&DATAROW.test(l)){cur={cod:pend.cod,nome:pend.nome,periodos:[]};colabs.push(cur);pend=null;addPer(l);continue}
    if(/^\d{2}\/\d{2}\/\d{4}\s+\d{2}\/\d{2}\/\d{4}\s+\.{4}\//.test(l)){addPer(l)}
  }
  return {emissao,colabs:colabs.filter(c=>c.periodos.length)};
}

/* conflito: algum relacionado já indicou o mesmo mês ou tem férias programadas nele */
function conflitoDe(cid,opcoes,pref){
  for(const o of opcoes){ if(!o)continue;
    for(const rel of byId[cid].rel){
      const p=pref[rel.id]; const outro=byId[rel.id];
      if(p&&(p.opcoes||[]).some(x=>x&&x.mes===o.mes)){const x=p.opcoes.find(x=>x&&x.mes===o.mes);return `${mlabel(o.mes)} já foi indicado por ${curto(outro.nome)} (quem se cobre não pode sair junto). Escolha outro mês.`}
      if(PROG[rel.id]&&PROG[rel.id].has(o.mes))return `${curto(outro.nome)} já tem férias programadas em ${mlabel(o.mes)}. Escolha outro mês.`;
    }}
  return null;
}
/* conflitos exibidos no quadro (pares com mesmo mês indicado) */
function conflitosVivos(){
  const res={}; // id -> Set de meses em conflito
  ROSTER.forEach(a=>{const pa=PREF[a.id];if(!pa)return;(pa.opcoes||[]).forEach(o=>{if(!o)return;
    a.rel.forEach(r=>{const pb=PREF[r.id];const hit=(pb&&(pb.opcoes||[]).some(x=>x&&x.mes===o.mes))||(PROG[r.id]&&PROG[r.id].has(o.mes));
      if(hit)(res[a.id]=res[a.id]||new Set()).add(o.mes)})})});
  return res;
}

let FORM=null, IMP=null, pdfLib=null;
function normNome(n){return String(n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim()}
function casarColab(pc,lista){
  let r=lista.find(x=>x.cod&&x.cod===pc.cod);if(r)return r;
  const n=normNome(pc.nome);r=lista.find(x=>normNome(x.nome)===n);if(r)return r;
  const w=n.split(' '),f=w[0],l=w[w.length-1];
  const c=lista.filter(x=>{const v=normNome(x.nome).split(' ');return v[0]===f&&v[v.length-1]===l});
  return c.length===1?c[0]:null;
}
function docDe(r,por){
  const p=r.periodos&&r.periodos.length?r.periodos:[];
  return {id:r.id,nome:r.nome,setor:r.setor,grupo:r.grupo||'',cod:r.cod||'',ajuste:+r.ajuste||0,aqIni:r.aqIni||'',aqFim:r.aqFim||'',limite:r.limite||'',
    recs:(r.recs||[]).map(x=>({ini:x.ini,fim:x.fim,dias:+x.dias||diasEntre(x.ini,x.fim),status:x.status||'Programada'})),
    periodos:p.map(x=>({ini:x.ini,fim:x.fim,dir:String(x.dir||''),goz:String(x.goz||''),limite:x.limite})),
    ativo:r.ativo!==false,atualizadoPor:por,atualizadoEm:new Date().toISOString()};
}
const quemSou=()=>curto(byId[me].nome);
function carregarPdfjs(){
  if(pdfLib)return Promise.resolve(pdfLib);
  return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfLib=window.pdfjsLib;res(pdfLib)};
    sc.onerror=()=>rej(new Error('Não foi possível carregar o leitor de PDF. Verifique a internet e tente de novo.'));document.head.appendChild(sc)});
}
async function lerPdf(file){
  const lib=await carregarPdfjs();const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const lines=[];for(let i=1;i<=doc.numPages;i++){const tc=await (await doc.getPage(i)).getTextContent();lines.push(...linesFromItems(tc.items))}
  const r=parseFolha(lines);if(!r.colabs.length)throw new Error('Não encontrei a tabela de "Programação de Férias" neste PDF. Envie o relatório da folha no mesmo formato.');return r;
}
function montarImport(res,ano,base){
  const lista=[...ROSTER],usados=new Set(),alt=[],novos=[];
  res.colabs.forEach(pc=>{const r=casarColab(pc,lista);
    if(r){usados.add(r.id);const a=calcPeriodo(pc.periodos,r.recs,base,r.ajuste);
      alt.push({r,pc,aqIni:a.ini,aqFim:a.fim,limite:a.limite,mudou:a.ini!==r.aqIni||a.fim!==r.aqFim||a.limite!==r.limite||(r.cod||'')!==pc.cod})}
    else novos.push({pc,setor:'',ok:false})});
  const fora=lista.filter(r=>!usados.has(r.id)).map(r=>({r,ok:false}));
  return {ano,base,alt,novos,fora};
}

      try{await DB.setColab(docDe({...r,ativo:false},quemSou()));toast('Colaborador excluído.')}catch(er){toast('Não foi possível salvar ('+(er.code||er.message)+').')}}
    else if(t.dataset.rest){const o=COLABS[t.dataset.rest];try{await DB.setColab({...o,ativo:true,atualizadoPor:quemSou(),atualizadoEm:new Date().toISOString()});toast('Colaborador restaurado.')}catch(er){toast('Não foi possível salvar ('+(er.code||er.message)+').')}}
    else if(t.id==='pdfLer'){const f=$('#pdfIn').files[0];if(!f){toast('Escolha o arquivo PDF.');return}
      t.disabled=true;$('#impBox').innerHTML='<p class="hint">Lendo o PDF…</p>';
      try{const res=await lerPdf(f);IMP=montarImport(res,res.emissao?+res.emissao.slice(0,4)+1:ANO,res.emissao||DATABASE);if(IMP.ano<ANO)IMP.ano=ANO;impUI()}catch(er){IMP=null;$('#impBox').innerHTML='<div class="msg bad">'+esc(er.message||'Erro ao ler o PDF.')+'</div>'}
      t.disabled=false}};
  if(FORM)formUI();if(IMP)impUI();
}
function impUI(){

   <div style="margin-top:12px"><button class="pri" id="fOk">Salvar colaborador</button> <button id="fNo">Cancelar</button> <span id="fErro"></span></div></div>`;
  const ler=()=>{F.nome=$('#fNome').value.trim();const sv=$('#fSetor').value;F.setor=sv==='__novo'?$('#fSetorN').value.trim():sv;F.cod=$('#fCod').value.trim();F.ajuste=+$('#fAj').value||0;F.aqIni=$('#fAi').value;F.aqFim=$('#fAf').value;F.limite=$('#fLim').value;
    F.recs=F.recs.map((x,i)=>({...x,ini:$('[data-ri="'+i+'"]').value,fim:$('[data-rf="'+i+'"]').value}))};
  $('#fSetor').onchange=()=>{$('#fSetorN').hidden=$('#fSetor').value!=='__novo'};
  $('#fAddR').onclick=()=>{ler();F.recs.push({ini:'',fim:'',status:'Programada'});formUI()};
  document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{ler();F.recs.splice(+b.dataset.rdel,1);formUI()});
  $('#fNo').onclick=()=>{FORM=null;$('#formBox').innerHTML=''};
  $('#fOk').onclick=async()=>{ler();
    const er=m=>{$('#fErro').innerHTML='<span class="msg bad">'+m+'</span>'};
    if(!F.nome)return er('Informe o nome.');if(!F.setor)return er('Informe o setor.');
    if(F.recs.some(x=>!x.ini||!x.fim||x.fim<x.ini))return er('Confira as datas das férias programadas.');
    if(F.novo&&ROSTER.some(r=>normNome(r.nome)===normNome(F.nome)))return er('Já existe um colaborador com esse nome.');
    const d=docDe(F,quemSou());d.recs=F.recs.map(x=>({ini:x.ini,fim:x.fim,dias:diasEntre(x.ini,x.fim),status:x.status||'Programada'}));
    if(!F.novo&&d.periodos.length&&JSON.stringify(d.recs)!==F.recsOrig&&F.aqIni===byId[F.id].aqIni&&F.aqFim===byId[F.id].aqFim&&F.limite===byId[F.id].limite){
      const a=calcPeriodo(d.periodos,d.recs,DATABASE,d.ajuste);if(a){d.aqIni=a.ini;d.aqFim=a.fim;d.limite=a.limite}}
    $('#fOk').disabled=true;
    try{await DB.setColab(d);DB.logar({quando:new Date().toISOString(),quem:quemSou(),colabId:d.id,colab:d.nome,acao:'regra',texto:(F.novo?'incluiu o colaborador ':'editou o colaborador ')+d.nome,slot:0,mes:'',anterior:''});FORM=null;toast('Colaborador salvo.');render()}
    catch(e){$('#fOk').disabled=false;er('Não foi possível salvar ('+esc(e.code||e.message)+').')}};
}
function renderLog(){
  $('#panel').innerHTML=`<div class="card"><h2>Últimas movimentações</h2>${LOG.length?`<ul class="log">${LOG.map(l=>`<li><b>${esc(l.quem)}</b> ${l.acao==='regra'?esc(l.texto||'alterou uma regra'):l.acao==='removeu'?'removeu a '+l.slot+'ª opção ('+(l.anterior?mlabel(l.anterior):'')+')':(l.acao==='alterou'?'alterou a '+l.slot+'ª opção para <b>'+mlabel(l.mes)+'</b>':'indicou <b>'+mlabel(l.mes)+'</b> como '+l.slot+'ª opção')}${l.acao!=='regra'&&l.quem!==curto(l.colab)&&l.colab?' de <b>'+esc(curto(l.colab))+'</b>':''}<br><small>${when(l.quando)}</small></li>`).join('')}</ul>`:'<p class="hint">Ainda não há movimentações.</p>'}</div>`;
}

/* ====== inicialização ====== */
$('#trocar').onclick=()=>{me=null;rh=false;editTarget=null;ls('fer_me',null);render()};
$('#rhLnk').onclick=()=>{rh=!rh;editTarget=null;toast(rh?'Modo RH ligado.':'Modo RH desligado.');render()};
if(me&&!byId[me])me=null;
let unsubPref=null;
function aplicarCiclo(c){
  const ano=+c.ano||ANO,base=c.dataBase||DATABASE;
  const mudouAno=ano!==ANO;ANO=ano;DATABASE=base;rebuildRoster();
  if(mudouAno){PREF={};if(unsubPref)unsubPref();
    unsubPref=DB.listenPref(ANO,o=>{PREF=o;render2()},()=>{})}
  render2();
}
(async()=>{
  render();
  try{
    await initDB();
    if(DB.modo==='fb'){
      unsubPref=DB.listenPref(ANO,o=>{PREF=o;$('#dot').className='dot on';$('#liveTxt').textContent='Ao vivo';render2()},e=>{$('#dot').className='dot off';$('#liveTxt').textContent='Sem conexão';$('#banner').innerHTML='<div class="ban">Não foi possível conectar ao banco de dados ('+esc(e.code||e.message)+'). Se o problema continuar, avise o RH.</div>'});
      DB.listenLog(l=>{LOG=l;if(tab==='log')render2()});
      DB.listenRegras(o=>{REGRAS=o||{};applyRegras();render2()},()=>{});
      DB.listenColabs(o=>{COLABS=o||{};rebuildRoster();if(me&&!byId[me]){me=null;ls('fer_me',null)}render2()},()=>{});
      DB.listenCiclo(c=>{aplicarCiclo(c)},()=>{});
    }else{unsubPref=DB.listenPref(ANO,o=>{PREF=o;render2()});DB.listenRegras(o=>{REGRAS=o;applyRegras();render2()});DB.listenColabs(o=>{COLABS=o;rebuildRoster();render2()});}
  }catch(e){$('#dot').className='dot off';$('#liveTxt').textContent='Sem conexão';$('#banner').innerHTML='<div class="ban">Não foi possível carregar o aplicativo ('+esc(e.message)+').</div>'}
})();
/* evita perder o que está sendo digitado quando chega atualização de outro colaborador */
function render2(){
  const ae=document.activeElement;
  if((tab==='regras'||tab==='colabs')&&me&&ae&&ae.closest&&ae.closest('#panel')&&['SELECT','INPUT','TEXTAREA'].includes(ae.tagName))return;
  if(tab==='colabs'&&(FORM||IMP)&&me){const fb=$('#formBox'),ib=$('#impBox');if(fb||ib){/* não perde o formulário aberto */return}}
  if(tab==='mine'&&me&&ae&&ae.closest&&ae.closest('#panel')&&['SELECT','TEXTAREA'].includes(ae.tagName)){ // só atualiza avisos de bloqueio
    const id=alvoId();[0,1,2].forEach(i=>{const s=$('#op'+i);if(!s)return;[...s.options].forEach(o=>{if(!o.value)return;const b=bloqueio(id,o.value,i);const k=+o.value.slice(5)-1;o.disabled=!!b&&!rh;o.textContent=MESES[k]+(b?' — '+b:'')})});return}
  render();
}
</script>
