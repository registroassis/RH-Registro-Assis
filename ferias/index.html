const $=s=>document.querySelector(s);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}

/* meses ocupados por férias já programadas/em gozo (estático, vindo do cadastro) */
function mesesProg(r){const s=new Set();r.recs.forEach(x=>{let d=new Date(x.ini+'T12:00:00'),e=new Date(x.fim+'T12:00:00');for(;d<=e;d.setDate(d.getDate()+1)){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(k.startsWith(ANO))s.add(k)}});return s}
const PROG=Object.fromEntries(ROSTER.map(r=>[r.id,mesesProg(r)]));

/* ====== camada de dados: Firebase (padrão) ou memória (?demo) ====== */
const DEMO=new URLSearchParams(location.search).has('demo');
let DB=null; // {listenPref(cb,err), listenLog(cb), salvar(cid,dados,porNome,rh), logar(e)}
let PREF={}, LOG=[], me=ls('fer_me'), rh=false, tab='mine', filtro={setor:'',pend:false};

async function initDB(){
  if(DEMO){
    const subs=[];let store={};
    DB={modo:'demo',
      listenPref(cb){subs.push(cb);cb({...store});$('#dot').className='dot on';$('#liveTxt').textContent='Modo demonstração (não grava)';},
      listenLog(cb){cb([])},
      async salvar(cid,novo,por,rhmode){
        const confl=conflitoDe(cid,novo.opcoes,store);
        if(confl&&!rhmode)throw new Error(confl);
        store={...store,[cid]:novo};subs.forEach(f=>f({...store}));
      },
      async logar(){}};
    return;
  }
  const cfg={apiKey:"AIzaSyDmYAjYeGQ8l2wfkzD76HdY5UaHQWO7KZQ",authDomain:"rh---registro-assis.firebaseapp.com",projectId:"rh---registro-assis",storageBucket:"rh---registro-assis.firebasestorage.app",messagingSenderId:"843775357323",appId:"1:843775357323:web:911d17158b2dac72883f8e"};
  const V='10.13.1';
  const [{initializeApp},F]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
  const app=initializeApp(cfg,'ferias');const db=F.getFirestore(app);
  DB={modo:'fb',
    listenPref(cb,err){return F.onSnapshot(F.collection(db,'ferias_pref'),s=>{const o={};s.forEach(d=>o[d.id]=d.data());cb(o)},err)},
    listenLog(cb){return F.onSnapshot(F.query(F.collection(db,'ferias_log'),F.orderBy('quando','desc'),F.limit(80)),s=>{cb(s.docs.map(d=>d.data()))},()=>{})},
    async salvar(cid,novo,por,rhmode){
      await F.runTransaction(db,async tx=>{
        const ref=F.doc(db,'ferias_pref',cid);await tx.get(ref);
        const outros={};
        for(const rel of byId[cid].rel){const s=await tx.get(F.doc(db,'ferias_pref',rel.id));if(s.exists())outros[rel.id]=s.data()}
        const confl=conflitoDe(cid,novo.opcoes,outros);
        if(confl&&!rhmode)throw new Error(confl);
        tx.set(ref,novo);
      });
    },
    async logar(e){try{await F.addDoc(F.collection(db,'ferias_log'),e)}catch(x){}}
  };
}

/* conflito: algum relacionado já indicou o mesmo mês ou tem férias programadas nele */
function conflitoDe(cid,opcoes,pref){
  for(const o of opcoes){ if(!o)continue;
    for(const rel of byId[cid].rel){
      const p=pref[rel.id]; const outro=byId[rel.id];
      if(p&&(p.opcoes||[]).some(x=>x&&x.mes===o.mes)){const x=p.opcoes.find(x=>x&&x.mes===o.mes);return `${mlabel(o.mes)} já foi indicado por ${curto(outro.nome)} (quem se cobre não pode sair junto). Escolha outro mês.`}
      if(PROG[rel.id]&&PROG[rel.id].has(o.mes))return `${curto(outro.nome)} já tem férias programadas em ${mlabel(o.mes)}. Escolha outro mês.`;
    }}
  return null;
}
/* conflitos exibidos no quadro (pares com mesmo mês indicado) */
function conflitosVivos(){
  const res={}; // id -> Set de meses em conflito
  ROSTER.forEach(a=>{const pa=PREF[a.id];if(!pa)return;(pa.opcoes||[]).forEach(o=>{if(!o)return;
    a.rel.forEach(r=>{const pb=PREF[r.id];const hit=(pb&&(pb.opcoes||[]).some(x=>x&&x.mes===o.mes))||(PROG[r.id]&&PROG[r.id].has(o.mes));
      if(hit)(res[a.id]=res[a.id]||new Set()).add(o.mes)})})});
  return res;
}

/* ====== telas ====== */
function render(){
  $('#whoTxt').innerHTML=me?`Você: <b>${esc(curto(byId[me].nome))}</b>`+(rh?' · <b>Modo RH</b>':''):'';
  $('#trocar').hidden=!me;
  if(!me){renderLogin();return}
  const tabs=[['mine','Minhas indicações'],['board','Quadro por setor'],['cal','Calendário '+ANO],['log','Atividade']];
  $('#app').innerHTML=(rh?'<div class="rhbar">Modo RH ativo: você pode editar a indicação de qualquer colaborador e ignorar bloqueios de conflito. Alterações ficam registradas na aba Atividade.</div>':'')+
   '<div class="tabs noprint" role="tablist">'+tabs.map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${tab===t[0]}">${t[1]}</button>`).join('')+'</div><div id="panel"></div>';
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ({mine:renderMine,board:renderBoard,cal:renderCal,log:renderLog})[tab]();
}
function renderLogin(){
  const setores=[...new Set(ROSTER.map(r=>r.setor))];
  $('#app').innerHTML=`<div class="card center"><h2>Quem é você?</h2><p class="hint">Escolha seu nome para indicar os meses de férias. Todos os colegas conseguem ver o que cada pessoa indicou, com nome e horário.</p>
  <div class="field"><label for="selMe">Seu nome</label><select id="selMe"><option value="">Selecione…</option>${setores.map(s=>`<optgroup label="${esc(s)}">${ROSTER.filter(r=>r.setor===s).map(r=>`<option value="${r.id}">${esc(r.nome)}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <button class="pri" id="go">Entrar</button></div>`;
  $('#go').onclick=()=>{const v=$('#selMe').value;if(!v){toast('Escolha seu nome na lista.');return}me=v;ls('fer_me',v);tab='mine';render()};
}
let editTarget=null; // em modo RH, colaborador sendo editado
function alvoId(){return rh&&editTarget?editTarget:me}
function renderMine(){
  const id=alvoId(),r=byId[id],p=PREF[id]||{opcoes:[null,null,null],obs:''};
  const op=[0,1,2].map(i=>(p.opcoes||[])[i]||null);
  const rels=r.rel.map(x=>{const o=byId[x.id],po=PREF[x.id];const ms=(po?.opcoes||[]).filter(Boolean).map(m=>MABR[+m.mes.slice(5)-1]).join(', ');return `<li><b>${esc(curto(o.nome))}</b>${x.tipo==='cad'?' <span class="hint">(cadastro)</span>':''}: ${ms||'<span class="hint">ainda não indicou</span>'}</li>`}).join('');
  const optsHTML=i=>{const sel=op[i]?.mes||'';return `<option value="">— não indicar —</option>`+Array.from({length:12},(_,k)=>{const m=mk(k+1);const bloq=bloqueio(id,m,i);return `<option value="${m}" ${sel===m?'selected':''} ${bloq&&!rh?'disabled':''}>${MESES[k]}${bloq?' — '+esc(bloq):''}</option>`}).join('')};
  const hoje=new Date().toISOString().slice(0,10);const fechaTxt=r.aqFim&&r.aqFim<hoje?'Período aquisitivo completou em':'Período aquisitivo em curso fecha em';
  $('#panel').innerHTML=`<div class="dates"><div class="dcard"><div class="l">${fechaTxt}</div><div class="v">${fmtD(r.aqFim)}</div><div class="s">Período: ${fmtD(r.aqIni)} a ${fmtD(r.aqFim)}</div></div><div class="dcard lim"><div class="l">Data-limite para gozo</div><div class="v">${fmtD(r.limite)}</div><div class="s">As férias precisam ser gozadas até esta data.</div></div></div><div class="grid2"><div class="card"><h2>${rh&&editTarget?'Indicações de '+esc(r.nome):'Suas indicações'}</h2>
    ${rh?`<div class="field"><label for="selAlvo">Editar em nome de</label><select id="selAlvo">${ROSTER.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></div>`:''}
    ${[0,1,2].map(i=>`<div class="field"><label for="op${i}">${i+1}ª opção de mês</label><select id="op${i}">${optsHTML(i)}</select>${op[i]?`<span class="hint">Indicado por ${esc(op[i].por)} em ${when(op[i].quando)}</span>`:''}<div id="aviso${i}"></div></div>`).join('')}
    <div class="field"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" maxlength="200">${esc(p.obs||'')}</textarea></div>
    <div id="erro"></div><button class="pri" id="salvar">Salvar indicações</button> <span class="hint">As três opções devem ser meses diferentes.</span></div>
   <div class="card"><h2>Seus dados</h2><dl class="kv"><dt>Colaborador</dt><dd>${esc(r.nome)}</dd><dt>Setor</dt><dd>${esc(r.setor)}</dd><dt>Grupo de backup</dt><dd>${esc(r.grupo)}</dd></dl>
   <h3>Não pode sair no mesmo mês que</h3>${r.rel.length?`<ul style="margin:0;padding-left:18px">${rels}</ul>`:'<p class="hint">Nenhuma relação de cobertura cadastrada. Confirme com o RH.</p>'}
   ${r.recs.length?`<h3>Férias já programadas</h3><ul style="margin:0;padding-left:18px">${r.recs.map(x=>`<li>${fmtD(x.ini)} a ${fmtD(x.fim)} (${esc(x.status)})</li>`).join('')}</ul>`:''}</div></div>`;
  const aviso=()=>{[0,1,2].forEach(i=>{const m=$('#op'+i).value;let h='';if(m){if(r.limite&&m+'-01'>r.limite)h=`<div class="msg warn">Este mês é depois da data-limite (${fmtD(r.limite)}). Confirme com o RH antes.</div>`;}$('#aviso'+i).innerHTML=h})};
  [0,1,2].forEach(i=>$('#op'+i).onchange=aviso);aviso();
  const sa=$('#selAlvo');if(sa)sa.onchange=()=>{editTarget=sa.value;renderMine()};
  $('#salvar').onclick=async()=>{
    const ms=[0,1,2].map(i=>$('#op'+i).value);const usados=ms.filter(Boolean);
    if(new Set(usados).size!==usados.length){$('#erro').innerHTML='<div class="msg bad">Escolha meses diferentes nas três opções.</div>';return}
    const por=rh?'RH (gestão)':curto(byId[me].nome);const agora=new Date().toISOString();
    const opcoes=ms.map((m,i)=>{if(!m)return null;const antes=op[i];return antes&&antes.mes===m?antes:{mes:m,por,quando:agora}});
    const novo={colabId:id,opcoes,obs:$('#obs').value.trim(),atualizadoPor:por,atualizadoEm:agora};
    $('#salvar').disabled=true;$('#erro').innerHTML='';
    try{
      await DB.salvar(id,novo,por,rh);
      opcoes.forEach((o,i)=>{const a=op[i];if(o&&(!a||a.mes!==o.mes))DB.logar({quando:agora,quem:por,colabId:id,colab:r.nome,acao:a?'alterou':'indicou',slot:i+1,mes:o.mes,anterior:a?a.mes:null});if(!o&&a)DB.logar({quando:agora,quem:por,colabId:id,colab:r.nome,acao:'removeu',slot:i+1,mes:null,anterior:a.mes})});
      toast('Indicações salvas.');
    }catch(e){$('#erro').innerHTML='<div class="msg bad">'+esc(e.message||'Não foi possível salvar. Tente de novo.')+'</div>'}
    $('#salvar').disabled=false;
  };
}
function bloqueio(id,m,slot){
  const r=byId[id];
  for(const rel of r.rel){const o=byId[rel.id];if(PROG[rel.id]&&PROG[rel.id].has(m))return curto(o.nome)+' tem férias';
    const p=PREF[rel.id];if(p&&(p.opcoes||[]).some(x=>x&&x.mes===m))return 'indicado por '+curto(o.nome)}
  return '';
}
function optCell(o){return o?`<span class="opt"><b>${MABR[+o.mes.slice(5)-1]}/${o.mes.slice(2,4)}</b><small>${esc(o.por)} · ${when(o.quando)}</small></span>`:'<span class="hint">—</span>'}
function renderBoard(){
  const setores=[...new Set(ROSTER.map(r=>r.setor))];const cv=conflitosVivos();
  const lista=ROSTER.filter(r=>(!filtro.setor||r.setor===filtro.setor)&&(!filtro.pend||!(PREF[r.id]&&(PREF[r.id].opcoes||[]).some(Boolean))));
  const done=ROSTER.filter(r=>PREF[r.id]&&(PREF[r.id].opcoes||[]).some(Boolean)).length;
  let rows='',cur='';
  lista.forEach(r=>{if(r.setor!==cur){cur=r.setor;rows+=`<tr class="sec"><td colspan="9">${esc(cur)}</td></tr>`}
    const p=PREF[r.id]||{opcoes:[]};const tem=(p.opcoes||[]).some(Boolean);const c=cv[r.id];
    rows+=`<tr class="${r.id===me?'me':''}"><td class="nm">${esc(r.nome)}</td><td>${esc(r.grupo)}</td><td class="dd">${fmtD(r.aqFim)}<small class="hint" style="display:block;font-weight:400">início ${fmtD(r.aqIni)}</small></td><td class="dd">${fmtD(r.limite)}</td>${[0,1,2].map(i=>`<td>${optCell((p.opcoes||[])[i])}</td>`).join('')}<td>${c?'<span class="chip bad">Conflito</span>':tem?'<span class="chip ok">Indicado</span>':'<span class="chip pend">Pendente</span>'}${p.obs?`<small class="hint" style="display:block">${esc(p.obs)}</small>`:''}</td><td>${r.rel.length?esc(r.rel.map(x=>curto(byId[x.id].nome)).join(', ')):'<span class="hint">não cadastrado</span>'}</td></tr>`});
  $('#panel').innerHTML=`<div class="tools"><div><b>${done}</b> de ${ROSTER.length} já indicaram<div class="prog"><i style="width:${done/ROSTER.length*100}%"></i></div></div>
   <select id="fSet" aria-label="Setor"><option value="">Todos os setores</option>${setores.map(s=>`<option ${filtro.setor===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
   <label><input type="checkbox" id="fPend" ${filtro.pend?'checked':''}> só pendentes</label><button class="noprint" onclick="window.print()">Imprimir</button></div>
   <div class="tw"><table><thead><tr><th>Colaborador</th><th>Grupo de backup</th><th>Período aquisitivo fecha em</th><th>Data-limite para gozo</th><th>1ª opção</th><th>2ª opção</th><th>3ª opção</th><th>Situação</th><th>Não pode coincidir com</th></tr></thead><tbody>${rows||'<tr><td colspan="9">Nenhum colaborador.</td></tr>'}</tbody></table></div>`;
  $('#fSet').onchange=e=>{filtro.setor=e.target.value;renderBoard()};$('#fPend').onchange=e=>{filtro.pend=e.target.checked;renderBoard()};
}
function renderCal(){
  const cv=conflitosVivos();let rows='',cur='';
  ROSTER.forEach(r=>{if(r.setor!==cur){cur=r.setor;rows+=`<tr class="sec"><td colspan="13">${esc(cur)}</td></tr>`}
    const p=PREF[r.id]||{opcoes:[]};
    rows+=`<tr class="${r.id===me?'me':''}"><td class="nm">${esc(curto(r.nome))}</td>`+Array.from({length:12},(_,k)=>{const m=mk(k+1);let h='';
      const oi=(p.opcoes||[]).findIndex(o=>o&&o.mes===m);
      if(PROG[r.id].has(m))h+=`<span class="p pp" title="Férias já programadas">Prog.</span>`;
      if(oi>=0){const bad=cv[r.id]&&cv[r.id].has(m);const o=p.opcoes[oi];h+=`<span class="p ${bad?'px':'p'+(oi+1)}" title="${esc(o.por)} · ${when(o.quando)}">${oi+1}ª</span>`}
      return `<td class="c">${h}</td>`}).join('')+'</tr>'});
  $('#panel').innerHTML=`<div class="legend"><span><i style="background:var(--o1)"></i>1ª opção</span><span><i style="background:var(--o2)"></i>2ª opção</span><span><i style="background:var(--o3)"></i>3ª opção</span><span><i style="background:var(--prog)"></i>Férias já programadas</span><span><i style="background:var(--bad)"></i>Conflito entre quem se cobre</span></div>
  <div class="tw cal"><table><thead><tr><th>Colaborador</th>${MABR.map(m=>`<th class="m">${m}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderLog(){
  $('#panel').innerHTML=`<div class="card"><h2>Últimas movimentações</h2>${LOG.length?`<ul class="log">${LOG.map(l=>`<li><b>${esc(l.quem)}</b> ${l.acao==='removeu'?'removeu a '+l.slot+'ª opção ('+(l.anterior?mlabel(l.anterior):'')+')':(l.acao==='alterou'?'alterou a '+l.slot+'ª opção para <b>'+mlabel(l.mes)+'</b>':'indicou <b>'+mlabel(l.mes)+'</b> como '+l.slot+'ª opção')}${l.quem!==curto(l.colab)&&l.colab?' de <b>'+esc(curto(l.colab))+'</b>':''}<br><small>${when(l.quando)}</small></li>`).join('')}</ul>`:'<p class="hint">Ainda não há movimentações.</p>'}</div>`;
}

/* ====== inicialização ====== */
$('#trocar').onclick=()=>{me=null;rh=false;editTarget=null;ls('fer_me',null);render()};
$('#rhLnk').onclick=()=>{rh=!rh;editTarget=null;toast(rh?'Modo RH ligado.':'Modo RH desligado.');render()};
if(me&&!byId[me])me=null;
(async()=>{
  render();
  try{
    await initDB();
    if(DB.modo==='fb'){
      DB.listenPref(o=>{PREF=o;$('#dot').className='dot on';$('#liveTxt').textContent='Ao vivo';render2()},e=>{$('#dot').className='dot off';$('#liveTxt').textContent='Sem conexão';$('#banner').innerHTML='<div class="ban">Não foi possível conectar ao banco de dados ('+esc(e.code||e.message)+'). Se o problema continuar, avise o RH.</div>'});
      DB.listenLog(l=>{LOG=l;if(tab==='log')render2()});
    }else{DB.listenPref(o=>{PREF=o;render2()});}
  }catch(e){$('#dot').className='dot off';$('#liveTxt').textContent='Sem conexão';$('#banner').innerHTML='<div class="ban">Não foi possível carregar o aplicativo ('+esc(e.message)+').</div>'}
})();
/* evita perder o que está sendo digitado quando chega atualização de outro colaborador */
function render2(){
  const ae=document.activeElement;
  if(tab==='mine'&&me&&ae&&ae.closest&&ae.closest('#panel')&&['SELECT','TEXTAREA'].includes(ae.tagName)){ // só atualiza avisos de bloqueio
    const id=alvoId();[0,1,2].forEach(i=>{const s=$('#op'+i);if(!s)return;[...s.options].forEach(o=>{if(!o.value)return;const b=bloqueio(id,o.value,i);const k=+o.value.slice(5)-1;o.disabled=!!b&&!rh;o.textContent=MESES[k]+(b?' — '+b:'')})});return}
  render();
}
</script>
</body>
