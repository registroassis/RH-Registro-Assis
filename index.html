// ---------------- Calendário integrado ----------------
let CAL_STATE = {ano:2026, mes: new Date().getMonth(), setor:'', tipo:''};
function viewFeriasCalendario(){
  const {ano,mes} = CAL_STATE;
  const first = new Date(ano,mes,1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(ano,mes+1,0).getDate();

  const eventsByDay = {};
  function pushEv(dayISO, ev){ if(!eventsByDay[dayISO]) eventsByDay[dayISO]=[]; eventsByDay[dayISO].push(ev); }

  if(!CAL_STATE.tipo || CAL_STATE.tipo==='ferias'){
    S.ferias.filter(f=>f.dataSaida).forEach(f=>{
      const c = S.colaboradores.find(x=>x.id===f.colaboradorId); if(!c) return;
      if(CAL_STATE.setor && !setoresDoColaborador(c).includes(CAL_STATE.setor)) return;
      const ini = parseD(f.dataSaida); const dias = Number(f.diasGozados)||1;
      for(let i=0;i<dias;i++){ const d=addDays(ini,i); if(d.getFullYear()===ano && d.getMonth()===mes) pushEv(isoOf(d), {tone:'brass', label:c.nome+' (férias)'}); }
    });
  }
  if(!CAL_STATE.tipo || CAL_STATE.tipo==='ausencia'){
    S.ausencias.forEach(a=>{
      const c = S.colaboradores.find(x=>x.id===a.colaboradorId); if(!c) return;
      if(CAL_STATE.setor && !setoresDoColaborador(c).includes(CAL_STATE.setor)) return;
      let d = parseD(a.dataInicio); const fim = parseD(a.dataFim||a.dataInicio);
      while(d<=fim){ if(d.getFullYear()===ano && d.getMonth()===mes) pushEv(isoOf(d), {tone:'warning', label:c.nome+' ('+a.tipo+')'}); d=addDays(d,1); }
    });
  }
  if(!CAL_STATE.tipo || CAL_STATE.tipo==='atestado'){
    S.atestados.forEach(a=>{
      const c = S.colaboradores.find(x=>x.id===a.colaboradorId); if(!c) return;
      if(CAL_STATE.setor && !setoresDoColaborador(c).includes(CAL_STATE.setor)) return;
      let d = parseD(a.dataInicial); const fim = parseD(a.dataFinal||a.dataInicial);
      while(d && fim && d<=fim){ if(d.getFullYear()===ano && d.getMonth()===mes) pushEv(isoOf(d), {tone:'danger', label:c.nome+' (atestado)'}); d=addDays(d,1); }
    });
  }

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div style="min-height:86px;"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = isoOf(new Date(ano,mes,day));
    const evs = eventsByDay[iso]||[];
    cells += `<div style="min-height:86px;border:1px solid var(--line);border-radius:3px;padding:5px;background:var(--white);">
      <div class="small" style="font-weight:700;">${day}</div>
      ${evs.slice(0,3).map(e=>`<div class="small" style="background:${e.tone==='brass'?'var(--brass-light)':e.tone==='warning'?'var(--warning-bg)':'var(--danger-bg)'};border-radius:2px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(e.label)}">${esc(e.label)}</div>`).join('')}
      ${evs.length>3?`<div class="small muted">+${evs.length-3}</div>`:''}
    </div>`;
  }

  return `
  <div class="section-head"><div><h2>Calendário de férias e ausências</h2><div class="section-desc">Eventos integrados: férias, faltas e atestados</div></div></div>
  <div class="filters-bar">
    <div class="field"><label>Mês</label><select onchange="CAL_STATE.mes=Number(this.value);renderContentOnly()">${MESES.map((m,i)=>`<option value="${i}" ${CAL_STATE.mes===i?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="field"><label>Ano</label><select onchange="CAL_STATE.ano=Number(this.value);renderContentOnly()"><option ${CAL_STATE.ano===2026?'selected':''}>2026</option><option ${CAL_STATE.ano===2027?'selected':''}>2027</option></select></div>
    <div class="field"><label>Setor</label><select onchange="CAL_STATE.setor=this.value;renderContentOnly()"><option value="">Todos</option>${S.setores.map(s=>`<option value="${s.id}" ${CAL_STATE.setor===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Tipo</label><select onchange="CAL_STATE.tipo=this.value;renderContentOnly()">
      <option value="">Todos</option><option value="ferias" ${CAL_STATE.tipo==='ferias'?'selected':''}>Férias</option>

let PERIODOS_FILTER = {setor:'', situacao:''};
function viewFeriasPeriodos(){
  let colabs = S.colaboradores.filter(c=>c.status==='Ativo');
  if(PERIODOS_FILTER.setor) colabs = colabs.filter(c=>setoresDoColaborador(c).includes(PERIODOS_FILTER.setor));
  let rows = colabs.map(c=>({c, calc:calcularFerias(S,c,todayISO()), reg: registroPrincipalFerias(S,c.id)})).filter(r=>r.calc);
  if(PERIODOS_FILTER.situacao) rows = rows.filter(r=>r.calc.situacao===PERIODOS_FILTER.situacao);
  rows.sort((a,b)=> (a.calc.limiteGozo - b.calc.limiteGozo));

  const situacoes = ['VENCIDO','CRÍTICO','ATENÇÃO','PENDENTE','AGENDADO','EM GOZO','PARCIALMENTE GOZADO','GOZADO'];

  function conformidade(calc, reg){
    if(!reg || !reg.dataSaida) return '— sem registro —';
    const saida = parseD(reg.dataSaida);
    if(saida > calc.fimConcessivo) return 'FORA DO CONCESSIVO';
    if(saida < calc.inicioConcessivo) return 'ANTES DE FECHAR O AQUISITIVO';
    return 'OK';
  }
  function antecedencia(calc, reg){
    if(!reg || !reg.dataSaida) return '—';
    const meses = Math.round(daysBetween(parseD(reg.dataSaida), calc.limiteGozo)/30);
    return meses>=0 ? meses+' m' : ('atraso '+Math.abs(meses)+' m');
  }
  function ultimoDia(reg){
    if(!reg || !reg.dataSaida || !reg.diasGozados) return '—';
    return fmtD(addDays(parseD(reg.dataSaida), Number(reg.diasGozados)-1));
  }

  return `
  <div class="section-head"><div><h2>Períodos aquisitivos</h2><div class="section-desc">Réplica dos campos da planilha original — recalcula sozinho a cada acesso, a partir da data de hoje</div></div></div>
  <div class="banner info">Os campos de <strong>dias de direito, situação e limite</strong> são recalculados automaticamente todo dia. O <strong>ciclo de referência</strong> (colunas "Início/Fim do período aquisitivo") agora também avança sozinho, assim que o período é totalmente gozado/vendido e não há mais nenhuma parcela pendente. Você ainda pode ajustar manualmente em Colaboradores → "Ciclos de férias já quitados", se precisar corrigir algo.</div>
  <div class="filters-bar">
    <div class="field"><label>Setor</label><select onchange="PERIODOS_FILTER.setor=this.value;renderContentOnly()"><option value="">Todos</option>${S.setores.map(s=>`<option value="${s.id}" ${PERIODOS_FILTER.setor===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Situação</label><select onchange="PERIODOS_FILTER.situacao=this.value;renderContentOnly()"><option value="">Todas</option>${situacoes.map(s=>`<option ${PERIODOS_FILTER.situacao===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <button class="btn btn-sm" onclick="exportCSV(periodosParaCSV(),'periodos_aquisitivos.csv')">Exportar CSV</button>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr>
      <th>Colaborador</th><th>Setor</th><th>Admissão</th><th>Fér. vencidas</th><th>Fér. proporcionais</th>
      <th>Início aquisitivo</th><th>Fim aquisitivo</th><th>Dias direito</th><th>Dias gozados</th><th>Dias vendidos</th><th>Dias restantes</th>
      <th>Limite p/ gozo</th><th>Situação</th><th>Mês programado</th><th>Backup</th><th>Data saída (real)</th>
      <th>Dias gozados nesta saída</th><th>Último dia de férias</th><th>Antecedência</th><th>Conformidade</th><th>Observação</th>
    </tr></thead>
    <tbody>
    ${rows.map(({c,calc,reg})=>`<tr>
      <td class="name-cell" style="cursor:pointer;" onclick="navigate('colaborador-ficha',{id:'${c.id}'})">${esc(c.nome)}</td>
      <td>${esc(setorNome(c.setorPrincipal))}</td>
      <td>${fmtD(parseD(c.admissao))}</td>
      <td>${calc.feriasVencidas}</td>
      <td>${esc(calc.feriasProporcionais)}</td>
      <td>${fmtD(calc.inicioAq)}</td><td>${fmtD(calc.fimAq)}</td>
      <td>${calc.diasDireito}</td><td>${calc.diasGozados}</td><td>${calc.diasVendidos||0}</td><td>${calc.diasRestantes}</td>
      <td>${fmtD(calc.limiteGozo)}</td><td>${selo(calc.situacao, situacaoTone(calc.situacao))}</td>
      <td>${esc(reg?.mesProgramado||'—')}</td><td>${reg?.backupId? esc(colabNome(reg.backupId)) : '—'}</td>
      <td>${reg?.dataSaida? fmtD(parseD(reg.dataSaida)) : '—'}</td>
      <td>${reg?.diasGozados||'—'}</td>
      <td>${ultimoDia(reg)}</td>
      <td>${antecedencia(calc,reg)}</td>
      <td class="small">${conformidade(calc,reg)}</td>
      <td class="small muted" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${esc(reg?.observacao||'')}">${esc(reg?.observacao||'')}</td>
    </tr>`).join('') || `<tr><td colspan="20"><div class="empty-state">Nenhum registro.</div></td></tr>`}
    </tbody>
  </table></div></div>`;
}
function periodosParaCSV(){
  const rows=[['Colaborador','Setor','Admissão','Fér. vencidas','Fér. proporcionais','Início aquisitivo','Fim aquisitivo','Dias direito','Dias gozados','Dias vendidos','Dias restantes','Limite p/ gozo','Situação','Mês programado','Backup','Data saída real','Dias gozados nesta saída','Último dia de férias','Antecedência','Conformidade','Observação']];
  S.colaboradores.filter(c=>c.status==='Ativo').forEach(c=>{
    const calc = calcularFerias(S,c,todayISO()); if(!calc) return; const reg = registroPrincipalFerias(S,c.id);
    const ultimo = (reg&&reg.dataSaida&&reg.diasGozados) ? fmtD(addDays(parseD(reg.dataSaida), Number(reg.diasGozados)-1)) : '';
    rows.push([c.nome, setorNome(c.setorPrincipal), c.admissao, calc.feriasVencidas, calc.feriasProporcionais, isoOf(calc.inicioAq), isoOf(calc.fimAq), calc.diasDireito, calc.diasGozados, calc.diasVendidos||0, calc.diasRestantes, isoOf(calc.limiteGozo), calc.situacao, reg?.mesProgramado||'', reg?.backupId?colabNome(reg.backupId):'', reg?.dataSaida||'', reg?.diasGozados||'', ultimo, '', '', reg?.observacao||'']);
  });
  return rows;
}
const STATUS_FERIAS = ['Sem programação','Sugestão','Programada','Em gozo','Concluída'];

  switch(s){ case 'Programada': return 'info'; case 'Em gozo': return 'brass'; case 'Sugestão': return 'warning'; case 'Concluída': return 'success'; default: return 'neutral'; }
}

function checarAbonoLive(){
  const form = q('#f-ferias'); if(!form) return;
  const box = q('#ff-abono-box'); if(!box) return;
  const colabId = q('#ff-colab').value;
  const vendidos = Number(form.diasVendidos.value)||0;
  const gozados = Number(form.diasGozados.value)||0;
  if(!colabId){ box.innerHTML=''; return; }
  const c = S.colaboradores.find(x=>x.id===colabId);
  const calc = calcularFerias(S, c, todayISO());
  if(!calc){ box.innerHTML=''; return; }
  const limite = calc.limiteAbono;
  const totalPeriodo = calc.diasGozados + calc.diasVendidos + gozados + vendidos; // aproximação incluindo o que já está lançado + o que está sendo digitado agora
  if(vendidos===0){ box.innerHTML=''; return; }
  if(vendidos > limite){
    box.innerHTML = `<div class="banner warn">⚠ O limite legal é de até <strong>${limite} dias</strong> (1/3 dos ${calc.diasDireito} dias de direito). Você está lançando ${vendidos} dia(s) vendido(s).</div>`;
  } else if(gozados + vendidos > calc.diasDireito){
    box.innerHTML = `<div class="banner warn">⚠ A soma de dias gozados (${gozados}) + vendidos (${vendidos}) ultrapassa os ${calc.diasDireito} dias de direito deste período.</div>`;
  } else {
    box.innerHTML = `<div class="banner info">✓ Dentro do limite legal: até ${limite} dia(s) podem ser vendidos neste período.</div>`;
  }
}

function checarConflitoLive(){
  const form = q('#f-ferias'); if(!form) return;
  const box = q('#ff-conflito-box');
  const colabId = q('#ff-colab').value;
  const dataSaida = form.dataSaida.value, dias = form.diasGozados.value, mes = form.mesProgramado.value;
  if(!colabId){ box.innerHTML=''; return; }
  const c = S.colaboradores.find(x=>x.id===colabId);
  const meusSetores = setoresDoColaborador(c);
  const outros = S.ferias.filter(f=>f.colaboradorId!==colabId && f.status!=='Cancelada');
  const achados = [];
  outros.forEach(f=>{
    const oc = S.colaboradores.find(x=>x.id===f.colaboradorId); if(!oc) return;
    const comuns = setoresDoColaborador(oc).filter(s=>meusSetores.includes(s));
    if(comuns.length===0) return;
    let conflita=false;
    if(dataSaida && dias && f.dataSaida && f.diasGozados){
      const a={ini:parseD(dataSaida), fim:addDays(parseD(dataSaida), Number(dias)-1)};
      const b=rangeDoRegistro(f);
      conflita = overlapExact(a,b);
    } else if(mes && f.mesProgramado){
      conflita = mesesDoRegistro({mesProgramado:mes}).some(t=>mesesDoRegistro(f).includes(t));
    }
    if(conflita) achados.push({oc, comuns, f});
  });
  if(achados.length===0){ box.innerHTML = `<div class="banner info" style="margin-top:2px;">✓ Sem conflito identificado para este período.</div>`; q('#ff-forcar-box').style.display='none'; }
  else {
    box.innerHTML = `<div class="banner warn" style="margin-top:2px;"><strong>⚠ CONFLITO DE FÉRIAS</strong><br>${achados.map(a=>`Não é recomendado programar férias neste período porque ${esc(a.oc.nome)} também estará de férias, e ambos pertencem ao setor <strong>${esc(setorNome(a.comuns[0]))}</strong>.`).join('<br>')}</div>`;
    q('#ff-forcar-box').style.display='block';
  }
}

function atualizarSugestaoFerias(){
  const colabId = q('#ff-colab').value;
  const box = q('#ff-sugestao-box');
  checarConflitoLive();
  checarAbonoLive();
  if(!colabId){ box.innerHTML=''; return; }
  const c = S.colaboradores.find(x=>x.id===colabId);
  const calc = calcularFerias(S, c, todayISO());
  if(!calc || calc.diasRestantes<=0){ box.innerHTML = `<div class="help">Colaborador sem saldo de férias no período atual.</div>`; return; }
  const meusSetores = setoresDoColaborador(c);
  const ocupados = {}; // mes -> [nomes]
  S.ferias.filter(f=>f.colaboradorId!==colabId && f.status!=='Cancelada').forEach(f=>{
    const oc = S.colaboradores.find(x=>x.id===f.colaboradorId); if(!oc) return;
    if(!setoresDoColaborador(oc).some(s=>meusSetores.includes(s))) return;
    mesesDoRegistro(f).forEach(m=>{ if(!ocupados[m]) ocupados[m]=[]; ocupados[m].push(oc.nome); });
  });
  const sugestoes = MESES.map(m=>{
    const conflitantes = ocupados[m]||[];
    return {mes:m, livre: conflitantes.length===0, conflitantes};
  });
  box.innerHTML = `<fieldset><legend>Sugestão automática de período</legend>
    <div class="small muted" style="margin-bottom:8px;">Considera saldo (${calc.diasRestantes}d), limite (${fmtD(calc.limiteGozo)}) e férias já programadas no(s) setor(es).</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${sugestoes.map(s=>`<span class="pill" style="background:${s.livre?'var(--success-bg)':'var(--danger-bg)'};border-color:transparent;">${s.mes}${s.livre?' — sem conflito':' — conflito: '+esc(s.conflitantes.join(', '))}</span>`).join('')}
    </div></fieldset>`;
}

function salvarFerias(id){
  const form = q('#f-ferias'); if(!form.reportValidity()) return;
  const d = fieldsToObj(form);
  d.ano = Number(d.ano)||2026;
  d.diasGozados = d.diasGozados? Number(d.diasGozados) : null;
  d.diasVendidos = d.diasVendidos? Number(d.diasVendidos) : null;

  // Não deixa programar mais dias do que o colaborador tem de período aquisitivo disponível na data da saída
  // (ex.: se na data da programação ele só tem 17 dias adquiridos, não pode programar 30). Só permite passar
  // por cima disso pelo mesmo caminho de "forçar com justificativa" já usado para conflitos.
  if(d.colaboradorId && d.dataSaida && d.diasGozados){
    const colab = S.colaboradores.find(c=>c.id===d.colaboradorId);
    if(colab){
      const outrasFerias = S.ferias.filter(f=>f.id!==id);
      const estadoTemp = {...S, ferias: outrasFerias};
      const calc = calcularFerias(estadoTemp, colab, d.dataSaida);
      if(calc && d.diasGozados > calc.diasRestantes + 0.01){
        if(!d.forcado){
          toast(`${colab.nome} tem apenas ${calc.diasRestantes} dia(s) de período aquisitivo disponível em ${fmtD(parseD(d.dataSaida))} — não é possível programar ${d.diasGozados} dias. Marque "Programar mesmo assim" e justifique, se for uma exceção deliberada.`, 'danger');
          return;
        }
        if(!d.justificativaForcado){
          toast('Informe a justificativa: esta programação excede o período aquisitivo disponível.', 'danger');
          return;
        }
      }
    }
  }
  if(d.forcado && !d.justificativaForcado){ toast('Informe a justificativa para forçar a programação.', 'danger'); return; }

  if(id){
    const f = S.ferias.find(x=>x.id===id);
    const antes = {...f};
    Object.assign(f, d);
    logAudit('edicao','ferias', `Alterou férias de ${colabNome(f.colaboradorId)}: ${antes.dataSaida||'—'} → ${f.dataSaida||'—'}`);
  } else {
    const novo = {id:'f'+Date.now(), criadoPor: CUR.nome, criadoEm:new Date().toISOString(), ...d};
    S.ferias.push(novo);
    logAudit('criacao','ferias', `Programou férias para ${colabNome(novo.colaboradorId)}`);
  }
  atualizarStatusFeriasAutomatico(S);
  persist(); closeModal(); render(); toast('Programação salva.');
}
function excluirFerias(id){
  const f = S.ferias.find(x=>x.id===id);
  confirmAction('Cancelar esta programação de férias? O registro será marcado como Cancelada (histórico preservado).', ()=>{
    f.status = 'Cancelada';
    logAudit('cancelamento','ferias', `Cancelou programação de férias de ${colabNome(f.colaboradorId)}`);

function adicionarAoGrupo(setorId){
  const sel = q('#add-grupo-'+setorId);
  if(!sel){ toast('Não encontrei a lista de colaboradores — recarregue a página e tente de novo.', 'danger'); return; }
  const colabId = sel.value;
  if(!colabId) { toast('Selecione um colaborador antes de clicar em Adicionar.', 'warning'); return; }
  const c = S.colaboradores.find(x=>x.id===colabId);
  if(!c){ toast('Colaborador não encontrado.', 'danger'); return; }
  if(c.setorPrincipal===setorId) { toast('Este colaborador já é do grupo.', 'warning'); return; }
  if(!c.outrosSetores) c.outrosSetores = [];
  if(!c.outrosSetores.includes(setorId)) c.outrosSetores.push(setorId);
  logAudit('edicao','colaborador', `Incluiu ${c.nome} no grupo de conflito do setor ${setorNome(setorId)}`);
  persist(); render(); toast('Colaborador adicionado ao grupo.');
}

function removerDoGrupo(colabId, setorId){
  const c = S.colaboradores.find(x=>x.id===colabId);
  if(c.setorPrincipal===setorId){
    toast('Este é o setor principal do colaborador — use "Trocar setor" para substituí-lo, em vez de apenas remover.', 'warning');
    return;
  }
  confirmAction(`Remover ${c.nome} do grupo de conflito do setor ${setorNome(setorId)}?`, ()=>{
    c.outrosSetores = (c.outrosSetores||[]).filter(s=>s!==setorId);
    logAudit('edicao','colaborador', `Removeu ${c.nome} do grupo de conflito do setor ${setorNome(setorId)}`);
    persist(); render(); toast('Removido do grupo.');
  }, {confirmLabel:'Remover'});
}

  const body = `

function confirmarTrocarSetor(colabId, setorAtualId, ehPrincipal){
  const novoSetor = q('[name=novoSetor]').value;

let AUS_FILTER = {tipo:'', setor:'', colaborador:'', ini:'', fim:'', mes:'', ano:''};

function calcDias(iniISO,fimISO){ if(!iniISO||!fimISO) return ''; return daysBetween(parseD(iniISO),parseD(fimISO))+1; }

// Descreve o período de uma ausência de forma legível: "1 dia completo", "3 dias", "2h (parcial)" etc.
function descricaoPeriodoAusencia(a){
  const dias = Number(a.dias)||0;
  const horas = Number(a.horas)||0;
  if(a.horaInicio && a.horaFim){
    return `${horas}h parcial (${a.horaInicio}–${a.horaFim})`;
  }
  if(dias<=1){
    return horas ? `1 dia completo (${horas}h)` : '1 dia completo';
  }
  return horas ? `${dias} dias (${horas}h)` : `${dias} dias`;
}

function viewAusencias(){
  let list = S.ausencias.slice();
  if(AUS_FILTER.tipo) list = list.filter(a=>a.tipo===AUS_FILTER.tipo);
  if(AUS_FILTER.colaborador) list = list.filter(a=>a.colaboradorId===AUS_FILTER.colaborador);
  if(AUS_FILTER.setor) list = list.filter(a=>{ const c=S.colaboradores.find(x=>x.id===a.colaboradorId); return c && setoresDoColaborador(c).includes(AUS_FILTER.setor); });
  if(AUS_FILTER.mes!==''){
    const ano = Number(AUS_FILTER.ano)||new Date().getFullYear();
    const mes = Number(AUS_FILTER.mes);
    const iniMes = isoOf(new Date(ano,mes,1)), fimMes = isoOf(new Date(ano,mes+1,0));
    list = list.filter(a=>a.dataFim>=iniMes && a.dataInicio<=fimMes);
  } else {
    if(AUS_FILTER.ini) list = list.filter(a=>a.dataFim>=AUS_FILTER.ini);
    if(AUS_FILTER.fim) list = list.filter(a=>a.dataInicio<=AUS_FILTER.fim);
  }
  list.sort((a,b)=>b.dataInicio.localeCompare(a.dataInicio));

  const semLicenca = list.filter(a=>a.tipo!=='Licença maternidade/paternidade');
  const totalDias = semLicenca.reduce((s,a)=>s+(Number(a.dias)||0),0);
  const totalHoras = semLicenca.reduce((s,a)=>s+(Number(a.horas)||0),0);
  const totalInjustificadas = list.filter(a=>(a.tipo||'').toLowerCase().includes('injustificada')).length;
  const colabsEnvolvidos = new Set(list.map(a=>a.colaboradorId)).size;

  // Painel: distribuição por tipo (maior → menor), sobre o conjunto já filtrado — licença maternidade/
  // paternidade também não entra aqui, pelo mesmo motivo (não é considerada falta/ausência para fins de
  // contagem de dias).
  const porTipo = {};
  semLicenca.forEach(a=>{ if(!porTipo[a.tipo]) porTipo[a.tipo]={n:0, dias:0}; porTipo[a.tipo].n++; porTipo[a.tipo].dias+=Number(a.dias)||0; });
  const tiposOrdenados = Object.entries(porTipo).sort((a,b)=>b[1].dias-a[1].dias);
  const maxTipoDias = tiposOrdenados.length? tiposOrdenados[0][1].dias||1 : 1;
  const coresTipo = ['var(--ink)','var(--brass)','var(--info)','var(--danger)','var(--warning)','var(--success)'];

  return `
  <div class="section-head">
    <div><h2>Faltas e ausências</h2><div class="section-desc">Painel do período filtrado — ajuste os filtros abaixo para refinar</div></div>
    ${isGestao()?`<button class="btn btn-primary" onclick="abrirFormAusencia()">+ Registrar ausência</button>`:''}
  </div>
  <div class="grid grid-4" style="margin-bottom:16px;">
    <div class="card stat-card"><div class="label">Registros</div><div class="value">${list.length}</div><div class="sub">${colabsEnvolvidos} colaborador(es) envolvido(s)</div></div>
    <div class="card stat-card"><div class="label">Dias ausentes</div><div class="value">${totalDias}</div></div>
    <div class="card stat-card"><div class="label">Horas ausentes</div><div class="value">${totalHoras}</div></div>
    <div class="card stat-card accent-danger"><div class="label">Faltas injustificadas</div><div class="value">${totalInjustificadas}</div></div>
  </div>
  <div class="card card-pad" style="margin-bottom:16px;">
    <h3 style="font-size:14px;margin-bottom:10px;">Distribuição por tipo</h3>
    ${tiposOrdenados.length? `<div style="display:flex;flex-direction:column;gap:9px;">
      ${tiposOrdenados.map(([tipo,v],i)=>`
        <div>
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
            <span>${esc(tipo)}</span><span class="mono">${v.n} reg. · ${v.dias} dia(s)</span>
          </div>
          <div style="background:var(--paper-2);border-radius:3px;height:8px;"><div style="width:${(v.dias/maxTipoDias)*100}%;background:${coresTipo[i%coresTipo.length]};height:8px;border-radius:3px;"></div></div>
        </div>`).join('')}
    </div>` : `<div class="muted small">Sem registros no período filtrado.</div>`}
  </div>
  <div class="filters-bar">
    <div class="field"><label>Mês</label><select onchange="AUS_FILTER.mes=this.value;renderContentOnly()"><option value="">Todos</option>${MESES.map((m,i)=>`<option value="${i}" ${AUS_FILTER.mes===String(i)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="field"><label>Ano</label><select onchange="AUS_FILTER.ano=this.value;renderContentOnly()"><option value="2026" ${AUS_FILTER.ano===''||AUS_FILTER.ano==='2026'?'selected':''}>2026</option><option value="2027" ${AUS_FILTER.ano==='2027'?'selected':''}>2027</option></select></div>
    <div class="field"><label>Tipo</label><select onchange="AUS_FILTER.tipo=this.value;renderContentOnly()"><option value="">Todos</option>${S.tiposAusencia.map(t=>`<option ${AUS_FILTER.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Setor</label><select onchange="AUS_FILTER.setor=this.value;renderContentOnly()"><option value="">Todos</option>${S.setores.map(s=>`<option value="${s.id}" ${AUS_FILTER.setor===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>
    <div class="field"><label>Colaborador</label><select onchange="AUS_FILTER.colaborador=this.value;renderContentOnly()"><option value="">Todos</option>${S.colaboradores.map(c=>`<option value="${c.id}" ${AUS_FILTER.colaborador===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
    ${AUS_FILTER.mes===''? `<div class="field"><label>De</label><input type="date" value="${AUS_FILTER.ini}" onchange="AUS_FILTER.ini=this.value;renderContentOnly()"></div>
    <div class="field"><label>Até</label><input type="date" value="${AUS_FILTER.fim}" onchange="AUS_FILTER.fim=this.value;renderContentOnly()"></div>`:''}
    <button class="btn btn-sm" onclick="exportCSV(ausenciasParaCSV(),'ausencias.csv')">Exportar CSV</button>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Colaborador</th><th>Setor</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Período</th><th>CID</th><th>Motivo</th><th></th></tr></thead>
    <tbody>${list.map(a=>{ const c=S.colaboradores.find(x=>x.id===a.colaboradorId);
      return `<tr><td class="name-cell">${esc(c?c.nome:'—')}</td><td>${esc(setorNome(c?.setorPrincipal))}</td><td>${selo(a.tipo, a.tipo.includes('injustificada')?'danger':'neutral')}</td>
      <td>${fmtD(parseD(a.dataInicio))}</td><td>${fmtD(parseD(a.dataFim))}</td><td class="small">${descricaoPeriodoAusencia(a)}</td>
      <td class="mono small">${esc(a.cid||'—')}</td>
      <td class="small">${esc(a.motivo||'—')}</td><td>${isGestao()?`<button class="btn btn-sm btn-ghost" onclick="abrirFormAusencia('${a.id}')">Editar</button>`:''}</td></tr>`;
    }).join('') || `<tr><td colspan="9"><div class="empty-state">Nenhuma ausência encontrada.</div></td></tr>`}</tbody>
  </table></div></div>`;
}

function timeToDecimal(t){ if(!t) return null; const [h,m] = t.split(':').map(Number); return h + m/60; }
function calcHorasEntreHorarios(hi,hf){
  const a=timeToDecimal(hi), b=timeToDecimal(hf);
  if(a==null || b==null) return '';
  let diff = b-a; if(diff<0) diff += 24;
  return Math.round(diff*100)/100;
}

function autoCalcHorasAus(){ const f=q('#f-aus'); q('#aus-horas').value = calcHorasEntreHorarios(f.horaInicio.value, f.horaFim.value); }

function salvarAusencia(id){

function autoCalcFimAtestado(){
  const f=q('#f-atestado');
  const ini = f.dataInicial.value; const dias = Number(f.dias.value)||0;
  if(!ini || dias<=0){ q('#at-datafinal').value=''; return; }
  q('#at-datafinal').value = isoOf(addDays(parseD(ini), dias-1));
}
function salvarAtestado(id){
  const form = q('#f-atestado'); if(!form.reportValidity()) return;
  const d = fieldsToObj(form);
  d.dias = Number(d.dias)||1; d.horas = Number(d.horas)||0;
  if(!d.dataFinal) d.dataFinal = isoOf(addDays(parseD(d.dataInicial), d.dias-1));
  d.dataAtestado = d.dataInicial; // mantém preenchido internamente por compatibilidade com relatórios existentes
  if(!podeVerCID()){ delete d.cid; }
  if(id){
    const at = S.atestados.find(x=>x.id===id);
    if(!podeVerCID()){ d.cid = at.cid; }
    Object.assign(at, d);
    // mantém o registro espelho em Ausências sincronizado com a edição
    const ausEspelho = S.ausencias.find(a=>a.origemAtestadoId===id);
    if(ausEspelho){ Object.assign(ausEspelho, {dataInicio:d.dataInicial, dataFim:d.dataFinal, dias:d.dias, horas:d.horas, cid:d.cid||''}); }
    logAudit('edicao','atestado', `Editou atestado de ${colabNome(d.colaboradorId)}`);
  } else {
    const novoId = 'at'+Date.now();
    S.atestados.push({id:novoId, lancadoPor:CUR.nome, lancadoEm:new Date().toISOString(), ...d});
    logAudit('criacao','atestado', `Registrou atestado de ${colabNome(d.colaboradorId)}`);
    // também gera um registro correspondente em ausências para os indicadores de absenteísmo, vinculado a este atestado
    const c = S.colaboradores.find(x=>x.id===d.colaboradorId);
    S.ausencias.push({id:'au'+Date.now()+1, origemAtestadoId:novoId, colaboradorId:d.colaboradorId, setorId:c?c.setorPrincipal:null, tipo:'Atestado médico', dataInicio:d.dataInicial, dataFim:d.dataFinal, dias:d.dias, horas:d.horas, cid:d.cid||'', motivo:'Atestado médico', lancadoPor:CUR.nome, lancadoEm:new Date().toISOString()});
  }
  persist(); closeModal(); render(); toast('Atestado salvo.');
}
function excluirAtestado(id){
  const at = S.atestados.find(x=>x.id===id);
  if(!at) return;
  confirmAction(`Excluir o atestado de ${colabNome(at.colaboradorId)} (${fmtD(parseD(at.dataAtestado))})? Esta ação não pode ser desfeita.`, ()=>{
    S.atestados = S.atestados.filter(x=>x.id!==id);
    S.ausencias = S.ausencias.filter(a=>{
      if(a.origemAtestadoId===id) return false; // vínculo direto (atestados criados após esta atualização)
      // fallback para atestados criados antes deste vínculo existir: casa pelo colaborador/tipo/datas
      if(!a.origemAtestadoId && a.tipo==='Atestado médico' && a.colaboradorId===at.colaboradorId && a.dataInicio===at.dataInicial && a.dataFim===at.dataFinal) return false;
      return true;
    });
    logAudit('remocao','atestado', `Excluiu atestado de ${colabNome(at.colaboradorId)} (${at.dataInicial} a ${at.dataFinal})`);
    persist(); closeModal(); render(); toast('Atestado excluído.');
  }, {confirmLabel:'Excluir'});
}
function exportCSV(rows, filename){
  const csv = rows.map(r=>r.map(v=>{ v=String(v??''); return /[,"\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
  toast('Exportado: '+filename);
}

function relatorioSetorCSV(){

    const feriasProg = S.ferias.filter(f=>{ const c=S.colaboradores.find(x=>x.id===f.colaboradorId); return c && c.status==='Ativo' && setoresDoColaborador(c).includes(s.id); }).length;

  });
  return rows;
}

// Ranking de setores por total de dias de ausência — recalculado a cada acesso, sempre do maior para o menor.
function rankingSetorAusencias(ausencias){
  // Licença (maternidade/paternidade, nojo etc.) não entra no ranking — só faltas e ausências de fato.
  ausencias = ausencias.filter(a=>!(a.tipo||'').toLowerCase().includes('licença'));
  const porSetor = {};
  ausencias.forEach(a=>{
    const c = S.colaboradores.find(x=>x.id===a.colaboradorId); if(!c) return;
    setoresDoColaborador(c).forEach(sid=>{
      if(!porSetor[sid]) porSetor[sid] = {dias:0, registros:0};
      porSetor[sid].dias += Number(a.dias)||0; porSetor[sid].registros++;
    });
  });
  const linhas = Object.entries(porSetor).sort((a,b)=>b[1].dias-a[1].dias);
  if(linhas.length===0) return `<div class="empty-state" style="padding:14px;">Sem ausências no período.</div>`;
  const max = linhas[0][1].dias || 1;
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${linhas.map(([sid,v],i)=>`
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
          <span>${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(setorNome(sid))}</span>
          <span class="mono">${v.dias} dia(s) · ${v.registros} reg.</span>
        </div>
        <div style="background:var(--paper-2);border-radius:3px;height:9px;"><div style="width:${(v.dias/max)*100}%;background:var(--brass);height:9px;border-radius:3px;"></div></div>
      </div>`).join('')}
  </div>`;
}

// Ranking de colaboradores por total de dias de ausência — quem mais se ausenta/falta primeiro.
function rankingColaboradorAusencias(ausencias){
  // Licença (maternidade/paternidade, nojo etc.) não entra no ranking — só faltas e ausências de fato.
  ausencias = ausencias.filter(a=>!(a.tipo||'').toLowerCase().includes('licença'));
  const porColab = {};
  ausencias.forEach(a=>{
    if(!porColab[a.colaboradorId]) porColab[a.colaboradorId] = {dias:0, registros:0, faltas:0};
    porColab[a.colaboradorId].dias += Number(a.dias)||0;
    porColab[a.colaboradorId].registros++;
    if((a.tipo||'').toLowerCase().includes('falta')) porColab[a.colaboradorId].faltas++;
  });
  const linhas = Object.entries(porColab).sort((a,b)=>b[1].dias-a[1].dias).slice(0,10);
  if(linhas.length===0) return `<div class="empty-state" style="padding:14px;">Sem ausências no período.</div>`;
  const max = linhas[0][1].dias || 1;
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${linhas.map(([cid,v],i)=>`
      <div style="cursor:pointer;" onclick="navigate('colaborador-ficha',{id:'${cid}'})">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
          <span>${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(colabNome(cid))}</span>
          <span class="mono">${v.dias} dia(s) · ${v.faltas} falta(s)</span>
        </div>
        <div style="background:var(--paper-2);border-radius:3px;height:9px;"><div style="width:${(v.dias/max)*100}%;background:var(--danger);height:9px;border-radius:3px;"></div></div>
      </div>`).join('')}
  </div>`;
}

  const foot = `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarBeneficio(${b?`'${b.id}'`:'null'})">Salvar</button>`;
  openModal(b?'Editar benefício':'Novo benefício', body, foot);
}
function salvarBeneficio(id){
  const form = q('#f-beneficio'); if(!form.reportValidity()) return;
  const d = fieldsToObj(form); d.valorMensal = Number(d.valorMensal)||0;
  if(id){
    const b = S.beneficios.find(x=>x.id===id);
    const antes = b.valorMensal;
    b.valorMensal = d.valorMensal;
    logAudit('edicao','beneficio', `Alterou valor mensal de "${b.nome}": ${fmtMoeda(antes)} → ${fmtMoeda(b.valorMensal)}`);
  } else {
    const novoId = d.nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    S.beneficios.push({id: novoId||('beneficio-'+Date.now()), nome:d.nome, valorMensal:d.valorMensal});
    logAudit('criacao','beneficio', `Criou benefício "${d.nome}" (${fmtMoeda(d.valorMensal)}/mês)`);
  }
  persist(); closeModal(); render(); toast('Benefício salvo.');
}
function excluirBeneficio(id){
  const b = S.beneficios.find(x=>x.id===id);
  confirmAction(`Remover o benefício "${b.nome}"? Ele deixará de contar no custo da folha e das simulações.`, ()=>{
    S.beneficios = S.beneficios.filter(x=>x.id!==id);
    logAudit('remocao','beneficio', `Removeu benefício "${b.nome}"`);
    persist(); render(); toast('Benefício removido.');
  }, {confirmLabel:'Remover'});
}

function rotuloTipoAjuste(t){ return {reajustePercentual:'Reajuste %',reajusteFixo:'Reajuste R$',novoCargoSalario:'Novo cargo/salário',contratacao:'Contratação',desligamento:'Desligamento',reajusteBeneficio:'Reajuste de benefício'}[t]||t; }
function rotuloAlvoAjuste(aj){
  if(aj.tipo==='contratacao') return aj.nomeContratacao||'—';
  if(aj.tipo==='desligamento') return esc(colabNome(aj.alvoId));
  if(aj.tipo==='reajusteBeneficio'){ const b=beneficioPorId(S,aj.beneficioId); return b?esc(b.nome):'—'; }
  if(aj.alvoTipo==='todos') return 'Todos os colaboradores';
  if(aj.alvoTipo==='cargo'){ const cg=cargoPorClasse(S,aj.alvoId); return cg? 'Classe '+cg.classe+' — '+esc(cg.nome) : '—'; }
  if(aj.alvoTipo==='colaborador') return esc(colabNome(aj.alvoId));
  return '—';
}
function detalheAjuste(aj){
  if(aj.tipo==='reajustePercentual') return `+${aj.percentual}%`;
  if(aj.tipo==='reajusteFixo') return `+${fmtMoeda(aj.valorFixo)}`;
  if(aj.tipo==='novoCargoSalario'){ const cg=cargoPorClasse(S,aj.novoCargoClasse); return `Novo cargo: ${cg?cg.nome:'—'} · Novo salário: ${fmtMoeda(aj.novoSalario)}`; }
  if(aj.tipo==='contratacao'){ const cg=cargoPorClasse(S,aj.cargoClasseContratacao); return `${cg?cg.nome:'—'} · ${fmtMoeda(aj.salarioContratacao)}`; }
  if(aj.tipo==='desligamento') return `Desligamento em ${aj.dataInicio?fmtD(parseD(aj.dataInicio)):'data não informada'}`;
  if(aj.tipo==='reajusteBeneficio') return `Novo valor mensal total: ${fmtMoeda(aj.novoValorBeneficio)}`;
  return '';
}

function criarNovoCenario(){
  const nome = prompt('Nome do cenário (ex: "Reajuste 2027"):');
  if(!nome) return;
  const novo = {id:'sc'+Date.now(), nome, ajustes:[], criadoEm:new Date().toISOString(), criadoPor:CUR.nome};
  S.cenarios.push(novo);
  logAudit('criacao','cenario', `Criou cenário "${nome}"`);
  persist(); SIM_CENARIO_ATUAL = novo.id; render(); toast('Cenário criado.');

function renomearCenario(id){
  const c = S.cenarios.find(x=>x.id===id);
  const novoNome = prompt('Novo nome do cenário:', c.nome);
  if(!novoNome) return;
  c.nome = novoNome; logAudit('edicao','cenario', `Renomeou cenário para "${novoNome}"`);

}

function atualizarPreviewBeneficio(){
  const sel = q('#aj-beneficio-select'); if(!sel) return;
  const b = beneficioPorId(S, sel.value);
  const boxAtual = q('#aj-beneficio-atual');
  const boxDif = q('#aj-beneficio-diferenca');
  if(!b){ boxAtual.innerHTML=''; boxDif.innerHTML=''; return; }
  boxAtual.innerHTML = `<div class="banner info">Valor mensal atual de <strong>${esc(b.nome)}</strong>: <strong>${fmtMoeda(b.valorMensal)}</strong></div>`;
  const novoValor = Number(q('#aj-beneficio-novovalor').value);
  if(!novoValor){ boxDif.innerHTML=''; return; }
  const diferenca = Math.round((novoValor-b.valorMensal)*100)/100;
  const pct = b.valorMensal>0 ? Math.round((diferenca/b.valorMensal)*10000)/100 : null;
  const cor = diferenca>=0 ? 'var(--danger)' : 'var(--success)';
  boxDif.innerHTML = `<div class="banner ${diferenca>=0?'warn':'info'}">Vai para: <strong>${fmtMoeda(novoValor)}</strong> · Diferença: <strong style="color:${cor}">${diferenca>=0?'+':''}${fmtMoeda(diferenca)}${pct!=null?` (${diferenca>=0?'+':''}${pct}%)`:''}</strong></div>`;
}
function atualizarOpcoesFaixa(){
  const sel = q('#aj-faixa-promo');
  const classeVal = q('#aj-novocargo-promo').value;
  if(!sel) return;
  if(!classeVal){ sel.innerHTML = `<option value="">— Selecione o cargo/classe acima primeiro —</option>`; return; }
  const cg = cargoPorClasse(S, classeVal);
  if(!cg){ sel.innerHTML = `<option value="">—</option>`; return; }
  const ordem = [['inicial','Inicial'],['A','Letra A'],['B','Letra B'],['C','Letra C'],['D','Letra D (referência)'],['E','Letra E'],['F','Letra F'],['G','Letra G (máximo)']];
  const opcoes = ordem.filter(([k])=>typeof cg.faixas[k]==='number').map(([k,label])=>`<option value="${cg.faixas[k]}">${label} — ${fmtMoeda(cg.faixas[k])}</option>`).join('');
  sel.innerHTML = `<option value="">— Escolha uma faixa (ou digite o valor manualmente abaixo) —</option>${opcoes}`;
}
function aplicarFaixaSelecionada(){
  const sel = q('#aj-faixa-promo');
  const valor = sel.value;
  if(!valor) return;
  q('#aj-novosalario-promo').value = Number(valor).toFixed(2);
  atualizarPreviewPromocao();
}
function atualizarPreviewPromocao(){
  const colabId = q('#aj-colab-promo')?.value;
  const boxAtual = q('#aj-promo-atual');
  const boxDif = q('#aj-promo-diferenca');
  if(!boxAtual || !boxDif) return;
  if(!colabId){ boxAtual.innerHTML=''; boxDif.innerHTML=''; return; }

  const c = S.colaboradores.find(x=>x.id===colabId);
  const cgAtual = cargoPorClasse(S, c.cargoClasse);
  boxAtual.innerHTML = `<div class="banner info">Atualmente: <strong>${esc(c.cargoTexto||c.cargo||'—')}</strong>${cgAtual?' · Classe '+cgAtual.classe:''} — salário atual: <strong>${fmtMoeda(c.salarioAtual)}</strong></div>`;

  const novaClasseVal = q('#aj-novocargo-promo').value;
  const inputSalario = q('#aj-novosalario-promo');

  const novoSalario = Number(inputSalario.value)||0;
  if(novoSalario<=0){ boxDif.innerHTML=''; return; }

  const salarioAntes = c.salarioAtual||0;
  const diferenca = Math.round((novoSalario-salarioAntes)*100)/100;
  const pct = salarioAntes>0 ? Math.round((diferenca/salarioAntes)*10000)/100 : null;
  const cgParaFaixa = novaClasseVal? cargoPorClasse(S, novaClasseVal) : cgAtual;
  const fx = situacaoFaixa(cgParaFaixa, novoSalario);
  const corDif = diferenca>=0 ? 'var(--success)' : 'var(--danger)';
  const faixaTxt = fx.status==='dentro'? `dentro da faixa (letra ${fx.letra})` : fx.status==='abaixo'? `<strong style="color:var(--danger)">abaixo</strong> do mínimo da faixa (${fmtMoeda(fx.minimo)})` : fx.status==='acima'? `<strong style="color:var(--warning)">acima</strong> do máximo da faixa (${fmtMoeda(fx.maximo)})` : '';

  boxDif.innerHTML = `<div class="banner ${fx.status==='dentro'?'info':'warn'}">
    Vai para: <strong>${fmtMoeda(novoSalario)}</strong> · Diferença: <strong style="color:${corDif}">${diferenca>=0?'+':''}${fmtMoeda(diferenca)}${pct!=null?` (${diferenca>=0?'+':''}${pct}%)`:''}</strong>

function duplicarCenario(id){
  const c = S.cenarios.find(x=>x.id===id);
  const copia = {...c, id:'sc'+Date.now(), nome:c.nome+' (cópia)', ajustes: (c.ajustes||[]).map(a=>({...a, id:'aj'+Date.now()+Math.random().toString(36).slice(2,5)})), criadoEm:new Date().toISOString()};

  logAudit('criacao','cenario', `Duplicou cenário "${c.nome}"`);
  persist(); render(); toast('Cenário duplicado.');

function excluirCenario(id){

function formatarDataBR(iso){ const [a,m,d]=iso.split('-'); return d+'/'+m+'/'+a; }

function exportarBackupCompleto(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rhu_backup_'+todayISO()+'.json'; a.click();
  URL.revokeObjectURL(url);
  logAudit('backup','sistema','Exportou backup completo dos dados');
  persist(); toast('Backup exportado.');
}
function importarBackupCompleto(file){
  if(!file) return;
  confirmAction('Importar este backup vai SUBSTITUIR todos os dados atuais do sistema. Deseja continuar?', ()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const novo = JSON.parse(e.target.result);
        if(!novo.colaboradores || !Array.isArray(novo.colaboradores)) throw new Error('Arquivo não parece ser um backup válido do RHU.');
        S = novo; migrateState();
        logAudit('backup','sistema','Importou backup e substituiu os dados do sistema');
        persist(true); render(); toast('Backup importado com sucesso.');
      }catch(err){
        toast('Erro ao importar backup: '+err.message, 'danger');
      }
    };
    reader.readAsText(file);
  }, {confirmLabel:'Importar e substituir', title:'Importar backup'});
  q('#backup-file-input').value='';
}

  </div>`;
}
function adicionarTipoAusencia(){

}
function removerTipoAusencia(t){
  S.tiposAusencia = S.tiposAusencia.filter(x=>x!==t); logAudit('remocao','tipo-ausencia',`Removeu tipo ${t}`); persist(); render();

function viewAuditoria(){
  return `
  <div class="section-head"><div><h2>Histórico e auditoria</h2><div class="section-desc">Registro imutável de alterações — ${S.auditoria.length} evento(s)</div></div></div>

    <tbody>${S.auditoria.slice(0,300).map(a=>`<tr><td class="small mono">${new Date(a.data).toLocaleString('pt-BR')}</td><td>${esc(a.usuario)}</td><td>${selo(a.tipo,'neutral')}</td><td>${esc(a.entidade)}</td><td class="small">${esc(a.descricao)}</td></tr>`).join('') || `<tr><td colspan="5"><div class="empty-state">Nenhum evento registrado ainda.</div></td></tr>`}</tbody>
  </table></div></div>`;
}
let IMPORT_PREVIEW = null;

function configImportar(){
  return `
  <div class="card card-pad" style="max-width:720px;">
    <h3 style="font-size:15px;margin-bottom:8px;">Importar dados do Excel</h3>
    <p class="small muted">Envie a planilha de férias utilizada pelo RH (.xlsx ou .csv). O sistema procura colunas como
    <strong>Nome do colaborador</strong>, <strong>Setor</strong>, <strong>Data de admissão</strong>, <strong>Matrícula/Código</strong>
    para reconhecer os registros. Antes de gravar, uma prévia é exibida para confirmação.</p>
    <input type="file" id="import-file" accept=".xlsx,.xls,.csv" style="margin:14px 0;">
    <div id="import-status"></div>
    <div id="import-preview"></div>
  </div>`;
}

function initImportListener(){
  const inp = q('#import-file');
  if(!inp || inp._bound) return;
  inp._bound = true;
  inp.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    q('#import-status').innerHTML = `<div class="small muted">Lendo arquivo…</div>`;
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames.find(n=>/escala|colab|planej/i.test(n)) || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
      processarImportacao(rows, sheetName);
    }catch(err){
      q('#import-status').innerHTML = `<div class="small" style="color:var(--danger);">Erro ao ler o arquivo: ${esc(err.message)}</div>`;
    }
  });
}

function findCol(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const k = keys.find(k=>k.toLowerCase().replace(/[^a-z]/g,'').includes(cand));
    if(k) return k;
  }
  return null;
}

function processarImportacao(rows, sheetName){
  if(!rows.length){ q('#import-status').innerHTML = `<div class="small" style="color:var(--danger);">Nenhuma linha encontrada na aba "${esc(sheetName)}".</div>`; return; }
  const sample = rows[0];
  const colNome = findCol(sample, ['nomedocolaborador','colaborador','nome']);
  const colSetor = findCol(sample, ['setor']);
  const colAdmissao = findCol(sample, ['dataadmissao','admissao']);
  const colMatricula = findCol(sample, ['codigo','matricula']);

  if(!colNome){ q('#import-status').innerHTML = `<div class="small" style="color:var(--danger);">Não foi possível localizar a coluna de nome do colaborador na aba "${esc(sheetName)}".</div>`; return; }

  const novos = [], atualizados = [], erros = [];
  rows.forEach((r,i)=>{
    const nome = String(r[colNome]||'').trim();
    if(!nome) return;
    const setorNomeStr = colSetor? String(r[colSetor]||'').trim() : '';
    const admissaoRaw = colAdmissao? r[colAdmissao] : '';
    let admissaoISO = '';
    if(admissaoRaw instanceof Date) admissaoISO = isoOf(admissaoRaw);
    else if(typeof admissaoRaw==='string' && /\d{4}-\d{2}-\d{2}/.test(admissaoRaw)) admissaoISO = admissaoRaw.slice(0,10);

    if(!admissaoISO){ erros.push({linha:i+2, motivo:'Data de admissão ausente ou não reconhecida', nome}); return; }

    const existente = S.colaboradores.find(c=>c.nome.toLowerCase()===nome.toLowerCase());
    let setorId = null;
    if(setorNomeStr){
      let setor = S.setores.find(s=>s.nome.toLowerCase()===setorNomeStr.toLowerCase());
      if(!setor){ setor = {id:'st_imp_'+Date.now()+i, nome:setorNomeStr, gestorId:null, ativo:true}; S.setores.push(setor); }
      setorId = setor.id;
    }
    const registro = {nome, matricula: colMatricula? String(r[colMatricula]||'') : '', admissao: admissaoISO, setorPrincipal: setorId};
    if(existente) atualizados.push({existente, registro});
    else novos.push(registro);
  });

  IMPORT_PREVIEW = {novos, atualizados, erros, total: rows.length};
  q('#import-status').innerHTML = `<div class="banner info"><strong>${rows.length} registros encontrados</strong> na aba "${esc(sheetName)}".</div>`;
  q('#import-preview').innerHTML = `
    <div class="grid grid-3" style="margin:12px 0;">
      <div class="stat-card card"><div class="label">Novos</div><div class="value" style="font-size:22px;">${novos.length}</div></div>
      <div class="stat-card card"><div class="label">Atualizados</div><div class="value" style="font-size:22px;">${atualizados.length}</div></div>
      <div class="stat-card card"><div class="label">Com erro</div><div class="value" style="font-size:22px;color:var(--danger);">${erros.length}</div></div>
    </div>
    ${erros.length? `<div class="small" style="color:var(--danger);margin-bottom:8px;">${erros.slice(0,5).map(e=>`Linha ${e.linha} (${esc(e.nome)}): ${esc(e.motivo)}`).join('<br>')}</div>`:''}
    <button class="btn btn-primary" onclick="confirmarImportacao()">Confirmar importação</button>
    <button class="btn" onclick="IMPORT_PREVIEW=null;renderContentOnly()">Cancelar</button>`;
}

function confirmarImportacao(){
  if(!IMPORT_PREVIEW) return;
  IMPORT_PREVIEW.novos.forEach(r=>{
    S.colaboradores.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5), nome:r.nome, matricula:r.matricula, cpf:'', nascimento:'', admissao:r.admissao, cargo:'', setorPrincipal:r.setorPrincipal||'', outrosSetores:[], jornadaHorasDia:8, jornadaHorasSemana:40, status:'Ativo', desligamento:'', email:'', telefone:'', gestorId:null, cicloSemente:0});
  });
  IMPORT_PREVIEW.atualizados.forEach(({existente,registro})=>{
    existente.admissao = registro.admissao || existente.admissao;
    if(registro.setorPrincipal) existente.setorPrincipal = registro.setorPrincipal;
    if(registro.matricula) existente.matricula = registro.matricula;
  });
  logAudit('importacao','colaborador', `Importou planilha: ${IMPORT_PREVIEW.novos.length} novos, ${IMPORT_PREVIEW.atualizados.length} atualizados`);
  persist();
  toast(`Importação concluída: ${IMPORT_PREVIEW.novos.length} novos, ${IMPORT_PREVIEW.atualizados.length} atualizados.`);
  IMPORT_PREVIEW = null;
  render();
}

  const c = q('#content');

  if(ROUTE.view==='configuracoes' && CONFIG_TAB==='importar') initImportListener();

  // reconstrói apenas o topo (contador de conflitos) sem re-renderizar tudo

}

  switch(ROUTE.view){

    case 'ferias-programacao': return viewFeriasProgramacao();
    case 'ferias-conflitos': return viewFeriasConflitos();
    case 'ferias-bloqueios': return viewFeriasBloqueios();

    case 'atestados': return viewAtestados();
    case 'cargos': return viewCargos();

    case 'cenarios': return viewCenarios();
    case 'comparador': return viewComparador();
    case 'projecoes': return viewProjecoes();

function render(){
  closeUserMenu();
  if(atualizarStatusFeriasAutomatico(S)){
    logAudit('automatico','ferias', 'Sistema atualizou status de férias conforme a data (Programada → Em gozo)');
    persist();
  }
  if(ROUTE.view==='dashboard' && !isGestao()){
    ROUTE = CUR.colaboradorId? {view:'colaborador-ficha', params:{id:CUR.colaboradorId}} : {view:'ferias-periodos', params:{}};
  }
  renderShell(routeBody());
  if(ROUTE.view==='configuracoes' && CONFIG_TAB==='importar') initImportListener();
}

function telaErroConexao(mensagem, detalhe){

      <div style="font-size:32px;margin-bottom:12px;">⚠</div>

function mostrarTelaLogin(erro){
  const root = q('#root');
  root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);font-family:'Poppins',sans-serif;padding:20px;">
    <div style="background:#fff;border-radius:8px;padding:32px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
      <div style="text-align:center;margin-bottom:20px;">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:8px;">
          <circle cx="19" cy="18" r="14" fill="url(#lg)"/>
          <path d="M5 26a17 17 0 0 0 29 2" stroke="#D3A521" stroke-width="3" stroke-linecap="round" fill="none"/>
          <defs><linearGradient id="lg" x1="6" y1="5" x2="33" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#4FA8D8"/><stop offset="1" stop-color="#1B4F91"/></linearGradient></defs>
        </svg>
        <div style="font-weight:700;color:var(--ink);font-size:16px;">RH Registro Assis</div>
        <div style="font-size:12px;color:var(--ink-40);">Entre com seu e-mail e senha</div>
      </div>
      <form id="f-login" onsubmit="return false;">
        <div class="field" style="margin-bottom:10px;"><label>E-mail</label><input type="email" name="email" required autofocus></div>
        <div class="field" style="margin-bottom:6px;"><label>Senha</label><input type="password" name="senha" required></div>
        ${erro? `<div class="small" style="color:var(--danger);margin-bottom:10px;">${esc(erro)}</div>` : ''}
        <button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="fazerLogin()">Entrar</button>
      </form>
    </div>
  </div>`;
}
async function fazerLogin(){
  const form = q('#f-login');
  const email = form.email.value.trim();
  const senha = form.senha.value;
  if(!email || !senha) return;
  try{
    await window.FB.signIn(email, senha);
    // onAuthChange cuida do resto (carrega os dados e mostra o sistema)
  }catch(e){
    const msgs = {
      'auth/invalid-credential':'E-mail ou senha incorretos.',
      'auth/user-not-found':'E-mail ou senha incorretos.',
      'auth/wrong-password':'E-mail ou senha incorretos.',
      'auth/invalid-email':'E-mail inválido.',
      'auth/too-many-requests':'Muitas tentativas — aguarde um pouco e tente de novo.',
    };
    mostrarTelaLogin(msgs[e.code] || ('Não foi possível entrar: ' + (e.message||e.code||e)));
  }
}
function sair(){ window.FB.signOutUser(); }

async function boot(){
  const root = q('#root');
  root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-size:15px;">Carregando RH Registro Assis…</div>`;
  const fbOk = await window.__fbReady;
  if(!fbOk){
    root.innerHTML = telaErroConexao('Não foi possível carregar o Firebase', window.__fbError ? (window.__fbError.message||String(window.__fbError)) : '');
    return;
  }
  let jaCarregou = false;
  window.FB.onAuthChange(async (fbUser)=>{
    if(!fbUser){ mostrarTelaLogin(); jaCarregou = false; return; }
    if(jaCarregou) return; // evita recarregar tudo de novo se o listener disparar mais de uma vez
    jaCarregou = true;
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-size:15px;">Carregando dados…</div>`;
    await loadState();
    if(ERRO_ARMAZENAMENTO){ root.innerHTML = telaErroConexao('Não foi possível conectar ao banco de dados', ERRO_DETALHE); return; }
    CUR = await resolverUsuarioAtual(fbUser);
    if(atualizarStatusFeriasAutomatico(S)) await persist(true);
    if(BACKUPS_CACHE.length===0){ BACKUPS_CACHE = await listarBackupsAutomaticos(); }
    render();
    iniciarSincronizacaoTempoReal();
    // Reconfere uma vez por hora se algum período fechou/venceu (baseado na data de hoje, não em dados
    // que mudaram — isso não depende de sincronização em tempo real, já que ninguém precisa "salvar" a
    // passagem do tempo).
    setInterval(async ()=>{
      if(!CUR || q('.modal-backdrop')) return; // não interrompe quem está preenchendo um formulário
      if(atualizarStatusFeriasAutomatico(S)) { await persist(true); render(); }
    }, 60*60*1000);
  });
}

// ---- Sincronização em tempo real ----
// Em vez de reconferir de tempos em tempos, ouve direto o banco de dados: assim que qualquer pessoa (em
// qualquer computador) salva algo, todo mundo vê a mudança na hora, sem precisar recarregar a página.
let SYNC_ATIVA = false;
function iniciarSincronizacaoTempoReal(){
  if(SYNC_ATIVA) return; // só uma vez por sessão
  SYNC_ATIVA = true;
  // Cada atualização que chega de outra pessoa é MESCLADA com o que está na tela (nunca substitui por
  // cima): lançamentos feitos aqui e ainda não gravados são preservados.
  const aplicar = (campo, dados)=>{
    if(RHU_DOC_LISTAS.includes(campo)){
      const remota = dados||[];
      if(listaComIds(remota) && listaComIds(S[campo]||[]) && BASE_L[campo]){
        S[campo] = mesclarLista(BASE_L[campo], S[campo]||[], remota, campo);
        BASE_L[campo] = mapaDe(remota);
      } else { S[campo] = remota; BASE_L[campo] = listaComIds(remota)? mapaDe(remota) : null; }
    } else {
      const v = S[campo]===undefined ? null : S[campo];
      const mexidoAqui = BASE_N[campo]!==undefined && BASE_N[campo]!==estavel(v);
      if(!mexidoAqui) S[campo] = dados;
      BASE_N[campo] = estavel(dados);
    }
    if(q('.modal-backdrop')) return; // não fecha o formulário de quem está digitando; a tela atualiza ao fechar
    render();
  };
  window.FB.onSnapshot(window.FB.doc(window.FB.db,'rhu','nucleo'), (snap)=>{
    if(!snap.exists() || snap.metadata.hasPendingWrites) return; // ignora o eco da nossa própria gravação
    const dados = snap.data();
    RHU_DOC_NUCLEO.forEach(k=>{ if(k in dados) aplicar(k, dados[k]); });
  }, (e)=>console.error('Sincronização (nucleo) falhou', e));
  RHU_DOC_LISTAS.forEach(nome=>{
    window.FB.onSnapshot(window.FB.doc(window.FB.db,'rhu',nome), (snap)=>{
      if(!snap.exists() || snap.metadata.hasPendingWrites) return;
      aplicar(nome, snap.data().itens||[]);
    }, (e)=>console.error('Sincronização ('+nome+') falhou', e));
  });
}

document.addEventListener('DOMContentLoaded', boot);
