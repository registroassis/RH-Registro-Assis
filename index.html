<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH Registro Assis · Gestão de Férias, Ausências e Cargos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#152A50; --ink-70:#3d4a68; --ink-40:#8891a5;
  --paper:#F5F5F4; --paper-2:#ECECEA; --paper-3:#DFDFDC;
  --brass:#D3A521; --brass-dark:#A97E12; --brass-light:#F3E4B4;
  --logo-blue:#4FA8D8; --logo-blue-dark:#1B4F91;
  --danger:#B23A2E; --danger-bg:#F6E4E1;
  --warning:#C77E2A; --warning-bg:#F8E9D6;
  --success:#3F6E52; --success-bg:#E2ECE4;
  --info:#3A6EA5; --info-bg:#E1EAF3;
  --line:#DADAD7; --white:#FFFFFF;
  --shadow: 0 2px 10px rgba(21,42,80,0.06), 0 1px 2px rgba(21,42,80,0.05);
  --shadow-lift: 0 10px 28px rgba(21,42,80,0.14), 0 2px 8px rgba(21,42,80,0.08);
  --radius: 5px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Poppins',sans-serif; font-weight:600; color:var(--ink); margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--brass-light);}
a{color:var(--info); transition:opacity .12s;}
a:hover{opacity:0.75;}
button{font-family:inherit;}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--brass); outline-offset:1px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--paper-3);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Layout shell ---------- */
#app{display:flex; min-height:100vh;}
.hidden{display:none !important;}

/* Sidebar */
#sidebar{
  width:240px; flex-shrink:0; background:linear-gradient(180deg,var(--ink) 0%, #192540 100%); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:24px 20px 18px; border-bottom:1px solid rgba(255,255,255,0.1);}
.brand-seal{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center; margin-bottom:10px;
}
.brand h1{color:#fff; font-size:15px; line-height:1.25; letter-spacing:0.2px;}
.brand p{margin:3px 0 0; font-size:11px; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.8px;}
nav.menu{flex:1; padding:16px 10px;}
.menu-group{margin-bottom:4px;}
.menu-title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.35);
  padding:16px 10px 7px;
}
.menu-item{
  display:flex; align-items:center; gap:10px; padding:8.5px 10px; border-radius:4px;
  color:rgba(255,255,255,0.75); cursor:pointer; font-size:13.5px; margin:1px 0;
  border-left:2px solid transparent; transition:background .12s, color .12s;
}
.menu-item:hover{background:rgba(255,255,255,0.07); color:#fff;}
.menu-item.active{background:rgba(176,141,87,0.2); color:#fff; border-left:2px solid var(--brass); font-weight:500;}
.menu-item .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0.5;flex-shrink:0;}
.sidebar-foot{padding:14px 16px; border-top:1px solid rgba(255,255,255,0.1); font-size:11px; color:rgba(255,255,255,0.45); line-height:1.6;}

/* Main */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  display:flex; align-items:center; justify-content:space-between; padding:15px 28px;
  background:var(--white); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  box-shadow:0 1px 0 rgba(27,42,74,0.02);
}
#topbar h2{font-size:19px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.user-chip{display:flex;align-items:center;gap:8px; padding:5px 10px 5px 5px; border:1px solid var(--line); border-radius:20px; font-size:12.5px; background:var(--paper);}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--brass); color:#fff; display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:600;}
#content{padding:28px 30px 64px; flex:1;}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius);
  border:1px solid var(--line); background:var(--white); color:var(--ink); font-size:13px; font-weight:500;
  cursor:pointer; transition:all .14s;
}
.btn:hover{border-color:var(--ink-40); background:var(--paper); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 1px 3px rgba(27,42,74,0.25);}
.btn-primary:hover{background:#28395e; box-shadow:0 4px 10px rgba(27,42,74,0.3);}
.btn-brass{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn-brass:hover{background:var(--brass-dark);}
.btn-danger{background:var(--danger); color:#fff; border-color:var(--danger);}
.btn-danger:hover{background:#8f2e24;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--paper-2); transform:none;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}

/* Cards */
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); transition:box-shadow .15s;}
.card-pad{padding:20px 22px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;} #content{padding:18px 16px 48px;}}

.stat-card{padding:17px 19px; position:relative; overflow:hidden; border-top:2.5px solid var(--paper-3);}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-40); font-weight:600;}
.stat-card .value{font-family:'Poppins',sans-serif; font-size:29px; font-weight:700; margin-top:5px; line-height:1.15;}
.stat-card .sub{font-size:11.5px; color:var(--ink-40); margin-top:3px;}
.stat-card.clickable{cursor:pointer; transition:transform .12s, box-shadow .12s, border-color .12s;}
.stat-card.clickable:hover{transform:translateY(-2px); box-shadow:var(--shadow-lift); border-top-color:var(--brass);}
.stat-card.accent-danger{border-top-color:var(--danger);}
.stat-card.accent-warning{border-top-color:var(--warning);}
.stat-card.accent-success{border-top-color:var(--success);}
.stat-card.accent-brass{border-top-color:var(--brass);}
.stat-card.accent-danger .value{color:var(--danger);}
.stat-card.accent-warning .value{color:var(--warning);}
.stat-card.accent-success .value{color:var(--success);}
.stat-card.accent-brass .value{color:var(--brass-dark);}

/* Selo (status stamp) — signature element */
.selo{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:20px;
  font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;
  border:1.3px dashed currentColor; white-space:nowrap;
}
.selo::before{content:'●'; font-size:7px;}
.selo.c-danger{color:var(--danger); background:var(--danger-bg);}
.selo.c-warning{color:var(--warning); background:var(--warning-bg);}
.selo.c-success{color:var(--success); background:var(--success-bg);}
.selo.c-info{color:var(--info); background:var(--info-bg);}
.selo.c-neutral{color:var(--ink-40); background:var(--paper-2);}
.selo.c-brass{color:var(--brass-dark); background:var(--brass-light);}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-40);
  padding:10px 12px; border-bottom:1.5px solid var(--line); font-weight:600; white-space:nowrap;
  background:var(--paper); position:sticky; top:0;
}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
tbody tr:nth-child(even) td{background:rgba(228,222,206,0.18);}
tr:hover td{background:rgba(176,141,87,0.08) !important;}
.table-wrap{overflow-x:auto; border-radius:var(--radius);}
.name-cell{font-weight:600; white-space:nowrap;}
.muted{color:var(--ink-40);}
.small{font-size:11.5px;}

/* Forms */
label{display:block; font-size:12px; font-weight:600; color:var(--ink-70); margin-bottom:5px;}
input,select,textarea{
  width:100%; padding:8.5px 11px; border:1px solid var(--line); border-radius:var(--radius);
  font-family:inherit; font-size:13px; background:var(--white); color:var(--ink); transition:border-color .12s, box-shadow .12s;
}
input:hover,select:hover,textarea:hover{border-color:var(--ink-40);}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brass); box-shadow:0 0 0 3px var(--brass-light);}
input[readonly]{background:var(--paper-2); color:var(--ink-70); cursor:not-allowed;}
.field{margin-bottom:13px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
@media(max-width:640px){.field-row,.field-row3{grid-template-columns:1fr;}}
fieldset{border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; margin:0 0 16px; background:rgba(247,244,238,0.4);}
legend{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--brass-dark); padding:0 6px;}
.checkbox-row{display:flex; align-items:center; gap:8px;}
.checkbox-row input{width:auto;}
.help{font-size:11px; color:var(--ink-40); margin-top:4px; line-height:1.5;}

/* Modal */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(19,28,48,0.55); backdrop-filter:blur(2px); display:flex; align-items:flex-start;
  justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes slideUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.modal{background:var(--white); border-radius:8px; width:100%; max-width:640px; box-shadow:0 24px 64px rgba(12,20,38,0.35); animation:slideUp .18s ease;}
.modal.modal-wide{max-width:920px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:17px 24px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:22px 24px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:15px 24px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; background:rgba(247,244,238,0.5); border-radius:0 0 8px 8px;}
.modal-close{cursor:pointer; font-size:20px; color:var(--ink-40); line-height:1; background:none;border:none; transition:color .12s;}
.modal-close:hover{color:var(--danger);}

/* Tabs */
.tabs{display:flex; gap:2px; border-bottom:1.5px solid var(--line); margin-bottom:20px; flex-wrap:wrap;}
.tab{padding:9px 15px; font-size:13px; font-weight:500; color:var(--ink-40); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1.5px; transition:color .12s;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--ink); border-color:var(--brass); font-weight:600;}

/* Filters bar */
.filters-bar{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; padding:14px 16px; background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);}
.filters-bar .field{margin-bottom:0; min-width:150px;}
.filters-bar label{color:var(--ink-40); font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;}

/* Alerts / banners */
.banner{padding:12px 16px; border-radius:var(--radius); font-size:12.5px; display:flex; gap:10px; align-items:flex-start; margin-bottom:16px; border:1px solid; line-height:1.55;}
.banner.warn{background:var(--warning-bg); border-color:#e8c896; color:#7a4e14;}
.banner.info{background:var(--info-bg); border-color:#b9cfe6; color:#254a72;}

.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.section-head h2{font-size:21px;}
.section-desc{color:var(--ink-40); font-size:12.5px; margin-top:3px;}

.empty-state{text-align:center; padding:50px 20px; color:var(--ink-40);}
.empty-state .icon{font-size:32px; margin-bottom:8px; opacity:0.5;}

.pill-list{display:flex; gap:5px; flex-wrap:wrap;}
.pill{background:var(--paper-2); border:1px solid var(--line); border-radius:20px; padding:2px 9px; font-size:11px;}

.timeline{border-left:2px solid var(--line); margin-left:8px; padding-left:20px;}
.tl-item{position:relative; padding-bottom:20px;}
.tl-item::before{content:''; position:absolute; left:-25.5px; top:3px; width:9px;height:9px;border-radius:50%; background:var(--brass); border:2px solid var(--white); box-shadow:0 0 0 1.5px var(--brass);}
.tl-date{font-size:11px; color:var(--ink-40); font-weight:600;}
.tl-title{font-weight:600; margin:2px 0;}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--ink) 0%, #223357 60%, var(--ink) 100%); padding:20px;}
.login-card{width:100%; max-width:400px; background:var(--white); border-radius:6px; padding:36px 34px; box-shadow:0 30px 70px rgba(0,0,0,0.35);}
.login-seal{width:52px;height:52px;border-radius:50%;border:2px dashed var(--brass); display:flex;align-items:center;justify-content:center; font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:var(--brass); margin:0 auto 14px;}
.login-users{display:flex; flex-direction:column; gap:6px; margin-top:14px;}
.login-user-btn{display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; text-align:left; background:var(--paper);}
.login-user-btn:hover{border-color:var(--brass);}
.login-user-btn .ua{width:28px;height:28px;border-radius:50%;background:var(--ink); color:#fff; display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

.conflict-row{background:var(--danger-bg) !important;}
.conflict-row td{background:transparent;}

.gantt-wrap{overflow-x:auto;}
.gantt{border-collapse:collapse; font-size:11.5px; min-width:1150px;}
.gantt th{position:sticky; top:0; background:var(--white); z-index:2;}
.gantt td.gname{position:sticky; left:0; background:var(--white); z-index:1; font-weight:600; min-width:190px; border-right:1px solid var(--line);}
.gantt td{padding:4px 2px; text-align:center; border-bottom:1px solid var(--line); min-width:70px;}
.gantt-bar{height:18px; border-radius:3px; font-size:9.5px; display:flex;align-items:center;justify-content:center; color:#fff; font-weight:600; margin:0 auto;}

.badge-count{background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:1px 6px; margin-left:6px;}

@media print{ #sidebar,#topbar,.no-print{display:none !important;} #content{padding:0;} }
</style>
</head>

// Constrói as coleções de ausências e atestados a partir dos dados do cartão ponto, já ligadas aos
// colaboradores pela matrícula. Atestados médicos geram registro na aba Atestados + espelho em Ausências
// (mesmo padrão usado quando um atestado é lançado manualmente pela tela).
// Calcula as horas de jornada dentro de um intervalo de datas, contando só dias úteis (seg-sex, sábado é
// sempre folga): 8h30/dia até 25/06/2026 (08:00-17:30 com 1h de almoço), 8h/dia a partir de 26/06/2026
// (08:00-17:00 com 1h de almoço) — conforme informado para a importação do Cartão Ponto.
function horasUteisNoIntervalo(dataInicioISO, dataFimISO){
  let total = 0;
  let d = parseD(dataInicioISO);
  const fim = parseD(dataFimISO);
  while(d<=fim){
    const dow = d.getDay(); // 0=domingo,6=sábado
    if(dow!==0 && dow!==6){
      total += (isoOf(d) <= '2026-06-25') ? 8.5 : 8;
    }
    d = addDays(d,1);
  }
  return Math.round(total*100)/100;
}

function construirAusenciasDoCartaoPonto(colaboradores){
  const porMatricula = {}; colaboradores.forEach(c=>{ if(c.matricula) porMatricula[c.matricula]=c; });
  const ausencias = []; const atestados = [];
  SEED_AUSENCIAS_CARTAO_PONTO.forEach((row,i)=>{
    const [matricula, tipo, dataInicio, dataFim, dias] = row;
    const c = porMatricula[matricula]; if(!c) return;
    const horas = horasUteisNoIntervalo(dataInicio, dataFim);
    if(tipo==='Atestado médico'){
      const atId = 'atp'+(i+1);
      atestados.push({
        id: atId, colaboradorId:c.id, dataAtestado:dataInicio, dataInicial:dataInicio, dataFinal:dataFim,
        dias, horas, medico:'', crm:'', tipoAtendimento:'', cid:'', cidDescricao:'',
        anexoNome:'', observacao:'Importado do Cartão Ponto (Secullum) — relatório 01/01/2026 a 14/09/2026. Horas calculadas pela jornada (8h30 até 25/06, 8h a partir de 26/06); o atestado cobriu o dia todo em todos os casos deste relatório.',
        statusConferencia:'Conferido', lancadoPor:'Importação Cartão Ponto', lancadoEm:new Date().toISOString()
      });
      ausencias.push({
        id:'aup'+(i+1), origemAtestadoId:atId, colaboradorId:c.id, setorId:c.setorPrincipal||null,
        tipo:'Atestado médico', dataInicio, dataFim, dias, horas, cid:'', motivo:'Atestado médico',
        observacao:'Importado do Cartão Ponto (Secullum).', lancadoPor:'Importação Cartão Ponto', lancadoEm:new Date().toISOString()
      });
    } else {
      ausencias.push({
        id:'aup'+(i+1), colaboradorId:c.id, setorId:c.setorPrincipal||null,
        tipo, dataInicio, dataFim, dias, horas, cid:'', motivo:'',
        observacao:'Importado do Cartão Ponto (Secullum) — relatório 01/01/2026 a 14/09/2026.',
        lancadoPor:'Importação Cartão Ponto', lancadoEm:new Date().toISOString()
      });
    }
  });
  return {ausencias, atestados};
}

// Aplica os dados de salário/cargo (planilha FIN) sobre os colaboradores já cadastrados no RHU, por matrícula.
// Também reconstrói um histórico salarial básico (2024→2025→2026) a partir dos valores da planilha,
// já que a planilha trazia o salário de cada ano mas não uma "data exata" de cada alteração.
function aplicarSalarioNoColaborador(c){
  const dados = SALARIOS_POR_MATRICULA[c.matricula];
  if(!dados) return c;
  const historico = [];
  const passos = [
    {ano:2024, salario:dados.sal2024},
    {ano:2025, salario:dados.sal2025},
    {ano:2026, salario:dados.sal2026},
  ].filter(p=>typeof p.salario==='number');
  for(let i=1;i<passos.length;i++){
    const antes = passos[i-1], depois = passos[i];
    historico.push({
      id:'hs'+c.matricula+'-'+depois.ano,
      data: depois.ano+'-01-01',
      cargoAnterior: dados.cargoTexto, cargoNovo: dados.cargoTexto,
      salarioAnterior: antes.salario, salarioNovo: depois.salario,
      diferenca: Math.round((depois.salario-antes.salario)*100)/100,
      motivo: 'Reajuste anual (importado da planilha de Cargos e Salários)',
      observacao: 'Data aproximada (01/01) — a planilha original não registrava o dia exato da alteração.'
    });
  }
  return {
    ...c,
    cargoClasse: dados.classe ?? null,
    cargoTexto: dados.cargoTexto || c.cargo || '',
    salarioAtual: (typeof dados.sal2026==='number') ? dados.sal2026 : (passos.length? passos[passos.length-1].salario : null),
    faixaAtual: dados.faixa2026 || null,
    tipoContrato: c.tipoContrato || 'CLT',
    historicoSalarial: historico,
    historicoCargo: []
  };
}

// ===================== MOTOR DE CÁLCULO DE FÉRIAS =====================
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function parseD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtD(d){ if(!d) return '—'; return d.toLocaleDateString('pt-BR'); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addYears(d,y){ const nd=new Date(d); nd.setFullYear(nd.getFullYear()+y); return nd; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function monthsBetween(a,b){ let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--; return Math.max(0,m); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }

// limite legal (art. 143 CLT): até 1/3 dos dias de direito do período podem ser vendidos (abono pecuniário)
function limiteAbono(diasDireito){ return Math.floor(diasDireito/3); }

// Monta o "razão" de férias do colaborador: percorre os períodos aquisitivos um a um, do mais antigo
// (ciclo 0) até o atualmente rastreado (cicloSemente), e atribui cada férias/venda já lançada ao
// PRIMEIRO período (mais antigo) cuja janela (aquisitivo + concessivo) ainda não tiver sido preenchida —
// nunca ao período mais novo só porque a data também cabe nele. Isso é necessário porque o prazo de
// concessão de um período sempre se sobrepõe por quase 1 ano ao aquisitivo do período seguinte; sem essa
// prioridade, uma férias tirada nesse intervalo comum acabava "roubando" o período errado.
function ledgerFerias(state, colaborador){
  const admissao = parseD(colaborador.admissao);
  const cicloAtual = Number(colaborador.cicloSemente)||0;
  const hoje = todayISO();
  const todos = state.ferias.filter(f=>f.colaboradorId===colaborador.id && f.status!=='Cancelada' && f.dataSaida)
    .slice().sort((a,b)=>a.dataSaida.localeCompare(b.dataSaida));
  const usados = new Set();
  const porCiclo = [];
  for(let k=0; k<=cicloAtual; k++){
    const inicioAq = addYears(admissao, k);
    const fimAq = addDays(addYears(inicioAq,1), -1);
    const fimConcessivo = addDays(addDays(fimAq,1), 364);
    let gozTotal=0, gozPassado=0, vendidos=0; const registros=[];
    todos.forEach(f=>{
      if(usados.has(f.id)) return;
      const saida = parseD(f.dataSaida);
      if(saida>=inicioAq && saida<=fimConcessivo){
        usados.add(f.id);
        registros.push(f);
        if(f.diasGozados){ gozTotal += Number(f.diasGozados)||0; if(f.dataSaida<=hoje) gozPassado += Number(f.diasGozados)||0; }
        if(f.diasVendidos){ vendidos += Number(f.diasVendidos)||0; }
      }
    });
    porCiclo.push({ciclo:k, inicioAq, fimAq, fimConcessivo, gozTotal, gozPassado, vendidos, registros});
  }
  return porCiclo;
}

// registro de férias mais relevante de um período já resolvido pelo razão acima (equivalente à única
// linha S/T da planilha original: prioriza a saída futura mais próxima; senão, a mais recente já ocorrida)
function registroMaisRelevante(registros){
  if(!registros || registros.length===0) return null;
  const hoje = todayISO();
  const futuros = registros.filter(f=>f.dataSaida>=hoje).sort((a,b)=>a.dataSaida.localeCompare(b.dataSaida));
  if(futuros.length) return futuros[0];
  return registros.slice().sort((a,b)=>b.dataSaida.localeCompare(a.dataSaida))[0];
}

function calcularFerias(state, colaborador, refDateISO){
  const hoje = parseD(refDateISO || todayISO());
  const admissao = parseD(colaborador.admissao);
  if(!admissao) return null;
  const cicloSemente = Number(colaborador.cicloSemente)||0;

  const inicioAq = addYears(admissao, cicloSemente);
  const fimAq = addDays(addYears(inicioAq,1), -1);
  const periodoFechado = hoje > fimAq;
  const mesesNoPeriodo = periodoFechado ? 12 : monthsBetween(inicioAq, hoje);
  const diasDireito = periodoFechado ? 30 : Math.min(30, mesesNoPeriodo*2.5);

  const razao = ledgerFerias(state, colaborador);
  const entradaCiclo = razao[razao.length-1]; // sempre o último = o ciclo pedido (cicloSemente)
  const gozadosTotal = entradaCiclo.gozTotal;
  const gozadosPassado = entradaCiclo.gozPassado;
  const vendidos = entradaCiclo.vendidos;
  const diasRestantes = Math.max(0, diasDireito - gozadosTotal - vendidos);
  const limiteAbonoPeriodo = limiteAbono(diasDireito);

  const inicioConcessivo = addDays(fimAq,1);
  const fimConcessivo = addDays(inicioConcessivo, 364);
  // Fórmula idêntica à planilha (aba Escala 2027, coluna L): fim do concessivo menos os dias que
  // ainda faltavam usar ANTES da saída atualmente registrada (não recua quando você programa uma saída
  // futura, e a venda de dias não empurra essa data — só dias efetivamente gozados no passado contam).
  const consumidoParaLimite = gozadosPassado;
  const limiteGozo = addDays(fimConcessivo, -(Math.max(1, 30-consumidoParaLimite)-1));

  const reg = registroMaisRelevante(entradaCiclo.registros);
  let situacao;
  if(reg){
    const fimReg = addDays(parseD(reg.dataSaida), Number(reg.diasGozados||0)-1);
    if(hoje < parseD(reg.dataSaida)) situacao = 'AGENDADO';
    else if(hoje <= fimReg) situacao = 'EM GOZO';
    else situacao = diasRestantes>0 ? 'PARCIALMENTE GOZADO' : 'GOZADO';
  } else if(hoje>fimConcessivo){
    situacao = 'VENCIDO';
  } else {
    const mesesAteLimite = monthsBetween(hoje, limiteGozo);
    if(mesesAteLimite<3) situacao='CRÍTICO';
    else if(mesesAteLimite<6) situacao='ATENÇÃO';
    else situacao='PENDENTE';
  }

  const feriasVencidas = (periodoFechado && situacao!=='EM GOZO' && situacao!=='PARCIALMENTE GOZADO' && situacao!=='GOZADO') ? 1 : 0;
  let feriasProporcionais = periodoFechado ? '12/12' : (Math.round(mesesNoPeriodo)+'/12');
  if(feriasVencidas===1){
    // O período atual já venceu (fechou e o dia do gozo ainda não chegou). O "proporcional" mostrado
    // passa a acompanhar o SEGUNDO período, que já está rolando em paralelo — para nunca deixar vencerem
    // dois de uma vez. Já a "Limite p/ gozo" continua sendo a do período vencido mesmo (é a data que
    // realmente importa cumprir) — igual ao relatório oficial da folha, que também não pula essa coluna
    // para o segundo período, só o proporcional.
    const periodo2 = calcularFerias(state, {...colaborador, cicloSemente: cicloSemente+1}, refDateISO);
    if(periodo2){ feriasProporcionais = periodo2.feriasProporcionais; }
  }

  return {
    inicioAq, fimAq, periodoFechado, diasDireito: Math.round(diasDireito*10)/10,
    diasGozados: gozadosTotal, diasVendidos: vendidos, limiteAbono: limiteAbonoPeriodo,
    diasRestantes: Math.round(diasRestantes*10)/10,
    inicioConcessivo, fimConcessivo, limiteGozo, situacao, feriasVencidas, feriasProporcionais,
    registroFuturo: (reg && parseD(reg.dataSaida)>hoje) ? reg : null,
    registroAtual: (reg && hoje>=parseD(reg.dataSaida) && hoje<=addDays(parseD(reg.dataSaida),Number(reg.diasGozados||0)-1)) ? reg : null,
    registroPeriodo: reg
  };
}

function situacaoTone(sit){
  switch(sit){
    case 'VENCIDO': return 'danger';
    case 'CRÍTICO': return 'danger';
    case 'ATENÇÃO': return 'warning';
    case 'PENDENTE': return 'neutral';
    case 'AGENDADO': return 'info';
    case 'EM GOZO': return 'brass';
    case 'PARCIALMENTE GOZADO': return 'warning';
    case 'GOZADO': return 'success';
    default: return 'neutral';
  }
}

// ===================== MOTOR DE CONFLITOS =====================
// Expande cada colaborador em todos os setores em que atua (principal + outros)
function setoresDoColaborador(c){
  const s = new Set([c.setorPrincipal, ...(c.outrosSetores||[])].filter(Boolean));
  return [...s];
}

function rangeDoRegistro(f){
  if(f.dataSaida && f.diasGozados){
    const ini = parseD(f.dataSaida);
    const fim = addDays(ini, Number(f.diasGozados)-1);
    return {ini, fim, exact:true};
  }
  return {ini:null, fim:null, exact:false};
}

function mesesDoRegistro(f){
  if(!f.mesProgramado) return [];
  return f.mesProgramado.split('/').map(s=>s.trim()).filter(Boolean);
}

function overlapExact(a,b){ return a.ini<=b.fim && b.ini<=a.fim; }

// Retorna lista de conflitos: {setorId, setorNome, a:{ferias,colaborador}, b:{ferias,colaborador}, tipo:'exato'|'mes'}
function detectarConflitos(state){
  const conflitos = [];
  // Só considera programações ainda "em aberto" — períodos já concluídos (passado) não geram mais alerta de conflito,
  // mesmo que tenham se sobreposto na época: já aconteceram sem problema, não é algo a resolver agora.
  const ativos = state.ferias.filter(f=> f.status!=='Cancelada' && f.status!=='Concluída' && (f.dataSaida || f.mesProgramado));
  for(let i=0;i<ativos.length;i++){
    for(let j=i+1;j<ativos.length;j++){
      const fa = ativos[i], fb = ativos[j];
      if(fa.colaboradorId===fb.colaboradorId) continue;
      const ca = state.colaboradores.find(c=>c.id===fa.colaboradorId);
      const cb = state.colaboradores.find(c=>c.id===fb.colaboradorId);
      if(!ca||!cb) continue;
      const setoresComuns = setoresDoColaborador(ca).filter(s=>setoresDoColaborador(cb).includes(s));
      if(setoresComuns.length===0) continue;
      if(fa.forcado || fb.forcado) continue; // programação forçada não entra na lista de bloqueio, mas fica sinalizada à parte

      const ra = rangeDoRegistro(fa), rb = rangeDoRegistro(fb);
      let conflita=false, tipo='';
      if(ra.exact && rb.exact){
        conflita = overlapExact(ra, rb); tipo='exato';
      } else {
        const ma = mesesDoRegistro(fa), mb = mesesDoRegistro(fb);
        conflita = ma.some(m=>mb.includes(m)) && ma.length>0 && mb.length>0;
        tipo='mes';
      }
      if(conflita){
        setoresComuns.forEach(setorId=>{
          const setor = state.setores.find(s=>s.id===setorId);
          conflitos.push({setorId, setorNome:setor?setor.nome:'—', fa, fb, ca, cb, tipo});
        });
      }
    }
  }
  return conflitos;
}

function conflitosDoRegistro(state, feriasId){
  return detectarConflitos(state).filter(c=>c.fa.id===feriasId || c.fb.id===feriasId);
}

// Atualiza sozinho o status de cada programação de férias conforme a data de hoje avança:
// Programada -> Em gozo (quando a data de saída chega) -> Concluída (quando o período já terminou).
// Sempre recalcula a partir das datas reais gravadas x a data de hoje — nunca fica "preso" num status antigo.
function atualizarStatusFeriasAutomatico(state){
  const hoje = todayISO();
  let mudou = false;
  state.ferias.forEach(f=>{
    if(!['Programada','Em gozo','Concluída'].includes(f.status)) return; // só gerencia automaticamente estes três
    if(!f.dataSaida) return;
    const fimISO = f.diasGozados ? isoOf(addDays(parseD(f.dataSaida), Number(f.diasGozados)-1)) : f.dataSaida;
    let novoStatus;
    if(hoje < f.dataSaida) novoStatus = 'Programada';
    else if(hoje <= fimISO) novoStatus = 'Em gozo';
    else novoStatus = 'Concluída';
    if(novoStatus !== f.status){ f.status = novoStatus; mudou = true; }
  });

  // Avança o período aquisitivo (o "ciclo") sozinho quando ele já foi totalmente gozado/vendido — sem saldo
  // restante — e não há nenhuma parcela ainda pendente (Programada/Em gozo) dentro dele. Cada registro de
  // férias só pode "justificar" um avanço de ciclo uma única vez (marcado com _cicloConsumido) — sem isso,
  // como o período de concessão de um ciclo se sobrepõe ao aquisitivo do ciclo seguinte, o mesmo registro
  // acabava avançando o ciclo de novo a cada vez que o sistema era aberto. "Férias vencidas" não depende
  // disso — é calculado direto em calcularFerias() a partir do período atual e do que já foi de fato
  // programado (mesmo com o saldo ainda em aberto, um período fechado continua vencido até chegar o dia
  // do gozo — não avançamos o ciclo nem zeramos só por existir uma programação futura).
  state.colaboradores.filter(c=>c.status==='Ativo').forEach(c=>{
    const calc = calcularFerias(state, c, hoje);
    if(!calc) return;
    const regsPeriodo = state.ferias.filter(f=>f.colaboradorId===c.id && f.status!=='Cancelada' && !f._cicloConsumido && f.dataSaida && parseD(f.dataSaida)>=calc.inicioAq && parseD(f.dataSaida)<=addDays(calc.fimAq,400));
    const temPendente = regsPeriodo.some(f=>f.status==='Programada' || f.status==='Em gozo');
    if(regsPeriodo.length>0 && !temPendente && calc.diasRestantes<=0.01){
      c.cicloSemente = (Number(c.cicloSemente)||0) + 1;
      regsPeriodo.forEach(f=>{ f._cicloConsumido = true; });
      logAudit('edicao','colaborador', `Período aquisitivo de ${c.nome} avançou automaticamente — ciclo anterior totalmente gozado, sem parcelas pendentes.`);
      mudou = true;
    }
  });
  return mudou;
}

function bloqueioAtivoPara(state, setorId, dataISO){
  if(!dataISO) return null;
  const d = parseD(dataISO);
  return state.bloqueios.find(b=>b.setorId===setorId && d>=parseD(b.dataInicio) && d<=parseD(b.dataFim)) || null;
}

function registroPrincipalFerias(state, colaboradorId){
  const regs = state.ferias.filter(f=>f.colaboradorId===colaboradorId && f.status!=='Cancelada');
  if(regs.length===0) return null;
  const hoje = todayISO();
  const futuros = regs.filter(f=>f.dataSaida && f.dataSaida>=hoje).sort((a,b)=>a.dataSaida.localeCompare(b.dataSaida));
  if(futuros.length) return futuros[0];
  const comData = regs.filter(f=>f.dataSaida).sort((a,b)=>b.dataSaida.localeCompare(a.dataSaida));
  if(comData.length) return comData[0];
  return regs[0];
}

// ===================== ABSENTEÍSMO =====================
function diasUteisEntre(iniISO,fimISO){
  let ini=parseD(iniISO), fim=parseD(fimISO), n=0;
  for(let d=new Date(ini); d<=fim; d=addDays(d,1)){ const wd=d.getDay(); if(wd!==0 && wd!==6) n++; }
  return n;
}

function calcularAbsenteismo(state, {ano, mes, setorId, colaboradorId}={}){
  let ini, fim;
  if(mes!=null){ ini = new Date(ano, mes, 1); fim = new Date(ano, mes+1, 0); }
  else { ini = new Date(ano,0,1); fim = new Date(ano,11,31); }
  const iniISO = isoOf(ini), fimISO = isoOf(fim);

  let ausencias = state.ausencias.filter(a=> a.dataInicio <= fimISO && a.dataFim >= iniISO && a.tipo!=='Licença maternidade/paternidade');
  let colabs = state.colaboradores.filter(c=>c.status==='Ativo');
  if(setorId) { ausencias = ausencias.filter(a=>a.setorId===setorId); colabs = colabs.filter(c=>setoresDoColaborador(c).includes(setorId)); }
  if(colaboradorId) { ausencias = ausencias.filter(a=>a.colaboradorId===colaboradorId); colabs = colabs.filter(c=>c.id===colaboradorId); }

  const diasAusentes = ausencias.reduce((s,a)=>s+(Number(a.dias)||0),0);
  const horasAusentes = ausencias.reduce((s,a)=>s+(Number(a.horas)||0),0);
  const diasUteis = diasUteisEntre(iniISO,fimISO);
  const base = colabs.length * diasUteis;
  const indice = base>0 ? (diasAusentes/base)*100 : 0;
  return {diasAusentes, horasAusentes, diasUteis, colaboradoresBase:colabs.length, indice: Math.round(indice*100)/100, ausencias};
}
// ===================== MOTOR DE CARGOS, SALÁRIOS E FOLHA =====================

function cargoPorClasse(state, classe){ return state.cargos.find(c=>c.classe===Number(classe)) || null; }

// Verifica onde um salário cai dentro da faixa do cargo: abaixo/dentro/acima + a letra da faixa mais próxima
function situacaoFaixa(cargo, salario){
  if(!cargo || salario==null) return {status:'sem-cargo', letra:null};
  const ordem = ['inicial','A','B','C','D','E','F','G'];
  const valores = ordem.map(k=>({letra:k, valor:cargo.faixas[k]})).filter(v=>typeof v.valor==='number');
  if(valores.length===0) return {status:'sem-faixa', letra:null};
  const minimo = valores[0].valor, maximo = valores[valores.length-1].valor;
  if(salario < minimo) return {status:'abaixo', letra:valores[0].letra, minimo, maximo};
  if(salario > maximo) return {status:'acima', letra:valores[valores.length-1].letra, minimo, maximo};
  let letra = valores[0].letra;
  for(const v of valores){ if(salario >= v.valor) letra = v.letra; }
  return {status:'dentro', letra, minimo, maximo};
}

function colaboradorAtivoParaFolha(c){ return c.status==='Ativo' && typeof c.salarioAtual==='number'; }

function beneficioPorId(state, id){ return state.beneficios.find(b=>b.id===id) || null; }

// Benefícios agora são um valor mensal total do cartório (não por colaborador). overridesGlobais permite que
// um cenário simule um novo valor total para um benefício, sem alterar o valor real cadastrado.
function totalBeneficiosMensal(state, overridesGlobais){
  return state.beneficios.reduce((s,b)=>{
    const valor = (overridesGlobais && typeof overridesGlobais[b.id]==='number') ? overridesGlobais[b.id] : (b.valorMensal||0);
    return s+valor;
  }, 0);
}

// Folha REAL atual (dados reais, nunca alterados por simulação)
function calcularFolhaAtual(state, filtros){
  filtros = filtros || {};
  let colabs = state.colaboradores.filter(colaboradorAtivoParaFolha);
  if(filtros.setorId) colabs = colabs.filter(c=>setoresDoColaborador(c).includes(filtros.setorId));
  if(filtros.cargoClasse!=null && filtros.cargoClasse!=='') colabs = colabs.filter(c=>c.cargoClasse===Number(filtros.cargoClasse));
  const totalSalarios = colabs.reduce((s,c)=>s+c.salarioAtual,0);
  const totalBeneficios = totalBeneficiosMensal(state);
  const pctEncargos = state.config.percentualEncargos ?? PERCENTUAL_ENCARGOS_PADRAO;
  const encargos = totalSalarios * pctEncargos; // encargos (INSS/FGTS) incidem sobre salário, não sobre benefícios
  return {
    colaboradores: colabs.length,
    totalSalarios: Math.round(totalSalarios*100)/100,
    encargos: Math.round(encargos*100)/100,
    totalBeneficios: Math.round(totalBeneficios*100)/100,
    custoMensal: Math.round((totalSalarios+encargos+totalBeneficios)*100)/100,
    custoAnual: Math.round((totalSalarios+encargos+totalBeneficios)*12*100)/100,
  };
}

// Aplica os ajustes de um cenário sobre uma cópia dos colaboradores reais (nunca grava no estado real)
// Ajuste: {id, tipo: 'reajustePercentual'|'reajusteFixo'|'novoCargoSalario'|'contratacao'|'desligamento'|'reajusteBeneficio',
//          alvoTipo:'colaborador'|'cargo'|'todos', alvoId, percentual, valorFixo, novoCargoClasse, novoSalario,
//          nomeContratacao, salarioContratacao, cargoClasseContratacao, dataInicio, beneficioId, novoValorBeneficio}
function aplicarCenario(state, cenario){
  let colabs = state.colaboradores.filter(colaboradorAtivoParaFolha).map(c=>({...c, _origem:c.id}));
  const detalhes = []; // {colaboradorId, nome, salarioAntes, salarioDepois, cargoAntes, cargoDepois, alertaFaixa}
  const overridesBeneficios = {}; // beneficioId -> novoValor (aplicado a todos que têm o benefício ativo)

  (cenario.ajustes||[]).forEach(aj=>{
    if(aj.tipo==='reajusteBeneficio'){
      if(aj.beneficioId && aj.novoValorBeneficio!=null && aj.novoValorBeneficio!=='') overridesBeneficios[aj.beneficioId] = Number(aj.novoValorBeneficio);
      return;
    }
    if(aj.tipo==='contratacao'){
      const cargo = cargoPorClasse(state, aj.cargoClasseContratacao);
      const novo = {
        id:'sim-'+(aj.id||Date.now()), _origem:null, nome: aj.nomeContratacao || 'Nova contratação',
        status:'Ativo', cargoClasse: aj.cargoClasseContratacao? Number(aj.cargoClasseContratacao):null,
        cargoTexto: cargo? cargo.nome : (aj.cargoTexto||''),
        salarioAtual: Number(aj.salarioContratacao)||0, setorPrincipal:'', outrosSetores:[]
      };
      colabs.push(novo);
      const fx = situacaoFaixa(cargo, novo.salarioAtual);
      detalhes.push({colaboradorId:novo.id, nome:novo.nome, salarioAntes:0, salarioDepois:novo.salarioAtual, cargoAntes:'—', cargoDepois:novo.cargoTexto, alertaFaixa:fx.status});
      return;
    }
    if(aj.tipo==='desligamento'){
      const idx = colabs.findIndex(c=>c._origem===aj.alvoId);
      if(idx>=0){
        detalhes.push({colaboradorId:colabs[idx].id, nome:colabs[idx].nome, salarioAntes:colabs[idx].salarioAtual, salarioDepois:0, cargoAntes:colabs[idx].cargoTexto, cargoDepois:'Desligado', alertaFaixa:null});
        colabs.splice(idx,1);
      }
      return;
    }
    // reajustePercentual / reajusteFixo / novoCargoSalario — podem mirar 'todos', um cargo, ou um colaborador
    colabs.forEach(c=>{
      if(c._origem==null) return; // não reaplica sobre quem acabou de ser "contratado" no mesmo cenário
      const alvoOk = aj.alvoTipo==='todos' ? true :
                     aj.alvoTipo==='cargo' ? c.cargoClasse===Number(aj.alvoId) :
                     aj.alvoTipo==='colaborador' ? c._origem===aj.alvoId : false;
      if(!alvoOk) return;
      const salarioAntes = c.salarioAtual;
      const cargoAntes = c.cargoTexto;
      let novoSalario = salarioAntes;
      let novoCargoTexto = cargoAntes;
      let novoCargoClasse = c.cargoClasse;
      if(aj.tipo==='reajustePercentual'){ novoSalario = salarioAntes * (1 + Number(aj.percentual)/100); }
      else if(aj.tipo==='reajusteFixo'){ novoSalario = salarioAntes + Number(aj.valorFixo); }
      else if(aj.tipo==='novoCargoSalario'){
        novoCargoClasse = aj.novoCargoClasse!=null && aj.novoCargoClasse!=='' ? Number(aj.novoCargoClasse) : c.cargoClasse;
        const cargoObj = cargoPorClasse(state, novoCargoClasse);
        novoCargoTexto = cargoObj? cargoObj.nome : c.cargoTexto;
        novoSalario = aj.novoSalario!=null && aj.novoSalario!=='' ? Number(aj.novoSalario) : salarioAntes;
      }
      novoSalario = Math.round(novoSalario*100)/100;
      c.salarioAtual = novoSalario; c.cargoClasse = novoCargoClasse; c.cargoTexto = novoCargoTexto;
      if(novoSalario!==salarioAntes || novoCargoTexto!==cargoAntes){
        const cargoObjFinal = cargoPorClasse(state, novoCargoClasse);
        const fx = situacaoFaixa(cargoObjFinal, novoSalario);
        const existente = detalhes.find(d=>d.colaboradorId===c.id);
        if(existente){ existente.salarioDepois = novoSalario; existente.cargoDepois = novoCargoTexto; existente.alertaFaixa = fx.status; }
        else detalhes.push({colaboradorId:c.id, nome:c.nome, salarioAntes, salarioDepois:novoSalario, cargoAntes, cargoDepois:novoCargoTexto, alertaFaixa:fx.status});
      }
    });
  });

  const totalSalarios = colabs.reduce((s,c)=>s+(c.salarioAtual||0),0);
  const totalBeneficios = totalBeneficiosMensal(state, overridesBeneficios);
  const pctEncargos = state.config.percentualEncargos ?? PERCENTUAL_ENCARGOS_PADRAO;
  const encargos = totalSalarios*pctEncargos;
  return {
    colaboradores: colabs.length,
    totalSalarios: Math.round(totalSalarios*100)/100,
    encargos: Math.round(encargos*100)/100,
    totalBeneficios: Math.round(totalBeneficios*100)/100,
    custoMensal: Math.round((totalSalarios+encargos+totalBeneficios)*100)/100,
    custoAnual: Math.round((totalSalarios+encargos+totalBeneficios)*12*100)/100,
    detalhes, colabsResultantes: colabs, overridesBeneficios
  };
}

function compararFolhas(atual, simulada){
  const diffMensal = Math.round((simulada.custoMensal-atual.custoMensal)*100)/100;
  const diffAnual = Math.round((simulada.custoAnual-atual.custoAnual)*100)/100;
  const pct = atual.custoMensal>0 ? Math.round((diffMensal/atual.custoMensal)*10000)/100 : 0;
  return {diffMensal, diffAnual, pct};
}

// Projeção simples multi-ano: aplica um percentual de reajuste anual composto sobre a folha atual (ou a de um cenário-base)
function projetarAnos(state, {anoInicial, anos, percentualAnual, cenarioBase}){
  const base = cenarioBase ? aplicarCenario(state, cenarioBase) : calcularFolhaAtual(state);
  const linhas = [];
  let custoMensal = base.custoMensal;
  let colaboradores = base.colaboradores;
  for(let i=0;i<anos;i++){
    const ano = anoInicial+i;
    if(i>0) custoMensal = custoMensal*(1+percentualAnual/100);
    linhas.push({ano, colaboradores, folhaMensal: Math.round(custoMensal/(1+ (state.config.percentualEncargos??PERCENTUAL_ENCARGOS_PADRAO)) *100)/100, custoMensal: Math.round(custoMensal*100)/100, custoAnual: Math.round(custoMensal*12*100)/100});
  }
  return linhas;
}

// ===================== BACKUP REAL DO USUÁRIO (enviado em 16/09/2026) — vira a nova base de dados padrão =====================

// ===================== ESTADO / PERSISTÊNCIA =====================
let S = null;          // estado global (base de dados)
let CUR = null;         // usuário logado
let ROUTE = {view:'dashboard', params:{}};
let SAVE_TIMER = null;
const STORAGE_KEY = 'rhu_db_v1'; // não usado mais (era do modo local antigo) — mantido só por compatibilidade

// ===================== ARMAZENAMENTO (Firebase Firestore) =====================
// O sistema agora é hospedado fora do Claude (GitHub Pages), então usa o Firebase como banco de dados —
// veja o <script type="module"> no topo da página, que expõe window.FB com tudo que precisamos aqui.
// O estado continua dividido em vários documentos menores (em vez de um blob único) para nunca esbarrar
// no limite de tamanho de um documento e para permitir que o histórico cresça por anos.
const RHU_DOC_NUCLEO = ['versao','setores','cargos','beneficios','tiposAusencia','config','usuarios','bloqueios','cenarios','ufespHistorico','folhaHistorica','sessao','_cartaoPontoImportado','_cartaoPontoHorasCorrigidas','_licencaCristianeCorrigida','ultimoBackupEm','_setorExtratoMigrado'];
const RHU_DOC_LISTAS = ['colaboradores','ferias','ausencias','atestados','auditoria'];

let BACKUPS_CACHE = [];
let ERRO_ARMAZENAMENTO = false;  // true = não foi possível confirmar a conexão com o banco de dados —
                                  // nesse caso o app NUNCA salva nem reseta nada, só mostra um aviso.
let ERRO_DETALHE = '';           // mensagem técnica exata do que falhou, mostrada na tela de erro.

// Lê um documento com pequenas tentativas extras (uma falha de rede pontual não deve derrubar tudo).
async function fbGetComRetentativa(...caminho){
  let ultimoErro;
  for(let i=0;i<3;i++){
    try{ return await window.FB.getDoc(window.FB.doc(window.FB.db, ...caminho)); }
    catch(e){ ultimoErro = e; await new Promise(r=>setTimeout(r, 400*(i+1))); }
  }
  throw ultimoErro;
}

async function dbLerTudo(){
  const nucleoSnap = await fbGetComRetentativa('rhu','nucleo');
  if(!nucleoSnap.exists()) return null;
  const out = {...nucleoSnap.data()};
  for(const nome of RHU_DOC_LISTAS){
    const snap = await fbGetComRetentativa('rhu', nome);
    out[nome] = snap.exists() ? (snap.data().itens||[]) : [];
  }
  return out;
}

// ---- Gravação com mesclagem (nunca apaga o que outra pessoa lançou) ----
// Antes, cada salvamento regravava a lista INTEIRA com o que estava na tela de quem salvou; se a tela
// estivesse desatualizada (outra pessoa/aba tinha lançado algo nesse meio tempo), o lançamento da outra
// pessoa era apagado. Agora cada salvamento envia só o que ESTA pessoa mudou (novos, editados e excluídos,
// comparados com a última versão sincronizada) e o aplica sobre a versão mais recente do banco.
let BASE_L = {};   // lista -> Map(id -> texto estável do item) da última versão sincronizada
let BASE_N = {};   // chave do núcleo -> texto estável da última versão sincronizada
let SALVANDO = Promise.resolve();
function estavel(v){
  if(v===undefined) return 'u';
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(estavel).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+estavel(v[k])).join(',')+'}';
}
const listaComIds = (arr)=> (arr||[]).every(x=>x && x.id!==undefined && x.id!==null);
const mapaDe = (arr)=> new Map((arr||[]).map(x=>[x.id, estavel(x)]));
function baseDeRemoto(dados){
  BASE_L = {}; BASE_N = {};
  RHU_DOC_LISTAS.forEach(n=>{ BASE_L[n] = mapaDe((dados && dados[n])||[]); });
  RHU_DOC_NUCLEO.forEach(k=>{ BASE_N[k] = estavel(dados && dados[k]===undefined ? null : (dados? dados[k] : null)); });
}
// Aplica as mudanças locais (comparadas com 'baseMap') sobre a lista 'remota'.
function mesclarLista(baseMap, local, remota, nome){
  const loc = new Map(local.map(x=>[x.id,x]));
  const removidos = new Set([...baseMap.keys()].filter(id=>!loc.has(id)));
  const editados = new Map(local.filter(x=>baseMap.has(x.id) && estavel(x)!==baseMap.get(x.id)).map(x=>[x.id,x]));
  const novos = local.filter(x=>!baseMap.has(x.id));
  let saida = remota.filter(x=>!removidos.has(x.id)).map(x=>editados.has(x.id)?editados.get(x.id):x);
  const jaTem = new Set(saida.map(x=>x.id));
  const novosReais = novos.filter(x=>!jaTem.has(x.id));
  return nome==='auditoria' ? [...novosReais, ...saida] : [...saida, ...novosReais];
}
function dbSalvarTudo(){
  SALVANDO = SALVANDO.catch(()=>{}).then(salvarMesclando);
  return SALVANDO;
}
async function salvarMesclando(){
  const FB = window.FB, ref = (n)=>FB.doc(FB.db,'rhu',n);
  // 1) núcleo (configurações): só as chaves que esta pessoa mudou
  const mud = {};
  RHU_DOC_NUCLEO.forEach(k=>{ const v = S[k]===undefined ? null : S[k]; if(BASE_N[k]!==estavel(v)) mud[k]=v; });
  if(Object.keys(mud).length){
    try{ await FB.updateDoc(ref('nucleo'), mud); }
    catch(e){
      if(e && e.code==='not-found'){ const tudo={}; RHU_DOC_NUCLEO.forEach(k=>{ tudo[k]=S[k]===undefined?null:S[k]; }); await FB.setDoc(ref('nucleo'), tudo); }
      else throw e;
    }
    Object.keys(mud).forEach(k=>{ BASE_N[k]=estavel(mud[k]); });
  }
  // 2) listas: envia só novos/editados/excluídos e mescla com a versão mais recente do banco
  for(const nome of RHU_DOC_LISTAS){
    const local = S[nome]||[];
    const baseMap = BASE_L[nome];
    if(!listaComIds(local)){ await FB.setDoc(ref(nome), {itens: local}); BASE_L[nome]=null; continue; } // sem ids: comportamento antigo
    if(baseMap){
      const mudou = local.length!==baseMap.size || local.some(x=>baseMap.get(x.id)!==estavel(x));
      if(!mudou) continue;
    }
    const instantaneo = local.slice();           // o que esta pessoa tinha ao começar a salvar
    const baseUsada = baseMap || new Map();
    const gravado = await FB.runTransaction(FB.db, async (tx)=>{
      const snap = await tx.get(ref(nome));
      const remota = snap.exists() ? (snap.data().itens||[]) : [];
      if(!listaComIds(remota)){ tx.set(ref(nome), {itens: instantaneo}); return instantaneo; }
      const mesclada = mesclarLista(baseUsada, instantaneo, remota, nome);
      tx.set(ref(nome), {itens: mesclada});
      return mesclada;
    });
    // traz para a tela o que outras pessoas lançaram, preservando o que foi digitado durante o salvamento
    S[nome] = mesclarLista(mapaDe(instantaneo), S[nome]||[], gravado, nome);
    BASE_L[nome] = mapaDe(gravado);
  }
}

// Garante, para o usuário autenticado no Firebase, um registro correspondente em S.usuarios (para nome/
// permissões dentro do app). Cria um na primeira vez que essa pessoa entra.
async function resolverUsuarioAtual(fbUser){
  let u = S.usuarios.find(x=>x.email===fbUser.email);
  if(!u){
    u = {id:'u'+Date.now(), nome: (fbUser.email||'').split('@')[0], email: fbUser.email||'', senha:'', perfil:'gestor', colaboradorId:null, verCID:true};
    S.usuarios.push(u);
    await persist(true);
  }
  return u;
}

async function loadState(){
  try{
    const carregado = await dbLerTudo();
    if(carregado){ baseDeRemoto(carregado); S = JSON.parse(JSON.stringify(carregado)); migrateState(); await persist(true); await verificarBackupDiario(); return; }
    // Só chega aqui se o banco respondeu normalmente e confirmou que ainda não existe nada salvo —
    // ou seja, é mesmo a primeira vez que o sistema é usado.
    baseDeRemoto(null);
    S = JSON.parse(JSON.stringify(BACKUP_INICIAL));
    migrateState();
    await persist(true);
    await verificarBackupDiario();
  }catch(e){
    // O banco existe e está conectado, mas a leitura falhou por algum motivo pontual (ex.: as regras de
    // segurança do Firestore ainda não foram configuradas). Isso NÃO significa "não existe nada" — nunca
    // sobrescreve nesse caso, só trava a tela com um aviso claro.
    console.error('Falha ao carregar dados', e);
    ERRO_DETALHE = 'Falha ao ler os dados: ' + (e && e.message || e);
    ERRO_ARMAZENAMENTO = true;
    S = JSON.parse(JSON.stringify(BACKUP_INICIAL));
    migrateState();
  }
}

// ---- Backup automático diário ----
// Uma vez por dia (na primeira pessoa que abrir o sistema naquele dia), grava uma cópia completa e
// independente do estado atual num documento separado (rhu_backups/AAAA-MM-DD), e mantém apenas os
// últimos 30 dias para não acumular documentos indefinidamente.
async function verificarBackupDiario(){
  const hoje = new Date().toISOString().slice(0,10);
  if(S.ultimoBackupEm===hoje) return;
  try{
    await gravarBackupAutomatico(hoje);
    S.ultimoBackupEm = hoje;
    await persist(true);
    await limparBackupsAntigos();
    BACKUPS_CACHE = await listarBackupsAutomaticos();
  }catch(e){ console.error('Falha ao gerar backup automático', e); }
}
async function gravarBackupAutomatico(data){
  const nucleo = {}; RHU_DOC_NUCLEO.forEach(k=>{ nucleo[k]=S[k]===undefined?null:S[k]; });
  await window.FB.setDoc(window.FB.doc(window.FB.db, 'rhu_backups', data), {data, criadoEm: new Date().toISOString()});
  await window.FB.setDoc(window.FB.doc(window.FB.db, 'rhu_backups', data, 'partes', 'nucleo'), nucleo);
  for(const nome of RHU_DOC_LISTAS){
    await window.FB.setDoc(window.FB.doc(window.FB.db, 'rhu_backups', data, 'partes', nome), {itens: S[nome]||[]});
  }
}
async function limparBackupsAntigos(){
  try{
    const q = window.FB.query(window.FB.collection(window.FB.db,'rhu_backups'), window.FB.orderBy('data','desc'), window.FB.limit(60));
    const snap = await window.FB.getDocs(q);
    const docs = snap.docs;
    for(let i=30;i<docs.length;i++){ await window.FB.deleteDoc(window.FB.doc(window.FB.db,'rhu_backups',docs[i].id)); }
  }catch(e){ /* limpeza é best-effort */ }
}
async function listarBackupsAutomaticos(){
  try{
    const q = window.FB.query(window.FB.collection(window.FB.db,'rhu_backups'), window.FB.orderBy('data','desc'), window.FB.limit(30));
    const snap = await window.FB.getDocs(q);
    return snap.docs.map(d=>d.id);
  }catch(e){ return []; }
}
async function forcarBackupAgora(){
  try{
    const hoje = new Date().toISOString().slice(0,10);
    await gravarBackupAutomatico(hoje);
    S.ultimoBackupEm = hoje;
    await persist(true);
    await limparBackupsAntigos();
    BACKUPS_CACHE = await listarBackupsAutomaticos();
    toast('Backup de hoje atualizado.', 'success');
    renderContentOnly();
  }catch(e){ console.error(e); toast('Não foi possível gerar o backup agora.', 'danger'); }
}
async function restaurarBackupAutomatico(data){
  confirmAction('Restaurar o backup de '+formatarDataBR(data)+'? Isso substitui TODOS os dados atuais do sistema.', async ()=>{
    try{
      const nucleoSnap = await window.FB.getDoc(window.FB.doc(window.FB.db,'rhu_backups',data,'partes','nucleo'));
      if(!nucleoSnap.exists()){ toast('Backup não encontrado.','danger'); return; }
      const novo = {...nucleoSnap.data()};
      for(const nome of RHU_DOC_LISTAS){
        const snap = await window.FB.getDoc(window.FB.doc(window.FB.db,'rhu_backups',data,'partes',nome));
        novo[nome] = snap.exists() ? (snap.data().itens||[]) : [];
      }
      S = novo;
      migrateState();
      await persist(true);
      toast('Backup de '+formatarDataBR(data)+' restaurado.','success');
      render();
    }catch(e){ console.error(e); toast('Não foi possível restaurar o backup.','danger'); }
  }, {title:'Restaurar backup', confirmLabel:'Restaurar'});
}

function migrateState(){
  if(!S.atestados) S.atestados = [];
  if(!S.tiposAusencia) S.tiposAusencia = [...SEED_TIPOS_AUSENCIA];
  if(!S.bloqueios) S.bloqueios = [];
  if(!S.auditoria) S.auditoria = [];
  if(!S.config) S.config = {diasAlertaCritico:90, diasAlertaAtencao:180, formulaAbsenteismo:'Dias ausentes ÷ (Colaboradores ativos × dias úteis) × 100'};
  // Simplificação de acesso: mantém apenas contas de Gestor (Beatriz/admin e Colaborador foram removidos a pedido).
  const restantes = S.usuarios.filter(u=>u.perfil!=='admin' && u.perfil!=='colaborador');
  S.usuarios = restantes.length ? restantes : SEED_USUARIOS.map(u=>({...u}));
  S.usuarios.forEach(u=>{ u.verCID = true; });
  // Simplificação dos status de férias para o novo conjunto: Sem programação, Sugestão, Programada, Em gozo, Concluída (+ Cancelada interno)
  const MAPA_STATUS_ANTIGO = {'Não programada':'Sem programação','Solicitada':'Programada','Em análise':'Programada','Aprovada':'Programada','Em andamento':'Em gozo'};
  S.ferias.forEach(f=>{ if(MAPA_STATUS_ANTIGO[f.status]) f.status = MAPA_STATUS_ANTIGO[f.status]; });
  S.colaboradores.forEach(c=>{
    const semente = CICLO_SEMENTE_POR_MATRICULA[c.matricula];
    if(semente!=null && (!c._cicloAjustado)){ c.cicloSemente = semente; c._cicloAjustado = true; }
  });
  // Novo módulo de Cargos e Salários: adiciona as coleções e preenche colaboradores já existentes com os dados da planilha FIN
  if(!S.cargos) S.cargos = SEED_CARGOS.map(c=>({...c, id:'cg'+c.classe}));
  if(!S.beneficios) S.beneficios = [
    {id:'plano-saude', nome:'Plano de Saúde', valorMensal:0},
    {id:'vale-alimentacao', nome:'Vale-Alimentação', valorMensal:0}
  ];
  // Compatibilidade: versões antigas guardavam benefício por colaborador — não é mais usado (benefício agora é um total mensal único do cartório).
  S.colaboradores.forEach(c=>{ if(c.beneficios) delete c.beneficios; });
  if(!S.cenarios) S.cenarios = [];
  if(!S.ufespHistorico) S.ufespHistorico = [...SEED_UFESP_HISTORICO];
  if(!S.folhaHistorica) S.folhaHistorica = [...SEED_FOLHA_HISTORICA];
  if(S.config.percentualEncargos==null) S.config.percentualEncargos = PERCENTUAL_ENCARGOS_PADRAO;
  S.colaboradores.forEach(c=>{
    if(c._salarioAjustado) return;
    const dados = SALARIOS_POR_MATRICULA[c.matricula];
    if(dados){
      const atualizado = aplicarSalarioNoColaborador(c);
      Object.assign(c, atualizado);
    } else {
      if(c.tipoContrato==null) c.tipoContrato = 'CLT';
      if(c.historicoSalarial==null) c.historicoSalarial = [];
      if(c.historicoCargo==null) c.historicoCargo = [];
    }
    c._salarioAjustado = true;
  });
  // A pedido: Gabriella De Almeida Garrido Gomes, Sigmar Amaral e os desligados informais da planilha de
  // Cargos e Salários (bruno v/isa g/juliana/ronaldo/daniel) não são mais colaboradores — remove se já
  // tiverem sido adicionados por uma versão anterior do sistema.
  const NOMES_EXCLUIR = new Set(SEED_COLABS_SALARIO_EXTRA.map(s=>s.nomePlanilha));
  const antesRemocao = S.colaboradores.length;
  S.colaboradores = S.colaboradores.filter(c=>!NOMES_EXCLUIR.has(c.nome));
  if(S.colaboradores.length!==antesRemocao){
    logAudit('remocao','colaborador', `Removidos ${antesRemocao-S.colaboradores.length} colaborador(es) que não fazem mais parte do quadro (importados indevidamente da planilha de Cargos e Salários).`);
  }
  // Bruna Barros Ferreira da Costa não é mais colaboradora — marca como Inativa (mantendo o histórico), uma única vez.
  const bruna = S.colaboradores.find(c=>c.nome==='Bruna Barros Ferreira da Costa');
  if(bruna && bruna.status!=='Inativo' && !bruna._brunaInativada){
    bruna.status = 'Inativo'; bruna._brunaInativada = true;
    logAudit('edicao','colaborador', 'Bruna Barros Ferreira da Costa marcada como Inativa — não faz mais parte do quadro.');
  }
  if(!S.tiposAusencia.includes('Licença nojo (falecimento)')) S.tiposAusencia.push('Licença nojo (falecimento)');
  // Importação do Cartão Ponto (faltas/ausências/atestados) — roda uma única vez, não duplica se já importado.
  if(!S._cartaoPontoImportado){
    const {ausencias, atestados} = construirAusenciasDoCartaoPonto(S.colaboradores);
    S.ausencias = S.ausencias.concat(ausencias);
    S.atestados = S.atestados.concat(atestados);
    S._cartaoPontoImportado = true;
    logAudit('importacao','ausencia', `Importou ${ausencias.length} registro(s) de ausência/falta e ${atestados.length} atestado(s) do Cartão Ponto (Secullum), período 01/01/2026 a 14/09/2026.`);
  }
  // Correção: registros já importados do Cartão Ponto antes de calcularmos as horas (ficaram com horas=0) — ajusta uma única vez.
  if(!S._cartaoPontoHorasCorrigidas){
    let corrigidos = 0;
    S.ausencias.forEach(a=>{ if(a.lancadoPor==='Importação Cartão Ponto' && !a.horas){ a.horas = horasUteisNoIntervalo(a.dataInicio, a.dataFim); corrigidos++; } });
    S.atestados.forEach(a=>{ if(a.lancadoPor==='Importação Cartão Ponto' && !a.horas){ a.horas = horasUteisNoIntervalo(a.dataInicial, a.dataFinal); corrigidos++; } });
    S._cartaoPontoHorasCorrigidas = true;
    if(corrigidos>0) logAudit('edicao','ausencia', `Corrigiu as horas de ${corrigidos} registro(s) importado(s) do Cartão Ponto (antes estavam zeradas).`);
  }
  // Correção: a licença-maternidade da Cristiane Viana da Silva estava truncada em 29 dias porque o relatório
  // do Cartão Ponto só ia até 14/09/2026 — na verdade são 120 dias corridos (17/08/2026 a 14/12/2026). Ajusta uma única vez.
  if(!S._licencaCristianeCorrigida){
    const cristiane = S.colaboradores.find(c=>c.matricula==='109');
    if(cristiane){
      const lic = S.ausencias.find(a=>a.colaboradorId===cristiane.id && a.tipo==='Licença maternidade/paternidade' && a.dataInicio==='2026-08-17');
      if(lic){
        lic.dataFim = '2026-12-14'; lic.dias = 120; lic.horas = horasUteisNoIntervalo(lic.dataInicio, lic.dataFim);
        logAudit('edicao','ausencia', 'Corrigiu a licença-maternidade de Cristiane Viana da Silva para os 120 dias corridos corretos (17/08 a 14/12/2026) — o relatório do Cartão Ponto só cobria até 14/09.');
      }
    }
    S._licencaCristianeCorrigida = true;
  }
  // Setor "Qualificação / Extrato" (st02) foi extinto — move todo mundo que estava lá (principal ou adicional)
  // para "Qualificação / Conferência" (st01), atualiza o histórico de ausências/atestados também, e marca o
  // setor antigo como inativo (mantido só para histórico, sem excluir nada). Roda uma única vez.
  if(!S._setorExtratoMigrado){
    const antigo = S.setores.find(s=>s.id==='st02');
    if(antigo){
      S.colaboradores.forEach(c=>{
        if(c.setorPrincipal==='st02') c.setorPrincipal = 'st01';
        if((c.outrosSetores||[]).includes('st02')){
          c.outrosSetores = c.outrosSetores.filter(s=>s!=='st02');
          if(!c.outrosSetores.includes('st01')) c.outrosSetores.push('st01');
        }
      });
      S.ausencias.forEach(a=>{ if(a.setorId==='st02') a.setorId='st01'; });
      antigo.ativo = false;
      logAudit('edicao','setor', 'Setor "Qualificação / Extrato" foi extinto — colaboradores e histórico movidos para "Qualificação / Conferência".');
    }
    S._setorExtratoMigrado = true;
  }
}

async function persist(immediate){
  clearTimeout(SAVE_TIMER);
  const doSave = async ()=>{
    try{ await dbSalvarTudo(); indicarSalvo(); }
    catch(e){ console.error('Falha ao salvar', e); toast('Não foi possível salvar — verifique sua conexão e tente de novo. Nada foi perdido na tela.', 'danger'); }
  };
  if(immediate) return doSave();
  SAVE_TIMER = setTimeout(doSave, 300);
}

function toast(msg, tone){
  tone = tone || 'success';
  const colors = {success:'var(--success)', danger:'var(--danger)', warning:'var(--warning)', info:'var(--info)'};
  const t = el(`<div style="position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:4px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:999;border-left:4px solid ${colors[tone]};max-width:340px;">${esc(msg)}</div>`);

  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2800);
}

// Confirmação própria do app (em vez do confirm() nativo do navegador, que pode ficar bloqueado ou ser
// ignorado dentro do ambiente do artefato publicado, fazendo o botão parecer que "não faz nada").
let CONFIRM_CALLBACK = null;
function confirmAction(message, onConfirm, opts){
  CONFIRM_CALLBACK = onConfirm;
  const foot = `<button class="btn" onclick="CONFIRM_CALLBACK=null;closeModal()">Cancelar</button><button class="btn btn-danger" onclick="executarConfirmAction()">${(opts&&opts.confirmLabel)||'Confirmar'}</button>`;
  openModal((opts&&opts.title)||'Confirmar ação', `<p>${esc(message)}</p>`, foot);
}
function executarConfirmAction(){
  const cb = CONFIRM_CALLBACK; CONFIRM_CALLBACK = null;
  closeModal();
  if(cb) cb();
}

function gerarAlertas(){
  const alertas = [];
  const hoje = todayISO();
  S.colaboradores.filter(c=>c.status==='Ativo').forEach(c=>{
    const calc = calcularFerias(S, c, hoje);
    if(!calc) return;
    if(calc.situacao==='VENCIDO') alertas.push({tone:'danger', tipo:'Férias vencidas', msg:`${c.nome} está com férias vencidas desde ${fmtD(calc.fimConcessivo)}.`, colaboradorId:c.id});
    else if(calc.situacao==='CRÍTICO') alertas.push({tone:'danger', tipo:'Férias próximas do vencimento', msg:`${c.nome}: limite para sair de férias em ${fmtD(calc.limiteGozo)}.`, colaboradorId:c.id});
    else if(calc.situacao==='PENDENTE' && calc.diasRestantes>=27) alertas.push({tone:'warning', tipo:'Saldo elevado', msg:`${c.nome} tem ${calc.diasRestantes} dias de férias sem programação.`, colaboradorId:c.id});
  });
  detectarConflitos(S).forEach(cf=>{
    alertas.push({tone:'danger', tipo:'Conflito de férias', msg:`${cf.ca.nome} e ${cf.cb.nome} — conflito no setor ${cf.setorNome}.`, feriasId:cf.fa.id});
  });
  return alertas;
}

function viewDashboard(){
  const hoje = todayISO();
  const ativos = S.colaboradores.filter(c=>c.status==='Ativo');
  const calcs = ativos.map(c=>({c, calc:calcularFerias(S,c,hoje)})).filter(x=>x.calc);
  const semProgramacao = calcs.filter(x=>['PENDENTE','ATENÇÃO'].includes(x.calc.situacao)).length;
  const proximoVencimento = calcs.filter(x=>x.calc.situacao==='CRÍTICO').length;
  const programadasFaltamTirar = S.ferias.filter(f=>f.status==='Programada').length;

  const mesAtual = new Date().getMonth();
  const anoAtual = new Date().getFullYear();
  const atestadosMes = S.atestados.filter(a=>{ const d=parseD(a.dataInicial); return d && d.getMonth()===mesAtual && d.getFullYear()===anoAtual; });

  const feriasHoje = S.ferias.filter(f=>{
    if(f.status==='Cancelada' || !f.dataSaida || !f.diasGozados) return false;
    const cc = S.colaboradores.find(x=>x.id===f.colaboradorId);
    if(!cc || cc.status!=='Ativo') return false;
    const fimISO = isoOf(addDays(parseD(f.dataSaida), Number(f.diasGozados)-1));
    return hoje>=f.dataSaida && hoje<=fimISO;
  }).map(f=>{
    const c = S.colaboradores.find(x=>x.id===f.colaboradorId);
    const inicio = parseD(f.dataSaida);
    const fim = addDays(inicio, Number(f.diasGozados)-1);
    const diaAtual = daysBetween(inicio, parseD(hoje)) + 1;
    return {f, c, inicio, fim, diaAtual};
  }).sort((a,b)=> (a.c?.nome||'').localeCompare(b.c?.nome||''));

  // Afastados por atestado médico hoje (só atestados — licença é separada, não é "doença")
  const afastadosHojeIds = new Set();
  S.atestados.forEach(a=>{ if(a.dataInicial && a.dataFinal && hoje>=a.dataInicial && hoje<=a.dataFinal) afastadosHojeIds.add(a.colaboradorId); });

  // Licenças (maternidade/paternidade, nojo etc.) — ativas hoje, futuras próximas, ou encerradas há pouco tempo
  const licencas = S.ausencias.filter(a=>{
    const tipo = (a.tipo||'').toLowerCase();
    if(!tipo.includes('licença')) return false;
    const cc = S.colaboradores.find(x=>x.id===a.colaboradorId);
    return cc && cc.status==='Ativo';
  }).map(a=>{
    let statusLicenca, tone;
    if(hoje>=a.dataInicio && hoje<=a.dataFim){ statusLicenca='Em andamento'; tone='brass'; }
    else if(hoje<a.dataInicio){ statusLicenca='Programada'; tone='info'; }
    else { statusLicenca='Encerrada'; tone='neutral'; }
    return {...a, statusLicenca, tone};
  }).sort((a,b)=>{
    const ordem = {'Em andamento':0,'Programada':1,'Encerrada':2};
    if(ordem[a.statusLicenca]!==ordem[b.statusLicenca]) return ordem[a.statusLicenca]-ordem[b.statusLicenca];
    return b.dataInicio.localeCompare(a.dataInicio);
  });
  const licencasAtivasAgora = licencas.filter(l=>l.statusLicenca==='Em andamento').length;

  return `
  <div class="grid grid-4" style="margin-bottom:18px;">
    <div class="card stat-card clickable" onclick="COLAB_FILTER.status='Ativo';navigate('colaboradores')"><div class="label">Colaboradores ativos</div><div class="value">${ativos.length}</div></div>
    <div class="card stat-card accent-brass clickable" onclick="document.getElementById('dash-ferias-hoje').scrollIntoView({behavior:'smooth'})"><div class="label">De férias hoje</div><div class="value">${feriasHoje.length}</div><div class="sub">${fmtD(parseD(hoje))} · atualiza sozinho</div></div>
    <div class="card stat-card accent-warning clickable" onclick="navigate('atestados')"><div class="label">Atestados vigentes (doença)</div><div class="value">${afastadosHojeIds.size}</div><div class="sub">hoje</div></div>
    <div class="card stat-card accent-brass clickable" onclick="mostrarLicencasHojeModal()"><div class="label">Em licença hoje</div><div class="value">${licencasAtivasAgora}</div><div class="sub">maternidade, paternidade, nojo...</div></div>
    <div class="card stat-card clickable" onclick="navigate('ferias-programacao')"><div class="label">Férias programadas a tirar</div><div class="value">${programadasFaltamTirar}</div></div>
    <div class="card stat-card clickable" onclick="PERIODOS_FILTER.situacao='PENDENTE';PERIODOS_FILTER.setor='';navigate('ferias-periodos')"><div class="label">Férias sem programação</div><div class="value">${semProgramacao}</div></div>
    <div class="card stat-card accent-warning clickable" onclick="PERIODOS_FILTER.situacao='CRÍTICO';PERIODOS_FILTER.setor='';navigate('ferias-periodos')"><div class="label">Férias próx. do vencimento</div><div class="value">${proximoVencimento}</div></div>
    <div class="card stat-card clickable" onclick="navigate('atestados')"><div class="label">Atestados no mês</div><div class="value">${atestadosMes.length}</div></div>
  </div>

  <div class="card card-pad" style="margin-bottom:16px;" id="dash-ferias-hoje">
    <div class="section-head" style="margin-bottom:10px;"><h3 style="font-size:15px;">🏖 Quem está de férias hoje (${fmtD(parseD(hoje))})</h3><span class="small muted">Atualiza sozinho conforme a data</span></div>
    ${feriasHoje.length===0? `<div class="empty-state" style="padding:16px;">Ninguém de férias hoje.</div>` :
      `<div class="table-wrap"><table>
        <thead><tr><th>Colaborador</th><th>Setor</th><th>Início</th><th>Fim</th><th>Dia do período</th><th>Backup</th><th>Observação</th></tr></thead>
        <tbody>${feriasHoje.map(x=>`<tr style="cursor:pointer;" onclick="navigate('colaborador-ficha',{id:'${x.c?.id}'})">
          <td class="name-cell">${esc(x.c?.nome||'—')}</td><td>${esc(setorNome(x.c?.setorPrincipal))}</td>
          <td>${fmtD(x.inicio)}</td><td>${fmtD(x.fim)}</td>
          <td>${selo('dia '+x.diaAtual+' de '+x.f.diasGozados,'brass')}</td>
          <td>${x.f.backupId? esc(colabNome(x.f.backupId)) : '—'}</td>
          <td class="small">${esc(x.f.observacao||'—')}</td>
        </tr>`).join('')}</tbody>
      </table></div>`}
  </div>

  <div class="card card-pad">
    <div class="section-head" style="margin-bottom:10px;"><h3 style="font-size:15px;">Férias programadas em ${new Date().getFullYear()}</h3><a href="#" onclick="navigate('ferias-programacao');return false;" class="small">Ver programação →</a></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Colaborador</th><th>Setor</th><th>Saída / Mês</th><th>Dias</th><th>Status</th><th>Observação</th></tr></thead>
      <tbody>
      ${S.ferias.filter(f=>{
          if(f.status==='Cancelada') return false;
          const cc=S.colaboradores.find(x=>x.id===f.colaboradorId);
          if(!cc || cc.status!=='Ativo') return false;
          const anoAtual = new Date().getFullYear();
          if(f.dataSaida) return parseD(f.dataSaida).getFullYear()===anoAtual;
          // sem data exata: usa o campo "ano" da própria programação (ex.: agendada só com "Mês programado")
          return Number(f.ano)===anoAtual && f.mesProgramado;
        }).sort((a,b)=>{
          const chaveA = a.dataSaida || (String(a.ano)+'-'+String(mesIndexFromToken((a.mesProgramado||'').split('/')[0])+1).padStart(2,'0')+'-01');
          const chaveB = b.dataSaida || (String(b.ano)+'-'+String(mesIndexFromToken((b.mesProgramado||'').split('/')[0])+1).padStart(2,'0')+'-01');
          return chaveA.localeCompare(chaveB);
        }).map(f=>{
        const c = S.colaboradores.find(x=>x.id===f.colaboradorId);
        return `<tr style="cursor:pointer;" onclick="navigate('colaborador-ficha',{id:'${c?.id}'})"><td class="name-cell">${esc(c?c.nome:'—')}</td><td>${esc(setorNome(c?c.setorPrincipal:null))}</td><td>${f.dataSaida? fmtD(parseD(f.dataSaida)) : esc(f.mesProgramado||'—')+' <span class="muted small">(sem data exata)</span>'}</td><td>${f.diasGozados||'—'}</td><td>${selo(f.status, statusFeriasTone(f.status))}</td><td class="small">${esc(f.observacao||'—')}</td></tr>`;
      }).join('') || `<tr><td colspan="6" class="muted">Nenhuma férias programada para este ano.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
let COLAB_FILTER = {status:'Ativo', setor:'', busca:''};

function tempoDeCasa(colaborador){
  const admissao = parseD(colaborador.admissao);
  if(!admissao) return '—';
  const referencia = (colaborador.status==='Inativo' && colaborador.desligamento) ? parseD(colaborador.desligamento) : parseD(todayISO());
  let anos = referencia.getFullYear() - admissao.getFullYear();
  let meses = referencia.getMonth() - admissao.getMonth();
  if(referencia.getDate() < admissao.getDate()) meses--;
  if(meses < 0){ anos--; meses += 12; }
  if(anos < 0) return '—';
  const partes = [];
  if(anos>0) partes.push(`${anos} ano${anos>1?'s':''}`);
  partes.push(`${meses} ${meses===1?'mês':'meses'}`);
  return partes.join(' e ');
}

function atualizarFaixaLivePreview(){
  const box = q('#cf-faixa-preview'); if(!box) return;
  const classe = q('#cf-cargo-classe').value;
  const salario = Number(q('#cf-salario-atual').value);
  if(!classe || !salario){ box.innerHTML=''; return; }
  const cargo = cargoPorClasse(S, classe);
  const fx = situacaoFaixa(cargo, salario);
  if(fx.status==='dentro') box.innerHTML = `<div class="banner info">✓ Dentro da faixa (equivalente à letra ${fx.letra}) — faixa vai de ${fmtMoeda(fx.minimo)} a ${fmtMoeda(fx.maximo)}.</div>`;
  else if(fx.status==='abaixo') box.innerHTML = `<div class="banner warn">⚠ Salário ABAIXO da faixa mínima (${fmtMoeda(fx.minimo)}) para esta classe.</div>`;
  else if(fx.status==='acima') box.innerHTML = `<div class="banner warn">⚠ Salário ACIMA da faixa máxima (${fmtMoeda(fx.maximo)}) para esta classe.</div>`;
  else box.innerHTML='';
}
function fmtMoeda(v){ return v==null? '—' : 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function salvarColaborador(id){
  const form = q('#f-colab');
  if(!form.reportValidity()) return;
  const d = fieldsToObj(form);
  d.outrosSetores = checkedValues('outrosSetores', form);
  d.jornadaHorasDia = Number(d.jornadaHorasDia)||8;
  d.jornadaHorasSemana = Number(d.jornadaHorasSemana)||40;
  d.cicloSemente = Number(d.cicloSemente)||0;
  d.cargoClasse = d.cargoClasse? Number(d.cargoClasse) : null;
  d.salarioAtual = d.salarioAtual? Number(d.salarioAtual) : null;
  const cargoObj = d.cargoClasse? cargoPorClasse(S, d.cargoClasse) : null;
  d.cargoTexto = cargoObj? cargoObj.nome : (d.cargo||'');
  const motivo = d.motivoAlteracao; delete d.motivoAlteracao;

  if(id){
    const c = S.colaboradores.find(x=>x.id===id);
    const antes = {...c};
    Object.assign(c, d);
    if(!c.historicoSalarial) c.historicoSalarial = [];
    const mudouSalario = antes.salarioAtual!==c.salarioAtual;
    const mudouCargo = (antes.cargoTexto||'')!==(c.cargoTexto||'');
    if(mudouSalario || mudouCargo){
      c.historicoSalarial.unshift({
        id:'hs'+Date.now(), data: todayISO(),
        cargoAnterior: antes.cargoTexto||antes.cargo||'—', cargoNovo: c.cargoTexto||'—',
        salarioAnterior: antes.salarioAtual, salarioNovo: c.salarioAtual,
        diferenca: (antes.salarioAtual!=null && c.salarioAtual!=null) ? Math.round((c.salarioAtual-antes.salarioAtual)*100)/100 : null,
        motivo: motivo || (mudouCargo?'Alteração de cargo':'Alteração salarial'), observacao:''
      });
      logAudit('edicao','colaborador', `${c.nome}: cargo ${antes.cargoTexto||'—'} → ${c.cargoTexto||'—'}, salário ${fmtMoeda(antes.salarioAtual)} → ${fmtMoeda(c.salarioAtual)}`);
    } else {
      logAudit('edicao','colaborador', `Editou colaborador ${c.nome} (antes: setor ${setorNome(antes.setorPrincipal)} → depois: ${setorNome(c.setorPrincipal)})`);
    }
    toast('Colaborador atualizado.');
  } else {
    const novo = {id:'c'+Date.now(), historicoSalarial:[], historicoCargo:[], ...d};
    if(novo.salarioAtual!=null){
      novo.historicoSalarial.push({id:'hs'+Date.now(), data:todayISO(), cargoAnterior:'—', cargoNovo:novo.cargoTexto||'—', salarioAnterior:null, salarioNovo:novo.salarioAtual, diferenca:null, motivo: motivo||'Admissão', observacao:''});
    }
    S.colaboradores.push(novo);
    logAudit('criacao','colaborador', `Cadastrou colaborador ${novo.nome}`);

  persist(); closeModal(); render();
}

function salvarSetor(id){
  const form = q('#f-setor'); if(!form.reportValidity()) return;
  const d = fieldsToObj(form);
  if(id){ Object.assign(S.setores.find(x=>x.id===id), d); logAudit('edicao','setor',`Editou setor ${d.nome}`); }
  else { S.setores.push({id:'st'+Date.now(), ...d}); logAudit('criacao','setor',`Criou setor ${d.nome}`); }
  persist(); closeModal(); render(); toast('Setor salvo.');
}

  let colabs = S.colaboradores.filter(c=>c.status==='Ativo');
  if(ESCALA_FILTER.setor) colabs = colabs.filter(c=>setoresDoColaborador(c).includes(ESCALA_FILTER.setor));

  colabs.sort((a,b)=>a.nome.localeCompare(b.nome));

  const conflitos = detectarConflitos(S);
  const conflitantesIds = new Set();
  conflitos.forEach(cf=>{ conflitantesIds.add(cf.fa.id); conflitantesIds.add(cf.fb.id); });

  const colorFor = (idx)=>{
    const palette = ['#B08D57','#3A6EA5','#3F6E52','#8C6D3F','#6A5ACD','#B23A2E','#2D8C8C','#C77E2A'];
    return palette[idx % palette.length];
  };

  const rows = colabs.map((c,ci)=>{
    const registros = S.ferias.filter(f=>f.colaboradorId===c.id && f.ano===ESCALA_FILTER.ano);

      const regsNoMes = registros.filter(f=>mesesDoRegistro(f).some(t=>mesIndexFromToken(t)===mi) || (f.dataSaida && parseD(f.dataSaida).getMonth()===mi));

    return `<tr><td class="gname">${esc(c.nome)}<div class="small muted">${esc(setorNome(c.setorPrincipal))}</div></td>${cells}</tr>`;
